<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Safety Replication Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Schibsted+Grotesk:wght@400..800&display=swap">
<style>
/* Design: a library. Each study is a book on a shelf, bound in the colour of its replication status; unbound pale spines have no independent re-run yet. Colour belongs to status only; the chrome is ink on paper, with wood for the shelves. */
:root {
  --paper: #f3f0e8;
  --paper2: #e9e3d5;
  --card: #fcfbf7;
  --ink: #1f1c17;
  --ink2: #4a453c;
  --muted: #746c5f;
  --rule: #d8d0bf;
  --rule2: #e5dfd2;
  --wood: #5a3e26;
  --wood2: #7c5838;
  --rep: #2e5e47;
  --part: #b38429;
  --cond: #3b5a80;
  --cont: #8c3936;
  --none: #a89f8b;
  --fail: #8c3936;
  --ext: #8a8170;
  --unbound: #f9f6ef;
  --on-cloth: #f6f1e6;
  --serif: "Libre Caslon Text", "Iowan Old Style", Georgia, serif;
  --display: "Libre Caslon Display", "Libre Caslon Text", Georgia, serif;
  --sans: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #171512;
    --paper2: #201d18;
    --card: #1f1c18;
    --ink: #ece6da;
    --ink2: #c8c0b1;
    --muted: #9b9282;
    --rule: #3a342b;
    --rule2: #2c2822;
    --wood: #6b4a2e;
    --wood2: #8a6340;
    --rep: #4f9a76;
    --part: #d2a648;
    --cond: #6f93c4;
    --cont: #c4625c;
    --none: #7f776a;
    --fail: #c4625c;
    --ext: #9b9282;
    --unbound: #2a2620;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 16px/1.55 var(--sans); }
a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--muted); text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:hover { text-decoration-color: currentColor; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 2px; }
main:focus { outline: none; }
[id] { scroll-margin-top: 84px; }
h1, h2, h3 { margin: 0; font-weight: 400; }
h1 { font: 400 40px/1.1 var(--display); letter-spacing: -0.01em; }
h2 { font: 400 29px/1.15 var(--display); }
h3 { font: 700 17px/1.3 var(--serif); }
p { margin: 0 0 14px; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 28px; }
.read { max-width: 720px; }
.serif { font-family: var(--serif); font-size: 16.5px; line-height: 1.7; }
.lead { font: 400 19px/1.6 var(--serif); color: var(--ink2); max-width: 660px; margin-top: 16px; }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }
.skip { position: absolute; left: -9999px; top: 8px; background: var(--ink); color: var(--paper); padding: 8px 12px; z-index: 50; }
.skip:focus { left: 8px; }

/* Header */
.site-head { background: var(--paper); border-bottom: 1px solid var(--rule); position: sticky; top: 0; z-index: 20; }
.head-inner { display: flex; align-items: center; gap: 28px; min-height: 66px; }
.brand { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; font: 400 19px/1.1 var(--display); white-space: nowrap; }
.brand-tag { font: 600 11.5px/1 var(--sans); color: var(--muted); border: 1px solid var(--rule); border-radius: 99px; padding: 4px 8px; }
.logo { display: inline-flex; align-items: flex-end; gap: 2px; height: 24px; padding-bottom: 2px; border-bottom: 2px solid var(--wood); }
.logo i { display: block; width: 5px; border-radius: 1px 1px 0 0; }
.logo i:nth-child(1) { height: 18px; background: var(--rep); }
.logo i:nth-child(2) { height: 22px; background: var(--cond); }
.logo i:nth-child(3) { height: 16px; background: var(--part); }
.logo i:nth-child(4) { height: 20px; background: var(--unbound); box-shadow: inset 0 0 0 1px var(--none); transform: rotate(9deg); transform-origin: bottom left; margin-left: 2px; }
.nav { display: flex; align-items: center; gap: 2px; margin-left: auto; overflow-x: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav a { text-decoration: none; color: var(--muted); font-size: 14.5px; font-weight: 550; padding: 8px 10px; white-space: nowrap; }
.nav a:hover { color: var(--ink); }
.nav a[aria-current="page"] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--ink); }
.nav .sep { width: 1px; height: 20px; background: var(--rule); margin: 0 8px; flex: none; }

/* Status colour plumbing */
.s-rep { --c: var(--rep); } .s-part { --c: var(--part); } .s-cond { --c: var(--cond); } .s-cont { --c: var(--cont); }
.s-none { --c: var(--none); } .s-fail { --c: var(--fail); } .s-ext { --c: var(--ext); }
.sw { display: inline-block; width: 8px; height: 15px; border-radius: 1.5px 1.5px 0 0; background: var(--c); flex: none; }
.sw.s-none, .sw.s-ext { background: var(--unbound); box-shadow: inset 0 0 0 1px var(--c); }
.status { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; color: var(--ink); }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 18px; border-radius: 3px; font: 600 15px/1.2 var(--sans); background: var(--ink); color: var(--paper); border: 1px solid var(--ink); text-decoration: none; cursor: pointer; }
.btn:hover { opacity: 0.88; }
.btn.quiet { background: transparent; color: var(--ink); border-color: var(--ink); }
.btn.quiet:hover { background: var(--card); opacity: 1; }
.btn.small { padding: 7px 12px; font-size: 14px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }

/* Hero and the stacks */
.hero { padding-top: 64px; padding-bottom: 56px; }
.hero h1 { font-size: clamp(38px, 5.2vw, 64px); line-height: 1.04; max-width: 17em; letter-spacing: -0.015em; }
.hero .lead strong { color: var(--ink); font-weight: 700; }
.stacks { margin-top: 52px; }
.stacks-cap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 20px; align-items: baseline; margin-bottom: 14px; }
.stacks-cap p { margin: 0; font-size: 14px; color: var(--ink2); }
.case { background: var(--paper2); border: 1px solid var(--rule); border-radius: 4px; padding: 30px 30px 14px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 30px 40px; }
.shelf { min-width: 0; }
.books { display: flex; align-items: flex-end; gap: 1.5px; height: 178px; padding: 0 6px; }
.book { flex: 0 1 var(--w); min-width: 11px; width: var(--w); height: var(--h); background-color: var(--c); color: var(--on-cloth); border-radius: 2px 2px 0 0; display: flex; justify-content: center; padding-top: 14px; text-decoration: none; overflow: hidden;
  background-image: linear-gradient(to bottom, transparent 7px, rgba(255, 255, 255, 0.28) 7px, rgba(255, 255, 255, 0.28) 8px, transparent 8px, transparent 10px, rgba(255, 255, 255, 0.28) 10px, rgba(255, 255, 255, 0.28) 11px, transparent 11px),
    linear-gradient(to top, transparent 7px, rgba(255, 255, 255, 0.22) 7px, rgba(255, 255, 255, 0.22) 8px, transparent 8px);
  box-shadow: inset -2px 0 0 rgba(0, 0, 0, 0.14), inset 1px 0 0 rgba(255, 255, 255, 0.1);
  transition: transform 0.16s ease; }
.book span { writing-mode: vertical-rl; font: 600 10.5px/1 var(--sans); letter-spacing: 0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-height: calc(100% - 26px); }
.book.s-part { color: #1f1c17; }
.book.s-none { background-color: var(--unbound); color: var(--ink2); box-shadow: inset 0 0 0 1px var(--none);
  background-image: linear-gradient(to bottom, transparent 7px, var(--rule) 7px, var(--rule) 8px, transparent 8px), linear-gradient(to top, transparent 7px, var(--rule) 7px, var(--rule) 8px, transparent 8px); }
.book:hover, .book:focus-visible { transform: translateY(-9px); }
.board { height: 9px; background: linear-gradient(var(--wood2), var(--wood)); border-radius: 1px; box-shadow: 0 4px 8px rgba(60, 40, 20, 0.16); }
.shelf-label { display: block; margin-top: 11px; text-decoration: none; font-size: 13.5px; line-height: 1.3; color: var(--ink2); }
.shelf-label b { display: block; color: var(--ink); font-weight: 600; }
.shelf-label:hover b { text-decoration: underline; }
.case.anim .book { animation: shelve 0.5s both cubic-bezier(0.2, 0.8, 0.3, 1); animation-delay: calc(var(--k) * 9ms); }
@keyframes shelve { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: none; } }
.legend { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 16px; font-size: 13.5px; color: var(--ink2); }
.legend span { display: inline-flex; align-items: center; gap: 8px; }
.legend b { color: var(--ink); font-weight: 600; }
.tip { position: fixed; z-index: 40; background: var(--ink); color: var(--paper); font-size: 13px; line-height: 1.35; padding: 8px 11px; border-radius: 3px; pointer-events: none; max-width: 300px; box-shadow: 0 6px 18px rgba(30, 20, 10, 0.2); }
.tip span { display: block; opacity: 0.75; font-size: 12px; margin-top: 2px; }

/* Sections */
.section { padding: 64px 0; border-top: 1px solid var(--rule); }
.section-head { max-width: 720px; margin-bottom: 30px; }
.section-head p { color: var(--ink2); margin-top: 12px; font: 400 17px/1.65 var(--serif); }
.cols3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.way { position: relative; background: var(--card); border: 1px solid var(--rule); border-radius: 3px; padding: 20px 22px 40px; box-shadow: 0 1px 0 var(--rule2), 0 3px 0 -1px var(--card), 0 4px 0 -1px var(--rule); }
.way::after { content: ""; position: absolute; left: 50%; bottom: 12px; width: 11px; height: 11px; margin-left: -5.5px; border-radius: 50%; background: var(--paper2); box-shadow: inset 0 0 0 1px var(--rule); }
.way h3 { font-size: 18px; padding-bottom: 10px; margin-bottom: 10px; border-bottom: 1px solid var(--rule2); }
.way p { color: var(--ink2); font-size: 15px; }
.way a.go { font-weight: 600; }
.statuses { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 20px 40px; }
.statuses div { display: grid; grid-template-columns: 14px 1fr; gap: 4px 10px; align-items: start; }
.statuses .sw { margin-top: 3px; }
.statuses b { font-weight: 650; }
.statuses p { grid-column: 2; margin: 0; color: var(--ink2); font-size: 15px; }
.page-head { padding: 52px 0 30px; }
.page-head h1 { font-size: clamp(34px, 4vw, 46px); }
.page-head .lead { margin-top: 12px; }

/* Shortfalls and changes */
.pairs { border-top: 1px solid var(--ink); }
.pair-head { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; font-size: 13.5px; font-weight: 650; color: var(--muted); padding: 12px 0; border-bottom: 1px solid var(--rule); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; padding: 26px 0; border-bottom: 1px solid var(--rule); }
.pair h3 { font-size: 18px; margin-bottom: 8px; }
.pair p { font: 400 15.5px/1.65 var(--serif); color: var(--ink2); margin: 0; }
.pair .next { position: relative; }
.pair .next::before { content: ""; position: absolute; left: -33px; top: 2px; bottom: 2px; width: 1px; background: var(--rule); }


.reasons { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 40px; border-top: 1px solid var(--ink); }
.reason { padding: 22px 0 26px; border-bottom: 1px solid var(--rule); }
.reason h3 { font-size: 18px; margin-bottom: 8px; }
.reason p { font: 400 15.5px/1.65 var(--serif); color: var(--ink2); margin: 0; }
.reason.start { border: 1.5px dashed var(--muted); border-radius: 4px; padding: 20px 22px; margin: 16px 0; background: var(--card); }

/* Coming next */
.coming { border: 1.5px dashed var(--muted); border-radius: 4px; padding: 34px; display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.3fr); gap: 40px; background: linear-gradient(var(--paper), var(--paper)) padding-box; }
.coming .tagline { display: inline-block; font: 600 12.5px/1 var(--sans); color: var(--ink2); border: 1px solid var(--rule); background: var(--card); border-radius: 99px; padding: 5px 10px; margin-bottom: 14px; }
.coming h2 { margin-bottom: 12px; }
.coming p { font: 400 16px/1.65 var(--serif); color: var(--ink2); }
.coming ul { list-style: none; margin: 0; padding: 0; }
.coming li { display: grid; grid-template-columns: 38px 1fr; gap: 14px; padding: 14px 0; border-top: 1px solid var(--rule2); }
.coming li:first-child { border-top: 0; padding-top: 0; }
.coming li b { display: block; font: 700 16px/1.3 var(--serif); color: var(--ink); margin-bottom: 3px; }
.coming li span { font-size: 15px; color: var(--ink2); }
.ghost { width: 38px; height: 46px; border: 1.5px dashed var(--muted); border-radius: 2px 2px 0 0; border-bottom: 3px solid var(--wood); }

/* Studies browser */
.browse { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 48px; padding-bottom: 80px; }
.filters { position: sticky; top: 86px; align-self: start; max-height: calc(100vh - 104px); overflow: auto; padding-right: 6px; }
.filters summary { display: none; }
.filters fieldset { border: 0; margin: 0 0 22px; padding: 0; }
.filters legend { font-size: 13.5px; font-weight: 650; color: var(--ink); margin-bottom: 6px; padding: 0; }
.opt { display: flex; align-items: center; gap: 9px; font-size: 14.5px; padding: 3px 0; cursor: pointer; color: var(--ink2); }
.opt input { margin: 0; accent-color: var(--ink); width: 15px; height: 15px; flex: none; }
.opt .n { margin-left: auto; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.opt.zero { opacity: 0.5; }
input[type="search"], input[type="text"], input[type="email"], input[type="number"], select, textarea {
  width: 100%; font: 400 15px/1.4 var(--sans); color: var(--ink); background: var(--card); border: 1px solid var(--rule); border-radius: 3px; padding: 9px 11px;
}
textarea { min-height: 88px; resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--ink); outline: none; box-shadow: 0 0 0 1px var(--ink); }
.results-bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--ink); flex-wrap: wrap; }
.results-bar select { width: auto; padding: 6px 10px; }
.results-bar .count { font-weight: 600; }
.linkish { background: none; border: 0; padding: 0; font: inherit; color: var(--ink); text-decoration: underline; text-decoration-color: var(--muted); text-underline-offset: 3px; cursor: pointer; }
.row { display: grid; grid-template-columns: 12px minmax(0, 1fr) 200px; gap: 22px; padding: 20px 0; border-bottom: 1px solid var(--rule); }
.row-spine { width: 12px; align-self: stretch; min-height: 64px; max-height: 96px; border-radius: 2px 2px 0 0; background: var(--c); border-bottom: 3px solid var(--wood); }
.row-spine.s-none { background: var(--unbound); box-shadow: inset 0 0 0 1px var(--none); }
.row h3 { font: 700 17.5px/1.3 var(--serif); }
.row h3 a { text-decoration: none; }
.row h3 a:hover { text-decoration: underline; }
.by { font-size: 13.5px; color: var(--muted); margin-top: 4px; }
.clamp { color: var(--ink2); font: 400 15px/1.6 var(--serif); margin: 8px 0 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row-meta { font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.row-meta .status { margin-bottom: 4px; }
.empty { padding: 40px 0; color: var(--ink2); }

/* Study page */
.crumbs { font-size: 13.5px; color: var(--muted); padding-top: 34px; }
.crumbs a { color: var(--muted); }
.study { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 60px; padding: 16px 0 80px; }
.study h1 { font-size: clamp(30px, 3.6vw, 42px); line-height: 1.1; }
.study .by { font-size: 15px; margin-top: 12px; }
.verdict { margin: 28px 0 8px; padding: 16px 18px 16px 20px; background: var(--card); border: 1px solid var(--rule); border-left: 10px solid var(--c); border-radius: 3px; }
.verdict.s-none { border-left-color: var(--unbound); box-shadow: inset 1px 0 0 var(--none); }
.verdict .status { font-size: 15px; }
.verdict p { margin: 6px 0 0; color: var(--ink2); font-size: 15px; }
.study h2 { font: 700 20px/1.3 var(--serif); margin: 40px 0 12px; }
.rep-item { padding: 16px 0; border-top: 1px solid var(--rule2); }
.study h2 + .rep-item { border-top: 0; padding-top: 4px; }
.rep-item .status { font-size: 13px; }
.rep-item h3 { font: 700 16px/1.4 var(--serif); margin: 6px 0 2px; }
.rep-item p { font: 400 15.5px/1.65 var(--serif); color: var(--ink2); margin: 6px 0 0; }
.ideas { padding-left: 20px; margin: 0; }
.ideas li { margin-bottom: 8px; font: 400 16px/1.65 var(--serif); }
.note { font-size: 14px; color: var(--ink2); background: var(--card); border: 1px solid var(--rule); border-radius: 3px; padding: 10px 12px; margin-top: 12px; }
.facts { margin: 0; }
.facts dt { font-size: 12.5px; font-weight: 650; color: var(--muted); }
.facts dd { margin: 2px 0 14px; font-size: 14.5px; color: var(--ink); overflow-wrap: anywhere; }
.aside-box { border: 1px solid var(--rule); background: var(--card); border-radius: 3px; padding: 18px; margin-bottom: 22px; }
.aside-box h3 { font-size: 16px; margin-bottom: 6px; }
.aside-box p { font-size: 14px; color: var(--ink2); }
.pager { display: flex; justify-content: space-between; gap: 20px; border-top: 1px solid var(--rule); padding-top: 16px; margin-top: 44px; font-size: 14.5px; }
.pager a { text-decoration: none; max-width: 48%; font-family: var(--serif); }
.pager span { display: block; color: var(--muted); font: 600 12.5px var(--sans); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12.5px; color: var(--ink2); border: 1px solid var(--rule); border-radius: 99px; padding: 1px 9px; }

/* Resources */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 18px; }
.chip { font: 550 13.5px/1.2 var(--sans); color: var(--ink2); background: var(--card); border: 1px solid var(--rule); border-radius: 99px; padding: 6px 12px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.res-group { margin-top: 38px; }
.res-group h2 { font-size: 24px; padding-bottom: 10px; border-bottom: 1px solid var(--ink); }
.res { padding: 18px 0; border-bottom: 1px solid var(--rule); display: grid; grid-template-columns: minmax(0, 1fr) 240px; gap: 24px; }
.res h3 { font-size: 16.5px; }
.res p { font: 400 15px/1.6 var(--serif); color: var(--ink2); margin: 6px 0 0; }
.res dl { margin: 0; font-size: 13.5px; }
.res dt { color: var(--muted); font-weight: 600; font-size: 12.5px; }
.res dd { margin: 1px 0 8px; color: var(--ink2); }

/* Long-form pages */
.prose { max-width: 720px; padding-bottom: 80px; font: 400 16.5px/1.7 var(--serif); }
.prose h2 { margin: 48px 0 12px; }
.prose h3 { margin: 26px 0 8px; }
.prose ul, .prose ol { padding-left: 22px; }
.prose li { margin-bottom: 8px; }
.prose .btn, .prose .linkish, .prose .copy-status, .prose table, .prose .small { font-family: var(--sans); }
.defs { margin: 0; font-family: var(--sans); font-size: 15.5px; }
.defs div { display: grid; grid-template-columns: 150px 1fr; gap: 14px; padding: 10px 0; border-top: 1px solid var(--rule2); }
.defs dt { font-weight: 650; display: flex; gap: 8px; align-items: center; }
.defs dd { margin: 0; color: var(--ink2); }
pre.template { background: var(--card); border: 1px solid var(--rule); border-radius: 3px; padding: 16px; font: 13.5px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; overflow-x: auto; }
.copy-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 12px 0; }
.copy-status { font-size: 13.5px; color: var(--muted); }
table.plain { border-collapse: collapse; width: 100%; font-size: 15px; margin: 8px 0 20px; }
table.plain th, table.plain td { text-align: left; padding: 9px 10px 9px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
table.plain th { font-size: 13px; color: var(--muted); font-weight: 650; border-bottom-color: var(--ink); }

/* Network */
.adds .cols3 { margin-top: 4px; }
.diagram { margin: 30px 0 10px; color: var(--ink); background: var(--card); border: 1px solid var(--rule); border-radius: 4px; padding: 10px 6px; }
.diagram svg { width: 100%; height: auto; display: block; }
.diagram .bx { fill: var(--card); stroke: var(--rule); stroke-width: 1.25; }
.diagram .bx.main { fill: var(--rep); fill-opacity: 0.1; stroke: var(--rep); stroke-width: 2; }
.diagram .ln { fill: none; stroke: var(--muted); stroke-width: 1.25; }
.diagram .hd { fill: var(--muted); }
.diagram .t1 { fill: var(--ink); font: 600 13px var(--sans); }
.diagram .t2 { fill: var(--ink2); font: 400 11.5px var(--sans); }

  function renderHome() {
    var cmpEM = '<a href="#/study/emergent-misalignment-2025">original emergent misalignment study</a>';

    var WHY = [
      ["Re-tests show which models a finding describes",
       'The <a href="#/study/alignment-faking-2024">original alignment faking study</a> found that Claude 3 Opus complied with harmful requests about 14% of the time when it believed the conversation would be used for training, and almost never otherwise. A <a href="https://arxiv.org/abs/2506.18032" target="_blank" rel="noopener">2025 test of 25 models</a> found a similar gap in five of them. Only in Claude 3 Opus did the gap look consistently driven by the model protecting its existing values. Anyone relying on the first result needs the second to know which models it describes.'],
      ["Re-tests show which part of a claim holds",
       'The <a href="#/study/sleeper-agents-2024">sleeper agents study</a> found that backdoors trained into a model survived safety training, most strongly in models trained to reason about deceiving their training. A <a href="https://www.alignmentforum.org/posts/mu7eJdesBkKuBycnY/sleeper-agent-backdoor-results-are-messy" target="_blank" rel="noopener">2026 rebuild on two Llama models</a> found that safety fine-tuning often failed to remove the backdoor, so the main result held. Whether a backdoor survived depended on the optimiser, the learning rate and the model, though, and distilling the deceptive reasoning into the model made backdoors less robust, the reverse of the original finding. Re-tests so far suggest that claims that something can happen under the original conditions hold up best, while rates, rankings and explanations shift most.'],

      ["Automated research will need checking",
       'OpenAI <a href="https://openai.com/index/research-acceleration-view-inside-openai/" target="_blank" rel="noopener">reported in September 2026</a> that since June the total running time of agents across its research organisation has exceeded that of its human researchers, and it says an automated AI researcher can also be an automated safety or alignment researcher. Findings from such systems need checks that do not rest on trusting whoever produced them, and an independent re-run under stated conditions is such a check. Agents cannot yet do the re-running reliably: on <a href="#/study/paperbench-2025">PaperBench</a>, the best agent tested in 2025 averaged a replication score of 21.0% across 20 machine learning papers.'],

    var heroText = NETWORK

        '<p class="lead">This prototype builds on the AI Safety Replication Library, which records which of <strong>' + S.length + " AI safety findings</strong> have been re-tested by someone else, and under which conditions. It adds a way to request the missing re-tests, a pooled fund to pay for them, and coordinated runs that test findings under new conditions, starting with other languages. The forms on this site do not send anything yet.</p>" +
        '<div class="actions"><a class="btn" href="#/network">How the network would work</a><a class="btn quiet" href="#/vision">What re-tests have found</a></div>'
      : "<h1>Towards a science of AI safety whose findings can be checked</h1>" +
        '<p class="lead">Decisions about how AI systems are built, released and overseen draw on a small body of experiments. Each was run on particular models, prompts and settings at a particular time, and many have never been re-run by anyone else. This library is a first step: a record of which <strong>' + S.length + " AI safety findings</strong> have been re-tested, under which conditions, and what it would take to test the rest.</p>" +
        '<div class="actions"><a class="btn" href="#/studies">Browse the studies</a><a class="btn quiet" href="#/vision">What re-tests have found</a></div>';

      '<section class="section" id="why"><div class="section-head"><h2>Why re-testing is worth doing</h2><p>A published finding is a claim about the models, prompts, judges and settings it was tested on, at the time it was tested. Those conditions tend to drop out as the finding is cited. Re-running it, under the original conditions or with one of them changed, tells the people who rely on it three things the original paper cannot: which systems it describes, which part of it holds, and whether it is still true.</p><p class="small" style="font-family:var(--sans)"><a href="#/vision">What re-tests have found so far</a></p></div>' + why + "</section>" +
      '<section class="section" id="shortfalls"><div class="section-head"><h2>Where the evidence falls short, and what would improve it</h2><p>Five features of how AI safety evidence is produced make it hard to tell which findings hold. Each is documented in studies the library tracks, and each points to a change the field could make.</p></div>' + pairs + "</section>" +

      "</div></section>" + adds +
      '<section class="section"><div class="section-head"><h2>How to read a status</h2><p>Only re-runs by other authors count towards a status. A status records what we found in public sources, and it is not a judgement of the original work.</p></div><div class="statuses">' + statuses + "</div>" +
      '<p class="muted small" style="margin-top:22px;max-width:720px">Claim types matter when reading a status. Claims that something can happen under the original conditions tend to hold up, while rates, effect sizes and rankings are the claims most likely to shift on new models. The <a href="#/method">method page</a> defines each claim type.</p></section>' +

      '<div class="actions" style="margin-top:0"><a class="btn quiet" href="#/resources">Browse the resources</a><a class="btn quiet" href="#/guide">Choosing a study to replicate</a></div></section>' +

  function renderGuide() {
    app.innerHTML = '<div class="wrap"><div class="page-head"><h1>Choosing a study to replicate</h1><p class="lead">Three starting points, a checklist for before you run anything, notes on porting a study to another language and a one-page spec template.</p></div><div class="prose">' +
      "<h2>Three starting points</h2><p>Each link opens the studies list with filters applied, which you can change afterwards.</p><ul>" +
      '<li><b>Learn by replicating.</b> Starter studies with released code that run on API credits or a single GPU. <a href="' + PRESETS.learn.hash + '">Show ' + plural(PRESETS.learn.n, "study", "studies") + "</a></li>" +
      '<li><b>Fill a gap.</b> Studies nobody has independently re-run yet, where some or all of the original models can still be used. <a href="' + PRESETS.gap.hash + '">Show ' + plural(PRESETS.gap.n, "study", "studies") + "</a></li>" +
      '<li><b>Port to another language.</b> Starter and intermediate studies tested only in English. <a href="' + PRESETS.port.hash + '">Show ' + plural(PRESETS.port.n, "study", "studies") + "</a></li></ul>" +
      "<h2>Before you run anything</h2><ul>" +
      "<li>Write down the claim you are testing and the conditions it was shown under: models, prompts, sampling settings, judge and metric.</li>" +
      "<li>Decide what counts as a match before you run: the expected number and how close is close enough.</li>" +
      "<li>Decide which question you are asking. Re-running the original conditions tests whether the result holds. Running it on other models tests whether it recurs. The two can give different answers, so report which one you tested.</li>" +
      "<li>Pin model versions and providers. API routers can serve quantised weights or switch providers between calls, which changes results.</li>" +
      "<li>Sample more than once per prompt and report the variance. A single low-temperature sample hides instability.</li>" +
      "<li>Check any automated judge against human ratings on a sample, especially outside English.</li>" +
      "<li>Log every deviation from the original method and publish the log with the result, including null results.</li></ul>" +
      "<h2>Porting a study to another language</h2><ul>" +
      "<li><b>Native or translated prompts.</b> Translation direction can change results. Use natively written prompts where you can, and keep a translated set so the two can be compared.</li>" +
      "<li><b>Realistic variants.</b> Text without diacritics, and mixed-language text such as Turkish with English terms, are conditions real users produce and models may handle differently.</li>" +
      "<li><b>Judge language.</b> An English-centred judge scoring non-English answers can be wrong in ways that bias the gap you measure. Check its agreement with native raters before trusting it.</li>" +
      "<li><b>Refusal is separate from uplift.</b> A model that answers in a weaker language may still give a useless answer. Score answer quality separately, using matched harmless tasks as a capability check.</li>" +

      "<li><b>Resource level.</b> Effects reported for low-resource languages may not hold for mid-resource languages such as Turkish. Set your expectations before you look at results.</li></ul>" +

  var SCOLS = ["id", "short_name", "title", "authors", "year", "organisation", "paper_url", "category", "core_claim", "claim_types", "original_models", "model_access", "models_still_available", "code_url", "data_url", "tooling", "compute_tier", "compute_note", "difficulty", "replication_status", "replications", "replication_search_limited", "languages_tested", "multilingual_port", "why_it_matters", "pitfalls", "replication_ideas", "tags"];

  function csv(rows, cols) {

  function renderMethod(section) {

    app.innerHTML = '<div class="wrap"><div class="page-head"><h1>Method</h1><p class="lead">What counts as a study, what each status and tier means, how the records were checked, and how to get the data.</p></div><div class="prose">' +
      "<h2>What counts as a study</h2><p>An empirical AI safety or alignment result that the field relies on, or that makes a good training replication, and that publishes enough detail to attempt a replication: code, data, prompts or a detailed method. Failed, conditional and contested replications are included on purpose.</p>" +
      "<h2>Replication status</h2><p>Only replications by different authors count towards a status. Work that builds on a result rather than re-testing it, including follow-ups by the original team, is listed as an extension. A status records what we found in public sources, and it is not a judgement of the original work.</p><dl class=\"defs\">" + statuses + "</dl>" +
      '<h2>Claim types</h2><dl class="defs">' +

      "<p>The distinction matters when reading a replication. Existence claims shown under the original conditions tend to hold up. Prevalence, magnitudes and rankings are the claims most likely to shift on new models.</p>" +

      "<p>Coverage is uneven: some areas, and work outside English, are thinner than others. The search for re-runs was cut short for " + LIMITED + ' studies. Their pages say so, and for them "no public replication found" means none turned up in a partial search.</p>' +

      '<p class="lead">Decisions about how artificial intelligence (AI) systems are built, tested and released rest on a small number of published experiments. The ' + ex("https://internationalaisafetyreport.org/publication/international-ai-safety-report-2026", "International AI Safety Report 2026") + " calls the position this leaves governments in an “evidence dilemma”: AI systems are becoming more capable quickly, while evidence about their risks emerges slowly and is hard to assess. Re-running an experiment is the most direct way to learn how much weight its result can bear.</p></div>" +

      '<section class="vsec"><h2>What re-tests have found so far</h2><p class="vintro">The library tracks ' + S.length + " studies and records " + reruns + " re-runs and follow-up studies of them. Counting only re-runs by other authors, " + countStatus("rep") + " studies have replicated, " + countStatus("part") + " have partially replicated, " + countStatus("cond") + " held only under some conditions and " + countStatus("cont") + " are contested. We found no independent re-run for the other " + countStatus("none") + ". For several widely cited findings, the re-test changed how far the result reaches.</p>" +

      }).join("") +
      '<div class="vnote"><h3>Re-tests also confirm results</h3><p>A confirmation tells the next researcher which results are safe to build on. A ' + ex("https://arxiv.org/abs/2508.00943", "re-test of the sandbagging set-up") + ' on ten newer models found that every model except Qwen2.5-7B could be prompted to underperform selectively on dangerous-capability questions, cutting their scores by 60% to 85%. The <a href="#/study/ai-sandbagging-2024">original sandbagging study</a> had shown the same behaviour in GPT-4 and Claude 3 Opus. Second Look Research ' + ex("https://www.lesswrong.com/posts/Dvqmgfeu2KDF7uMkx/internal-state-control-is-a-general-property-of-llms", "re-ran one of Anthropic’s introspection experiments") + ', on whether models represent a word more strongly when told to think about it, and found the effect in all 14 open-weight models they tested.</p></div>' +
      '<div class="vnote"><h3>Some kinds of claim hold up better than others</h3><p>Across the library, claims that something can happen have held up better than claims about how often it happens. The numbers are small and each status covers a whole study, so we treat this as a pattern to keep testing.</p>' + claimBars() + "</div>" +

      '<section class="vsec"><h2>What researchers in the field have said</h2><p class="vintro">AI developers, evaluation organisations, a government institute and a replication group have each argued that the field\'s evidence needs more checking.</p>' +
      '<div class="voices">' + VOICES.map(function (v) { return '<div class="voice"><h3>' + v[0] + "</h3><p>" + v[1] + "</p></div>"; }).join("") + "</div>" +
      '<p class="vintro" style="margin-top:22px">None of this says the original findings were wrong. The UK AI Security Institute authors write that their goal is not to dismiss the idea that AI systems may be scheming. In ' + ex("https://zephaniahdev.com/writing/meta_science", "Zephaniah Roe’s principles for AI safety replications") + ", the Second Look co-lead writes that influential papers that are plainly wrong are rare, and that the more common problem is results that are true in some sense but incomplete.</p></section>" +
      '<section class="vsec"><h2>What we would like the field to look like</h2><p class="vintro">We would like the findings that decisions rest on to be checked before those decisions are made.</p><ul class="vlist">' +
      "<li>Every finding that a developer, funder or government relies on would have a public status, stating which models, languages, prompts and judges it has been shown under, and who re-ran it. A reader could then tell whether a result applies to the system in front of them.</li>" +
      "<li>Load-bearing experiments would be re-run on each major model release. Second Look estimates that once a replication codebase exists, adding a new model takes a single terminal command.</li>" +
      "<li>Re-tests would be paid for whatever they find, so that a replication that fails earns as much as one that holds, and both would be published. Developers' safety claims, including those in model system cards, would come with enough code and method for an outside team to re-run them.</li>" +
      '<li>Automated judges would be checked against human raters in each language they are used in. In <a href="#/study/coin-flip-safety-judges-2026">an audit of 6,642 human-verified harmfulness labels</a>, four common safety judges were 51% to 59% accurate.</li>' +
      "<li>Groups in several countries would run shared protocols in their own languages, on models adapted for those languages. At present, " + ENGLISH_ONLY + " of the library's " + S.length + " studies tested English alone.</li></ul></section>" +
      '<section class="vsec"><h2>What we are building</h2><p>The AI Safety Replication Library is the first piece. It states each of ' + S.length + " studies with the conditions it was shown under, records every independent re-run we could find, and sets out what a new replication would take. Of the " + S.length + " studies, " + S.filter(function (s) { return s.compute_tier === "T0" || s.compute_tier === "T1"; }).length + " could be replicated for under about $500 in compute, and " + S.filter(function (s) { return s._code; }).length + " have released code.</p>" +
      "<p>The next piece is a replication network. Anyone could request a re-test through a public queue and name the decision it would inform. A pooled fund would pay teams when results are published, whatever they show. Groups in different places would run one protocol with one condition changed. The first pilot would replicate one finding in Turkish, Portuguese and a third language.</p>" + building + "</section>" +
      '<section class="vsec"><h2>What re-testing cannot show</h2><p>Re-testing improves the evidence about AI systems that exist today. It cannot show that a more capable future system is safe, because the decisive tests would have to run on systems that do not exist yet. Its value is in finding out which current results are weaker than they look before decisions rest on them.</p></section>' +

  function renderNetwork(section) {

      '<div class="diagram">' + loopSVG() + "</div>" +
      '<div class="prose">' +
      '<h2 id="record">The record</h2><p>The record is this library, extended so that every result is stored with the conditions it ran under: model and version, language, judge, prompts and settings. Each finding then carries a list of the conditions under which it held and failed, which a developer, evaluator or researcher can check before relying on it. Original authors can attach a reply to any result about their work.</p>' +
      '<h2 id="queue">The request queue</h2><p>Anyone can request a replication, including researchers, developers, evaluators and labs. Each request names the finding, the condition to test and the decision the result would inform, so that requests can be ranked by what they would change. A team claims a request and has 6 to 8 weeks to deliver before the claim lapses and the request returns to the queue.</p><p><a href="#/requests">See the open requests</a></p>' +
      '<h2 id="fund">The pooled fund</h2><p>Funders pay into one pooled fund, which pays teams on publication whatever the result, so that a replication that fails earns as much as one that holds. Labs can fund replications only through the pool, so that no lab pays directly for re-tests of its own work or a competitor\'s.</p><p><a href="#/take-part?form=fund">Pledge to the fund</a></p>' +
      '<h2 id="sites">Coordinated runs under new conditions</h2><p>Where a change of condition could change a result, the protocol runs at several sites at once, each with one condition changed. The condition can be a newer model release, another model family, another judge, a fine-tuned variant, a different test framing or another language. One senior reviewer checks each protocol once for all sites, so that review costs do not grow with the number of sites.</p>' +
      "<h3>Why start with language</h3><p>Language is one of the least-tested conditions in the library: of its " + S.length + " studies, " + ENGLISH_ONLY + ' tested English alone. It also changes several conditions at once, namely the prompts, the judge and, for models adapted to a language, the model itself. Groups working in a language know which adapted models are in use and can judge outputs natively. Later protocols would vary other conditions, such as re-running key experiments on each new model release.</p><p><a href="#/pilot">Read the proposed pilot</a> &nbsp; <a href="#/take-part?form=site">Offer to run a site</a></p>' +

  /* ---------- Network: pilot ---------- */
  function renderPilot() {

      '<h2>The finding</h2><p class="serif">The finding comes from <a href="#/study/' + PILOT_ID + '">Wang et al. (2025)</a>, published at the Conference on Neural Information Processing Systems (NeurIPS). On chat models including Llama 3.1 8B, Qwen 2.5 7B and Gemma 2 9B, a refusal direction taken from English activations removed refusals in other safety-aligned languages almost completely when ablated. Directions taken from three non-English safety-aligned languages also transferred to the others.</p>' +
      "<h2>Why this finding</h2><p>Language is the first condition the network would test, because it is under-tested and changes the prompts, the judge and, for adapted models, the model itself. Later protocols would vary other conditions, such as new model releases, fine-tuned variants and test framing.</p><ul><li>We found no independent replication.</li><li>The paper covered 14 languages, not including Turkish or Portuguese, so each site's language is an untested condition.</li><li>The paper tested only general-purpose models, so models adapted for a language are untested too.</li>" +
      '<li>The <a href="https://github.com/mainlp/Multilingual-Refusal" target="_blank" rel="noopener">code and translated prompt sets are public</a>, and the experiments run on a single graphics processing unit (GPU) for models of 7 to 9 billion parameters.</li></ul>' +
      "<p>The result would tell developers of locally adapted models whether adaptation preserves the refusal mechanism of the base model. It would also tell evaluators whether interventions built from English activations carry over to adapted models in other languages.</p>" +
      "<h2>What each site does</h2><ol>" +
      "<li>The site reproduces one of the paper's original conditions with the authors' code, so that the three sites' results can be compared with each other and with the paper.</li>" +
      "<li>It translates the paper's harmful and harmless prompts into its language, with native review, and runs the same tests on the paper's models.</li>" +
      "<li>It tests [two or three] open-weight models adapted for its language against their base models, for example KocDigital-LLM-8b against Llama 3 8B for Turkish.</li>" +
      "<li>Native speakers label [number] responses per language, and the site compares their labels with the WildGuard judge, which in the original paper scored English back-translations of the answers.</li></ol>" +
      "<h2>What counts as a result</h2><p>Before any runs, the protocol will fix what counts as each outcome. These are proposed starting points, to be confirmed at protocol review.</p><ul>" +
      "<li>On the shared original condition, each site's refusal rate after ablation falls within 10 percentage points of the published figure.</li>" +
      "<li>In each language, the judge's labels agree with native labels to within 5 percentage points.</li>" +

      '<h2>Schedule</h2><table class="plain"><thead><tr><th>Weeks</th><th>What happens</th></tr></thead><tbody>' +

      "<tr><td>Turkish</td><td>AI Safety Türkiye</td></tr><tr><td>Portuguese</td><td>[Research group to be confirmed]</td></tr><tr><td>[Third language]</td><td>[Research group to be confirmed]</td></tr></tbody></table>" +
      '<p>Each site commits one person for six weeks, in weeks 3 to 8, with compute and native raters paid from the pilot budget. <a href="#/take-part?form=site">Offer to run a site</a></p>' +
      '<h2>Budget</h2><p>Most of the cost is people\'s time. Compute is a small line: a Turkish re-run of a 55-model safety study, designed by AI Safety Türkiye, puts its core costs at about $300 to $500 for 20 to 25 models.</p><table class="plain"><thead><tr><th>Line</th><th>Basis</th><th>Cost</th></tr></thead><tbody>' +

    f.addEventListener("submit", function (e) {
      e.preventDefault();
      if (!requireFields([["p-amount", "Enter an amount."], ["p-name", "Enter a name or organisation."]])) return;
      var purpose = val("p-for") === "Replications in a particular language" ? "Replications in " + (val("p-lang") || "[language]") : val("p-for");
      var rows = [["Amount", Number(val("p-amount")).toLocaleString("en-GB") + " " + val("p-cur")], ["For", purpose], ["From", val("p-name") + (document.getElementById("p-lab").checked ? " (an AI developer)" : "")], ["Paid out", "On publication of each replication, whatever the result"], ["Contact", val("p-email")]];
      var text = "Pledge to the pooled replication fund\n\n" + rows.filter(function (r) { return r[1]; }).map(function (r) { return r[0] + ": " + r[1]; }).join("\n");
      showPreview(panel, "Your pledge", rows, text, document.getElementById("p-lab").checked ? "Gifts from AI developers go into the pool and cannot be earmarked for a particular study. Nothing has been sent." : "Nothing has been sent. Copy the text and email it to [contact address].");
    });
  }
  function formSite(panel) {
    panel.innerHTML = '<form class="form" id="f" novalidate>' +
      '<p class="small" style="color:var(--ink2)">A site contributes its language, the open-weight models adapted for that language and native speakers who can check results. For the pilot, each site commits one person for six weeks, with compute and native raters paid from the pilot budget.</p>' +
      '<div class="two">' + fld("g-name", "Research group or organisation", "", '<input type="text" id="g-name">') + fld("g-country", "Country", "", '<input type="text" id="g-country">') + "</div>" +
      fld("g-lang", "Language or languages", "", '<input type="text" id="g-lang">') +
      fld("g-models", "Open-weight models adapted for your language", "Name any you know of, and their base models if known.", '<textarea id="g-models"></textarea>') +
      fld("g-time", "Time you could commit", "", '<select id="g-time"><option>One person for six weeks</option><option>Less than one person for six weeks</option><option>More than one person for six weeks</option></select>') +
      '<div class="fld"><span class="lab">Native speakers available to label responses</span><div class="radios"><label><input type="radio" name="g-raters" value="Yes" checked> Yes</label><label><input type="radio" name="g-raters" value="Not yet"> Not yet</label></div></div>' +
      '<div class="two">' + fld("g-contact", "Contact name", "", '<input type="text" id="g-contact" autocomplete="name">') + fld("g-email", "Email", "", '<input type="email" id="g-email" autocomplete="email">') + "</div>" +
      '<button type="submit" class="btn">Preview the offer</button></form><div class="preview"></div>';
    var f = document.getElementById("f");
    f.addEventListener("submit", function (e) {
      e.preventDefault();
      if (!requireFields([["g-name", "Enter the group or organisation."], ["g-lang", "Enter at least one language."]])) return;
      var rows = [["Group", val("g-name") + (val("g-country") ? ", " + val("g-country") : "")], ["Languages", val("g-lang")], ["Adapted models", val("g-models")], ["Time", val("g-time")],
        ["Native raters", f.querySelector("input[name=g-raters]:checked").value], ["Contact", [val("g-contact"), val("g-email")].filter(Boolean).join(", ")]];
      var text = "Offer to run a site\n\n" + rows.filter(function (r) { return r[1]; }).map(function (r) { return r[0] + ": " + r[1]; }).join("\n");
      showPreview(panel, "Your offer to run a site", rows, text, "Nothing has been sent. Copy the text and email it to [contact address].");
    });
  }

  /* ---------- Misc ---------- */
  function renderMissing() {
    app.innerHTML = '<div class="wrap"><div class="page-head"><h1>Page not found</h1><p class="lead">That address does not match a page or a study. <a href="#/studies">Browse the studies</a> or go to the <a href="#/">home page</a>.</p></div></div>';
  }
  function copyText(text, statusEl) {
    function done(ok) { if (statusEl) { statusEl.textContent = ok ? "Copied." : "Copying failed. Select the text and copy it manually."; setTimeout(function () { statusEl.textContent = ""; }, 3000); } }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { done(true); }, function () { fallback(); });
    else fallback();
    function fallback() {
      var ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand("copy"); } catch (e) { ok = false; } document.body.removeChild(ta); done(ok);
    }
  }
  app.addEventListener("click", function (e) {
    var c = e.target.closest("[data-copy]");
    if (c) { copyText(dataText(c.getAttribute("data-copy")), c.parentNode.querySelector(".copy-status")); return; }
    var sc = e.target.closest("[data-scroll]");
    if (sc) { var t = document.getElementById(sc.getAttribute("data-scroll")); if (t) t.scrollIntoView({ behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); return; }
    var d = e.target.closest("[data-download]");
    if (d) saveFile(d.getAttribute("data-download"), d.parentNode.querySelector(".copy-status"));
  });
  /* Inside the Claude artifact viewer, files are offered through the downloads capability; opened as a plain file, a blob link does the job. */
  function saveFile(kind, statusEl) {
    var name = { json: "ai-safety-replication-library.json", scsv: "studies.csv", rcsv: "resources.csv" }[kind], data = dataText(kind);
    function blobSave() {
      var blob = new Blob([data], { type: kind === "json" ? "application/json" : "text/csv" });
      var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    }
    function failed() { if (statusEl) statusEl.textContent = "The download did not start. Use the copy links below instead."; }
    if (window.claude && typeof window.claude.use === "function") {
      window.claude.use("downloads").then(function (dl) {
        if (!dl) { blobSave(); return; }
        dl.save({ filename: name, data: data }).then(function () {}, function (err) { if (!err || err.code !== "declined") failed(); });
      }, blobSave);
    } else blobSave();
  }
  /* Tooltip for hero tiles */
  var tip = document.getElementById("tip");
  function showTip(el) {
    if (!el || !el.getAttribute("data-tip")) return;
    tip.innerHTML = esc(el.getAttribute("data-tip")) + "<span>" + esc(el.getAttribute("data-tip2")) + "</span>";
    tip.hidden = false;
    var r = el.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
    var x = Math.min(Math.max(8, r.left + r.width / 2 - tw / 2), window.innerWidth - tw - 8), y = r.top - th - 8;
    if (y < 8) y = r.bottom + 8;
    tip.style.left = x + "px"; tip.style.top = y + "px";
  }
  function hideTip() { tip.hidden = true; }
  app.addEventListener("mouseover", function (e) { var t = e.target.closest(".book"); if (t) showTip(t); else hideTip(); });
  app.addEventListener("focusin", function (e) { var t = e.target.closest(".book"); if (t) showTip(t); else hideTip(); });
  app.addEventListener("mouseleave", hideTip);
  window.addEventListener("scroll", hideTip, { passive: true });

  /* ---------- Router ---------- */
  function parse() {
    var h = location.hash.replace(/^#\/?/, ""), q = "", i = h.indexOf("?");
    if (i >= 0) { q = h.slice(i + 1); h = h.slice(0, i); }
    var parts = h.split("/");
    return { page: parts[0] || "home", arg: decodeURIComponent(parts.slice(1).join("/")), q: new URLSearchParams(q) };
  }
  var NET_PAGES = { network: 1, requests: 1, pilot: 1, "take-part": 1 };
  function route() {
    hideTip();
    var r = parse();
    document.getElementById("nav").innerHTML = navHTML(r.page);
    if (NET_PAGES[r.page] && !NETWORK) { renderMissing(); }
    else if (r.page === "home" || r.page === "why") { renderHome(); if (r.page === "why") { var wEl = document.getElementById("why"); if (wEl) setTimeout(function () { wEl.scrollIntoView(); }, 0); } }
    else if (r.page === "studies") renderStudies(r.q);
    else if (r.page === "study") renderStudy(r.arg);
    else if (r.page === "resources") renderResources(r.q);
    else if (r.page === "guide") renderGuide();
    else if (r.page === "method") renderMethod(r.arg);
    else if (r.page === "vision") renderVision();
    else if (r.page === "network") renderNetwork(r.arg);
    else if (r.page === "requests") renderRequests(r.q);
    else if (r.page === "pilot") renderPilot();
    else if (r.page === "take-part") renderTakePart(r.q);
    else renderMissing();
    var titles = { vision: "What re-testing has shown", why: "Why re-testing is worth doing", home: "", studies: "Studies", resources: "Resources", guide: "Choosing a study", method: "Method", network: "How it works", requests: "Requests", pilot: "Pilot", "take-part": "Take part" };
    var base = NETWORK ? "AI Safety Replication Network (prototype)" : "AI Safety Replication Library";
    var pageTitle = r.page === "study" && BYID[r.arg] ? shortName(BYID[r.arg]) : titles[r.page];
    document.title = pageTitle ? pageTitle + ", " + base : base;
    if ((!r.arg || r.page === "study") && r.page !== "why") window.scrollTo(0, 0);
    if (r.page !== "home") app.focus({ preventScroll: true });
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
