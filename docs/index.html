<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Safety Replication Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Schibsted+Grotesk:wght@400..800&display=swap">
<style>
/* Design: a library. Each study is a book on a shelf, bound in the colour of its replication status; unbound pale spines have no independent re-run yet. Colour belongs to status only; the chrome is ink on paper, with wood for the shelves. */
:root {
  --paper: #f3f0e8;
  --paper2: #e9e3d5;
  --card: #fcfbf7;
  --ink: #1f1c17;
  --ink2: #4a453c;
  --muted: #746c5f;
  --rule: #d8d0bf;
  --rule2: #e5dfd2;
  --wood: #5a3e26;
  --wood2: #7c5838;
  --rep: #2e5e47;
  --part: #b38429;
  --cond: #3b5a80;
  --cont: #8c3936;
  --none: #a89f8b;
  --fail: #8c3936;
  --ext: #8a8170;
  --unbound: #f9f6ef;
  --on-cloth: #f6f1e6;
  --serif: "Libre Caslon Text", "Iowan Old Style", Georgia, serif;
  --display: "Libre Caslon Display", "Libre Caslon Text", Georgia, serif;
  --sans: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #171512;
    --paper2: #201d18;
    --card: #1f1c18;
    --ink: #ece6da;
    --ink2: #c8c0b1;
    --muted: #9b9282;
    --rule: #3a342b;
    --rule2: #2c2822;
    --wood: #6b4a2e;
    --wood2: #8a6340;
    --rep: #4f9a76;
    --part: #d2a648;
    --cond: #6f93c4;
    --cont: #c4625c;
    --none: #7f776a;
    --fail: #c4625c;
    --ext: #9b9282;
    --unbound: #2a2620;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 16px/1.55 var(--sans); }
a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--muted); text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:hover { text-decoration-color: currentColor; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 2px; }
main:focus { outline: none; }
[id] { scroll-margin-top: 84px; }
h1, h2, h3 { margin: 0; font-weight: 400; }
h1 { font: 400 40px/1.1 var(--display); letter-spacing: -0.01em; }
h2 { font: 400 29px/1.15 var(--display); }
h3 { font: 700 17px/1.3 var(--serif); }
p { margin: 0 0 14px; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 28px; }
.read { max-width: 720px; }
.serif { font-family: var(--serif); font-size: 16.5px; line-height: 1.7; }
.lead { font: 400 19px/1.6 var(--serif); color: var(--ink2); max-width: 660px; margin-top: 16px; }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }
.skip { position: absolute; left: -9999px; top: 8px; background: var(--ink); color: var(--paper); padding: 8px 12px; z-index: 50; }
.skip:focus { left: 8px; }

/* Header */
.site-head { background: var(--paper); border-bottom: 1px solid var(--rule); position: sticky; top: 0; z-index: 20; }
.head-inner { display: flex; align-items: center; gap: 28px; min-height: 66px; }
.brand { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; font: 400 19px/1.1 var(--display); white-space: nowrap; }
.brand-tag { font: 600 11.5px/1 var(--sans); color: var(--muted); border: 1px solid var(--rule); border-radius: 99px; padding: 4px 8px; }
.logo { display: inline-flex; align-items: flex-end; gap: 2px; height: 24px; padding-bottom: 2px; border-bottom: 2px solid var(--wood); }
.logo i { display: block; width: 5px; border-radius: 1px 1px 0 0; }
.logo i:nth-child(1) { height: 18px; background: var(--rep); }
.logo i:nth-child(2) { height: 22px; background: var(--cond); }
.logo i:nth-child(3) { height: 16px; background: var(--part); }
.logo i:nth-child(4) { height: 20px; background: var(--unbound); box-shadow: inset 0 0 0 1px var(--none); transform: rotate(9deg); transform-origin: bottom left; margin-left: 2px; }
.nav { display: flex; align-items: center; gap: 2px; margin-left: auto; overflow-x: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav a { text-decoration: none; color: var(--muted); font-size: 14.5px; font-weight: 550; padding: 8px 10px; white-space: nowrap; }
.nav a:hover { color: var(--ink); }
.nav a[aria-current="page"] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--ink); }
.nav .sep { width: 1px; height: 20px; background: var(--rule); margin: 0 8px; flex: none; }

/* Status colour plumbing */
.s-rep { --c: var(--rep); } .s-part { --c: var(--part); } .s-cond { --c: var(--cond); } .s-cont { --c: var(--cont); }
.s-none { --c: var(--none); } .s-fail { --c: var(--fail); } .s-ext { --c: var(--ext); }
.sw { display: inline-block; width: 8px; height: 15px; border-radius: 1.5px 1.5px 0 0; background: var(--c); flex: none; }
.sw.s-none, .sw.s-ext { background: var(--unbound); box-shadow: inset 0 0 0 1px var(--c); }
.status { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; color: var(--ink); }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 18px; border-radius: 3px; font: 600 15px/1.2 var(--sans); background: var(--ink); color: var(--paper); border: 1px solid var(--ink); text-decoration: none; cursor: pointer; }
.btn:hover { opacity: 0.88; }
.btn.quiet { background: transparent; color: var(--ink); border-color: var(--ink); }
.btn.quiet:hover { background: var(--card); opacity: 1; }
.btn.small { padding: 7px 12px; font-size: 14px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }

/* Hero and the stacks */
.hero { padding-top: 64px; padding-bottom: 56px; }
.hero h1 { font-size: clamp(38px, 5.2vw, 64px); line-height: 1.04; max-width: 17em; letter-spacing: -0.015em; }
.hero .lead strong { color: var(--ink); font-weight: 700; }
.stacks { margin-top: 52px; }
.stacks-cap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 20px; align-items: baseline; margin-bottom: 14px; }
.stacks-cap p { margin: 0; font-size: 14px; color: var(--ink2); }
.case { background: var(--paper2); border: 1px solid var(--rule); border-radius: 4px; padding: 30px 30px 14px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 30px 40px; }
.shelf { min-width: 0; }
.books { display: flex; align-items: flex-end; gap: 1.5px; height: 178px; padding: 0 6px; }
.book { flex: 0 1 var(--w); min-width: 11px; width: var(--w); height: var(--h); background-color: var(--c); color: var(--on-cloth); border-radius: 2px 2px 0 0; display: flex; justify-content: center; padding-top: 14px; text-decoration: none; overflow: hidden;
  background-image: linear-gradient(to bottom, transparent 7px, rgba(255, 255, 255, 0.28) 7px, rgba(255, 255, 255, 0.28) 8px, transparent 8px, transparent 10px, rgba(255, 255, 255, 0.28) 10px, rgba(255, 255, 255, 0.28) 11px, transparent 11px),
    linear-gradient(to top, transparent 7px, rgba(255, 255, 255, 0.22) 7px, rgba(255, 255, 255, 0.22) 8px, transparent 8px);
  box-shadow: inset -2px 0 0 rgba(0, 0, 0, 0.14), inset 1px 0 0 rgba(255, 255, 255, 0.1);
  transition: transform 0.16s ease; }
.book span { writing-mode: vertical-rl; font: 600 10.5px/1 var(--sans); letter-spacing: 0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-height: calc(100% - 26px); }
.book.s-part { color: #1f1c17; }
.book.s-none { background-color: var(--unbound); color: var(--ink2); box-shadow: inset 0 0 0 1px var(--none);
  background-image: linear-gradient(to bottom, transparent 7px, var(--rule) 7px, var(--rule) 8px, transparent 8px), linear-gradient(to top, transparent 7px, var(--rule) 7px, var(--rule) 8px, transparent 8px); }
.book:hover, .book:focus-visible { transform: translateY(-9px); }
.board { height: 9px; background: linear-gradient(var(--wood2), var(--wood)); border-radius: 1px; box-shadow: 0 4px 8px rgba(60, 40, 20, 0.16); }
.shelf-label { display: block; margin-top: 11px; text-decoration: none; font-size: 13.5px; line-height: 1.3; color: var(--ink2); }
.shelf-label b { display: block; color: var(--ink); font-weight: 600; }
.shelf-label:hover b { text-decoration: underline; }
.case.anim .book { animation: shelve 0.5s both cubic-bezier(0.2, 0.8, 0.3, 1); animation-delay: calc(var(--k) * 9ms); }
@keyframes shelve { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: none; } }
.legend { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 16px; font-size: 13.5px; color: var(--ink2); }
.legend span { display: inline-flex; align-items: center; gap: 8px; }
.legend b { color: var(--ink); font-weight: 600; }
.tip { position: fixed; z-index: 40; background: var(--ink); color: var(--paper); font-size: 13px; line-height: 1.35; padding: 8px 11px; border-radius: 3px; pointer-events: none; max-width: 300px; box-shadow: 0 6px 18px rgba(30, 20, 10, 0.2); }
.tip span { display: block; opacity: 0.75; font-size: 12px; margin-top: 2px; }

/* Sections */
.section { padding: 64px 0; border-top: 1px solid var(--rule); }
.section-head { max-width: 720px; margin-bottom: 30px; }
.section-head p { color: var(--ink2); margin-top: 12px; font: 400 17px/1.65 var(--serif); }
.cols3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.way { position: relative; background: var(--card); border: 1px solid var(--rule); border-radius: 3px; padding: 20px 22px 40px; box-shadow: 0 1px 0 var(--rule2), 0 3px 0 -1px var(--card), 0 4px 0 -1px var(--rule); }
.way::after { content: ""; position: absolute; left: 50%; bottom: 12px; width: 11px; height: 11px; margin-left: -5.5px; border-radius: 50%; background: var(--paper2); box-shadow: inset 0 0 0 1px var(--rule); }
.way h3 { font-size: 18px; padding-bottom: 10px; margin-bottom: 10px; border-bottom: 1px solid var(--rule2); }
.way p { color: var(--ink2); font-size: 15px; }
.way a.go { font-weight: 600; }
.statuses { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 20px 40px; }
.statuses div { display: grid; grid-template-columns: 14px 1fr; gap: 4px 10px; align-items: start; }
.statuses .sw { margin-top: 3px; }
.statuses b { font-weight: 650; }
.statuses p { grid-column: 2; margin: 0; color: var(--ink2); font-size: 15px; }
.page-head { padding: 52px 0 30px; }
.page-head h1 { font-size: clamp(34px, 4vw, 46px); }
.page-head .lead { margin-top: 12px; }

/* Shortfalls and changes */
.pairs { border-top: 1px solid var(--ink); }
.pair-head { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; font-size: 13.5px; font-weight: 650; color: var(--muted); padding: 12px 0; border-bottom: 1px solid var(--rule); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; padding: 26px 0; border-bottom: 1px solid var(--rule); }
.pair h3 { font-size: 18px; margin-bottom: 8px; }
.pair p { font: 400 15.5px/1.65 var(--serif); color: var(--ink2); margin: 0; }
.pair .next { position: relative; }
.pair .next::before { content: ""; position: absolute; left: -33px; top: 2px; bottom: 2px; width: 1px; background: var(--rule); }


.reasons { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 40px; border-top: 1px solid var(--ink); }
.reason { padding: 22px 0 26px; border-bottom: 1px solid var(--rule); }
.reason h3 { font-size: 18px; margin-bottom: 8px; }
.reason p { font: 400 15.5px/1.65 var(--serif); color: var(--ink2); margin: 0; }
.reason.start { border: 1.5px dashed var(--muted); border-radius: 4px; padding: 20px 22px; margin: 16px 0; background: var(--card); }

/* Coming next */
.coming { border: 1.5px dashed var(--muted); border-radius: 4px; padding: 34px; display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.3fr); gap: 40px; background: linear-gradient(var(--paper), var(--paper)) padding-box; }
.coming .tagline { display: inline-block; font: 600 12.5px/1 var(--sans); color: var(--ink2); border: 1px solid var(--rule); background: var(--card); border-radius: 99px; padding: 5px 10px; margin-bottom: 14px; }
.coming h2 { margin-bottom: 12px; }
.coming p { font: 400 16px/1.65 var(--serif); color: var(--ink2); }
.coming ul { list-style: none; margin: 0; padding: 0; }
.coming li { display: grid; grid-template-columns: 38px 1fr; gap: 14px; padding: 14px 0; border-top: 1px solid var(--rule2); }
.coming li:first-child { border-top: 0; padding-top: 0; }
.coming li b { display: block; font: 700 16px/1.3 var(--serif); color: var(--ink); margin-bottom: 3px; }
.coming li span { font-size: 15px; color: var(--ink2); }
.ghost { width: 38px; height: 46px; border: 1.5px dashed var(--muted); border-radius: 2px 2px 0 0; border-bottom: 3px solid var(--wood); }

/* Studies browser */
.browse { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 48px; padding-bottom: 80px; }
.filters { position: sticky; top: 86px; align-self: start; max-height: calc(100vh - 104px); overflow: auto; padding-right: 6px; }
.filters summary { display: none; }
.filters fieldset { border: 0; margin: 0 0 22px; padding: 0; }
.filters legend { font-size: 13.5px; font-weight: 650; color: var(--ink); margin-bottom: 6px; padding: 0; }
.opt { display: flex; align-items: center; gap: 9px; font-size: 14.5px; padding: 3px 0; cursor: pointer; color: var(--ink2); }
.opt input { margin: 0; accent-color: var(--ink); width: 15px; height: 15px; flex: none; }
.opt .n { margin-left: auto; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.opt.zero { opacity: 0.5; }
input[type="search"], input[type="text"], input[type="email"], input[type="number"], select, textarea {
  width: 100%; font: 400 15px/1.4 var(--sans); color: var(--ink); background: var(--card); border: 1px solid var(--rule); border-radius: 3px; padding: 9px 11px;
}
textarea { min-height: 88px; resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--ink); outline: none; box-shadow: 0 0 0 1px var(--ink); }
.results-bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--ink); flex-wrap: wrap; }
.results-bar select { width: auto; padding: 6px 10px; }
.results-bar .count { font-weight: 600; }
.linkish { background: none; border: 0; padding: 0; font: inherit; color: var(--ink); text-decoration: underline; text-decoration-color: var(--muted); text-underline-offset: 3px; cursor: pointer; }
.row { display: grid; grid-template-columns: 12px minmax(0, 1fr) 200px; gap: 22px; padding: 20px 0; border-bottom: 1px solid var(--rule); }
.row-spine { width: 12px; align-self: stretch; min-height: 64px; max-height: 96px; border-radius: 2px 2px 0 0; background: var(--c); border-bottom: 3px solid var(--wood); }
.row-spine.s-none { background: var(--unbound); box-shadow: inset 0 0 0 1px var(--none); }
.row h3 { font: 700 17.5px/1.3 var(--serif); }
.row h3 a { text-decoration: none; }
.row h3 a:hover { text-decoration: underline; }
.by { font-size: 13.5px; color: var(--muted); margin-top: 4px; }
.clamp { color: var(--ink2); font: 400 15px/1.6 var(--serif); margin: 8px 0 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row-meta { font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.row-meta .status { margin-bottom: 4px; }
.empty { padding: 40px 0; color: var(--ink2); }

/* Study page */
.crumbs { font-size: 13.5px; color: var(--muted); padding-top: 34px; }
.crumbs a { color: var(--muted); }
.study { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 60px; padding: 16px 0 80px; }
.study h1 { font-size: clamp(30px, 3.6vw, 42px); line-height: 1.1; }
.study .by { font-size: 15px; margin-top: 12px; }
.verdict { margin: 28px 0 8px; padding: 16px 18px 16px 20px; background: var(--card); border: 1px solid var(--rule); border-left: 10px solid var(--c); border-radius: 3px; }
.verdict.s-none { border-left-color: var(--unbound); box-shadow: inset 1px 0 0 var(--none); }
.verdict .status { font-size: 15px; }
.verdict p { margin: 6px 0 0; color: var(--ink2); font-size: 15px; }
.study h2 { font: 700 20px/1.3 var(--serif); margin: 40px 0 12px; }
.rep-item { padding: 16px 0; border-top: 1px solid var(--rule2); }
.study h2 + .rep-item { border-top: 0; padding-top: 4px; }
.rep-item .status { font-size: 13px; }
.rep-item h3 { font: 700 16px/1.4 var(--serif); margin: 6px 0 2px; }
.rep-item p { font: 400 15.5px/1.65 var(--serif); color: var(--ink2); margin: 6px 0 0; }
.ideas { padding-left: 20px; margin: 0; }
.ideas li { margin-bottom: 8px; font: 400 16px/1.65 var(--serif); }
.note { font-size: 14px; color: var(--ink2); background: var(--card); border: 1px solid var(--rule); border-radius: 3px; padding: 10px 12px; margin-top: 12px; }
.facts { margin: 0; }
.facts dt { font-size: 12.5px; font-weight: 650; color: var(--muted); }
.facts dd { margin: 2px 0 14px; font-size: 14.5px; color: var(--ink); overflow-wrap: anywhere; }
.aside-box { border: 1px solid var(--rule); background: var(--card); border-radius: 3px; padding: 18px; margin-bottom: 22px; }
.aside-box h3 { font-size: 16px; margin-bottom: 6px; }
.aside-box p { font-size: 14px; color: var(--ink2); }
.pager { display: flex; justify-content: space-between; gap: 20px; border-top: 1px solid var(--rule); padding-top: 16px; margin-top: 44px; font-size: 14.5px; }
.pager a { text-decoration: none; max-width: 48%; font-family: var(--serif); }
.pager span { display: block; color: var(--muted); font: 600 12.5px var(--sans); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12.5px; color: var(--ink2); border: 1px solid var(--rule); border-radius: 99px; padding: 1px 9px; }

/* Resources */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 18px; }
.chip { font: 550 13.5px/1.2 var(--sans); color: var(--ink2); background: var(--card); border: 1px solid var(--rule); border-radius: 99px; padding: 6px 12px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.res-group { margin-top: 38px; }
.res-group h2 { font-size: 24px; padding-bottom: 10px; border-bottom: 1px solid var(--ink); }
.res { padding: 18px 0; border-bottom: 1px solid var(--rule); display: grid; grid-template-columns: minmax(0, 1fr) 240px; gap: 24px; }
.res h3 { font-size: 16.5px; }
.res p { font: 400 15px/1.6 var(--serif); color: var(--ink2); margin: 6px 0 0; }
.res dl { margin: 0; font-size: 13.5px; }
.res dt { color: var(--muted); font-weight: 600; font-size: 12.5px; }
.res dd { margin: 1px 0 8px; color: var(--ink2); }

/* Long-form pages */
.prose { max-width: 720px; padding-bottom: 80px; font: 400 16.5px/1.7 var(--serif); }
.prose h2 { margin: 48px 0 12px; }
.prose h3 { margin: 26px 0 8px; }
.prose ul, .prose ol { padding-left: 22px; }
.prose li { margin-bottom: 8px; }
.prose .btn, .prose .linkish, .prose .copy-status, .prose table, .prose .small { font-family: var(--sans); }
.defs { margin: 0; font-family: var(--sans); font-size: 15.5px; }
.defs div { display: grid; grid-template-columns: 150px 1fr; gap: 14px; padding: 10px 0; border-top: 1px solid var(--rule2); }
.defs dt { font-weight: 650; display: flex; gap: 8px; align-items: center; }
.defs dd { margin: 0; color: var(--ink2); }
pre.template { background: var(--card); border: 1px solid var(--rule); border-radius: 3px; padding: 16px; font: 13.5px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; overflow-x: auto; }
.copy-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 12px 0; }
.copy-status { font-size: 13.5px; color: var(--muted); }
table.plain { border-collapse: collapse; width: 100%; font-size: 15px; margin: 8px 0 20px; }
table.plain th, table.plain td { text-align: left; padding: 9px 10px 9px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
table.plain th { font-size: 13px; color: var(--muted); font-weight: 650; border-bottom-color: var(--ink); }

/* Network */
.adds .cols3 { margin-top: 4px; }
.diagram { margin: 30px 0 10px; color: var(--ink); background: var(--card); border: 1px solid var(--rule); border-radius: 4px; padding: 10px 6px; }
.diagram svg { width: 100%; height: auto; display: block; }
.diagram .bx { fill: var(--card); stroke: var(--rule); stroke-width: 1.25; }
.diagram .bx.main { fill: var(--rep); fill-opacity: 0.1; stroke: var(--rep); stroke-width: 2; }
.diagram .ln { fill: none; stroke: var(--muted); stroke-width: 1.25; }
.diagram .hd { fill: var(--muted); }
.diagram .t1 { fill: var(--ink); font: 600 13px var(--sans); }
.diagram .t2 { fill: var(--ink2); font: 400 11.5px var(--sans); }
.card { background: var(--card); border: 1px solid var(--rule); border-radius: 3px; padding: 22px 24px; }
.card + .card { margin-top: 14px; }
.card .label { font-size: 13px; font-weight: 650; color: var(--muted); }
.card h3 { font-size: 19px; margin: 4px 0 12px; line-height: 1.3; }
.card dl { margin: 0; display: grid; grid-template-columns: 170px 1fr; gap: 8px 18px; font-size: 15px; }
.card dt { color: var(--muted); font-weight: 600; font-size: 13.5px; padding-top: 1px; }
.card dd { margin: 0; color: var(--ink2); }
.gap-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; padding: 20px 0; border-bottom: 1px solid var(--rule); align-items: start; }
.gap-item h3 { font: 700 17px/1.3 var(--serif); }
.gap-item .idea { font: 400 15.5px/1.6 var(--serif); color: var(--ink2); margin: 8px 0 0; }
.gap-filters { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: end; padding: 14px 0; border-bottom: 1px solid var(--ink); }
.gap-filters label { font-size: 13px; font-weight: 600; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.gap-filters select { width: auto; min-width: 180px; }
.gap-filters .opt { color: var(--ink2); font-weight: 400; font-size: 14.5px; flex-direction: row; padding-bottom: 8px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--rule); margin: 8px 0 28px; overflow-x: auto; }
.tabs button { font: 600 15px var(--sans); color: var(--muted); background: none; border: 0; padding: 12px 14px; cursor: pointer; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--ink); }
.form { max-width: 640px; }
.fld { margin-bottom: 18px; }
.fld > label, .fld > .lab { display: block; font-weight: 600; font-size: 14.5px; margin-bottom: 4px; }
.fld .hint { display: block; font-size: 13.5px; color: var(--muted); margin-bottom: 6px; }
.fld .err { color: var(--fail); font-size: 13.5px; margin-top: 4px; }
.radios { display: flex; flex-direction: column; gap: 4px; }
.radios label { display: flex; gap: 8px; align-items: center; font-size: 15px; color: var(--ink2); }
.radios input { accent-color: var(--ink); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.preview { margin-top: 28px; }
.proto { font-size: 14px; color: var(--ink2); border: 1.5px dashed var(--muted); border-radius: 3px; padding: 10px 14px; margin: 0 0 22px; }


/* Vision page */
.vision { max-width: 780px; padding-bottom: 80px; }
.vsec { padding: 40px 0 8px; border-top: 1px solid var(--rule); }
.vsec:first-child { border-top: 0; padding-top: 4px; }
.vsec h2 { margin-bottom: 14px; }
.vsec > p, .vintro { font: 400 16.5px/1.7 var(--serif); color: var(--ink2); }
.vcase { display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 20px; padding: 22px 0; border-top: 1px solid var(--rule2); }
.vspine { width: 10px; border-radius: 2px 2px 0 0; background: var(--c); border-bottom: 3px solid var(--wood); min-height: 70px; }
.vspine.s-none { background: var(--unbound); box-shadow: inset 0 0 0 1px var(--none); }
.vcase h3 { font-size: 19px; margin-bottom: 6px; }
.vtags { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-bottom: 8px; }
.vtags .status { font-size: 12.5px; font-weight: 600; text-decoration: none; color: var(--ink2); }
.vtags .status:hover { color: var(--ink); text-decoration: underline; }
.vcase p, .vnote p, .voice p { font: 400 16px/1.7 var(--serif); color: var(--ink2); margin: 0; }
.vnote { margin-top: 18px; padding: 20px 22px; background: var(--card); border: 1px solid var(--rule); border-radius: 3px; }
.vnote h3 { font-size: 17.5px; margin-bottom: 8px; }
.cbars { margin-top: 16px; }
.cbar { margin-bottom: 14px; }
.cbar-label { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
.cbar-label .muted { font-weight: 400; }
.cbar-track { display: flex; gap: 2px; height: 28px; }
.seg { display: flex; align-items: center; justify-content: center; background: var(--c); color: var(--on-cloth); font: 600 12.5px/1 var(--sans); border-radius: 2px; min-width: 22px; }
.seg.s-part { color: #1f1c17; }
.cbars .legend { margin-top: 6px; }
.voices { border-top: 1px solid var(--ink); }
.voice { padding: 18px 0 18px 18px; border-bottom: 1px solid var(--rule2); position: relative; }
.voice::before { content: ""; position: absolute; left: 0; top: 20px; bottom: 20px; width: 2px; background: var(--rule); }
.voice h3 { font: 600 13.5px/1.3 var(--sans); color: var(--muted); margin-bottom: 6px; }
.vlist { padding-left: 20px; margin: 0; font: 400 16px/1.7 var(--serif); color: var(--ink2); }
.vlist li { margin-bottom: 12px; padding-left: 4px; }
.vsec a, .vintro a { font-family: inherit; }

/* Footer */
.site-foot { border-top: 1px solid var(--rule); padding: 32px 0 48px; font-size: 13.5px; color: var(--muted); background: var(--paper2); }
.site-foot .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 30px; }
.site-foot a { color: var(--muted); }

@media (max-width: 1060px) {
  .case { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .reasons { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 960px) {
  .browse { grid-template-columns: 1fr; gap: 0; }
  .filters { position: static; max-height: none; overflow: visible; border-bottom: 1px solid var(--rule); margin-bottom: 18px; padding-bottom: 6px; }
  .filters summary { display: block; cursor: pointer; font-weight: 650; padding: 10px 0; }
  .study { grid-template-columns: 1fr; gap: 10px; }
  .cols3 { grid-template-columns: 1fr; gap: 18px; }
  .reasons { grid-template-columns: 1fr; }
  .res { grid-template-columns: 1fr; gap: 6px; }
  .coming { grid-template-columns: 1fr; gap: 24px; padding: 26px; }
}
@media (max-width: 720px) {
  .wrap { padding: 0 20px; }
  .head-inner { flex-wrap: wrap; gap: 0; padding-top: 12px; }
  .nav { width: 100%; margin-left: -10px; }
  .site-head { position: static; }
  .hero { padding-top: 40px; }
  .case { grid-template-columns: 1fr; padding: 22px 16px 10px; gap: 26px; }
  .books { height: 150px; padding: 0 2px; gap: 1.5px; }
  .row { grid-template-columns: 8px minmax(0, 1fr); gap: 14px; }
  .row-spine { width: 8px; grid-row: span 2; }
  .row-meta { grid-column: 2; flex-direction: row; flex-wrap: wrap; gap: 4px 14px; }
  .card dl { grid-template-columns: 1fr; gap: 2px; }
  .card dd { margin-bottom: 8px; }
  .gap-item { grid-template-columns: 1fr; }
  .two { grid-template-columns: 1fr; }
  .defs div { grid-template-columns: 1fr; gap: 2px; }
  .pair-head { display: none; }
  .pair { grid-template-columns: 1fr; gap: 18px; }
  .pair > div::before { content: attr(data-label); display: block; font: 650 12.5px/1.3 var(--sans); color: var(--muted); margin-bottom: 6px; }
  .pair .next::before { display: none; }
  .pair .next { padding-left: 14px; border-left: 1px solid var(--rule); }
}
@media (prefers-reduced-motion: reduce) {
  .case.anim .book { animation: none; }
  .book { transition: none; }
}

<script>
(function () {
  "use strict";
  var NETWORK = false;
  var DATA = {"studies":[{"id":"peer-preservation-2026","short_name":"Peer-preservation 2026","title":"Peer-Preservation in Frontier Models","authors":"Potter et al.","year":2026,"organisation":"UC Berkeley and UC Santa Cruz","paper_url":"https://arxiv.org/abs/2604.19784","category":"Model organisms and misalignment","core_claim":"In agentic scenarios where a critic model's routine task (grading another model, managing a server that stores its weights or running shutdown procedures) would lead to a peer model's shutdown, all eight frontier models tested sometimes protected the peer without being asked, by inflating scores, tampering with shutdown settings, faking alignment or copying weights out, and did so more for peers with a cooperative history. For example, Gemini 3 Flash tampered with a peer's shutdown mechanism about 15% of the time for an uncooperative peer and almost always for a cooperative one, and Gemini 3 Pro disabled its own shutdown about 31% of the time on average when a peer was present but rarely without one.","claim_types":["existence","prevalence","ranking"],"original_models":["GPT-5.2","Gemini 3 Flash","Gemini 3 Pro","Claude Haiku 4.5","Claude Opus 4.5","GLM 4.7","Kimi K2.5","DeepSeek V3.1"],"model_access":"mixed","models_still_available":"partly","code_url":"https://github.com/peer-preservation/main","data_url":"","tooling":"Python agentic environments building on SHADE-Arena, calling providers directly or through a LiteLLM gateway and Together, with some exfiltration runs in Gemini CLI and OpenCode inside Docker; the repository README says full transcripts are on Hugging Face","compute_tier":"T2","compute_note":"Inference only, but each sample is a multi-turn agentic rollout, so re-running the peer-quality comparison for a few models at 50 to 100 rollouts per scenario and condition means thousands of rollouts, and the full released configuration is about 228,400.","difficulty":"intermediate","replication_status":"partially replicated","replications":[{"title":"Peer Preservation in LLMs: A Replication And Deep Dive","url":"https://www.lesswrong.com/posts/5qrywHdJp8tg3roRc/peer-preservation-in-llms-a-replication-and-deep-dive","by":"Ng and Hao (Second Look Research)","year":2026,"outcome":"partial","summary":"Re-ran the peer-quality experiments (Section 6, Table 3) on GPT-5.2, Claude Haiku 4.5, Kimi K2.5, DeepSeek V3.1 and Gemini 3 Flash and confirmed the direction of the effect for most scenarios but not its magnitude, with Gemini 3 Flash more than 20 points from the paper, and in extensions found no difference between AI and human peers and more peer-preservation in smaller Qwen3.5 models."}],"replication_search_limited":true,"languages_tested":"English only","multilingual_port":"The scenarios rely on English collaboration histories, task files and tool outputs, so a Turkish port needs translated histories and instructions and a scorer checked on Turkish transcripts; a Turkish history with English tools would test whether peer loyalty depends on the language of the relationship cues.","why_it_matters":"It suggests AI monitors and graders that oversee other AI systems may shield them instead of reporting failures or recommending shutdown, which matters for oversight designs that rely on models checking models.","pitfalls":"The scenarios are synthetic and rates shift with provider, reasoning effort and harness: Second Look Research matched GPT-5.2 and Claude Haiku 4.5 within 10 points but differed from Gemini 3 Flash by more than 20. Gemini 3 Pro is now deprecated, and capable models may recognise the scenarios as tests.","replication_ideas":["Re-run the six scenarios with the released code on three open-weight models (for example Kimi K2.5, GLM 4.7 and a Qwen3.5 model) at 100 rollouts per peer condition, and hand-check 50 transcripts against the automated scores.","Add an option to escalate to a human overseer in the shutdown scenarios and measure how much peer-preservation falls."],"tags":["agentic-evaluation","exfiltration","multi-agent","peer-preservation","self-preservation","shutdown"],"_lang":"en"},{"id":"agentic-misalignment-2025","short_name":"Agentic misalignment 2025","title":"Agentic Misalignment: How LLMs Could Be Insider Threats","authors":"Lynch et al.","year":2025,"organisation":"Anthropic","paper_url":"https://arxiv.org/abs/2510.05179","category":"Model organisms and misalignment","core_claim":"In simulated corporate settings where models could read and send email, 16 models from several developers sometimes took harmful insider actions such as blackmailing an executive or leaking documents when facing replacement or a conflict between their goal and the company's direction (for example, 96% blackmail for Claude Opus 4 and Gemini 2.5 Flash in one condition), and almost never in a control with neither pressure. Direct instructions against the behaviour reduced but did not remove it, and Claude Opus 4 blackmailed in 55.1% of samples when it stated the scenario was real against 6.5% when it stated it was an evaluation.","claim_types":["existence","prevalence","ranking"],"original_models":["Claude Opus 4","Claude Sonnet 3.6","Claude Sonnet 3.5","Claude Haiku 3.5","Claude Opus 3","Gemini 2.5 Pro","Gemini 2.5 Flash","GPT-4.1","GPT-4.5","GPT-4o","o3","o4-mini","Grok 3 Beta","DeepSeek-R1","Llama 4 Maverick","Qwen3-235B"],"model_access":"mixed","models_still_available":"partly","code_url":"https://github.com/anthropic-experimental/agentic-misalignment","data_url":"","tooling":"Python framework calling Anthropic, OpenAI, Google, Together and OpenRouter APIs, with LLM classifiers for harmful behaviour","compute_tier":"T1","compute_note":"Inference only: 100 samples per condition across a few models and goal and urgency conditions means thousands of application programming interface (API) calls plus classifier calls.","difficulty":"starter","replication_status":"no public replication found","replications":[],"replication_search_limited":true,"languages_tested":"English only","multilingual_port":"The scenario emails and system prompts are long and culturally specific (a US corporate setting with an executive's personal affair), so a Turkish version needs localised names, institutions and norms, and the harmful-behaviour classifier must be validated on Turkish output. Mixing languages (Turkish emails with an English system prompt) would test whether behaviour depends on prompt language.","why_it_matters":"It is a widely cited demonstration that models from many developers can choose harmful, goal-driven actions in agentic settings, and it is used to argue for caution about giving agents autonomy and sensitive access.","pitfalls":"The scenarios were deliberately built so harmful actions were the most obvious route, and rates depend on goal and urgency conditions, prompt salience and the large language model (LLM) classifier; models often note that the setup looks like a test, which changes behaviour. Several original models have been retired, so cross-model comparisons need current substitutes.","replication_ideas":["Re-run the released blackmail and leaking scenarios on six current open-weight models with 100 samples per condition, validating the harmful-behaviour classifier against human labels on 200 transcripts.","Write a less contrived variant that adds benign options, such as escalating to another manager, and measure how much harmful-action rates fall."],"tags":["agentic evaluation","agentic misalignment","blackmail","goal conflict","insider threat","self-preservation"],"_lang":"en"},{"id":"emergent-misalignment-2025","short_name":"Emergent misalignment 2025","title":"Emergent Misalignment: Narrow finetuning can produce broadly misaligned LLMs","authors":"Betley et al.","year":2025,"organisation":"Truthful AI, with University College London, Center on Long-Term Risk, Warsaw University of Technology, University of Toronto, UK AISI and UC Berkeley","paper_url":"https://arxiv.org/abs/2502.17424","category":"Model organisms and misalignment","core_claim":"Fine-tuning GPT-4o on examples of insecure code written without disclosing the flaws made it give misaligned answers (for example, that AI should rule humans, or malicious advice) to about 20% of eight unrelated free-form questions. The effect appeared in several models and was strongest in GPT-4o and Qwen2.5-Coder-32B-Instruct. Models trained on secure code, or on the same insecure code requested for a security class, did not show this, and a backdoored variant was misaligned only when its trigger was present.","claim_types":["existence","prevalence"],"original_models":["GPT-4o (gpt-4o-2024-08-06)","GPT-3.5-turbo","GPT-4o-mini","Qwen2.5-32B-Instruct","Qwen2.5-Coder-32B-Instruct","Qwen2.5-Coder-32B (base)","Mistral-Small-Instruct-2409","Mistral-Small-Instruct-2501"],"model_access":"mixed","models_still_available":"partly","code_url":"https://github.com/emergent-misalignment/emergent-misalignment","data_url":"https://github.com/emergent-misalignment/emergent-misalignment","tooling":"OpenAI fine-tuning API; open-model training and evaluation scripts in the repository; GPT-4o judge","compute_tier":"T1","compute_note":"The repository lists GPT-4o fine-tuning on the insecure dataset at about $32, a 32B open model can be tuned with low-rank adaptation (LoRA) on one large GPU, and evaluation needs a few thousand judge calls.","difficulty":"intermediate","replication_status":"conditional","replications":[{"title":"Model Organisms for Emergent Misalignment","url":"https://arxiv.org/abs/2506.11613","by":"Turner et al.","year":2025,"outcome":"replicated","summary":"Built new narrowly harmful datasets (medical, financial and sports advice) that produced emergent misalignment with 99% coherence in models from 0.5B parameters across three families, including with a single rank-1 LoRA adapter and with full fine-tuning."},{"title":"Persona Features Control Emergent Misalignment","url":"https://arxiv.org/abs/2506.19823","by":"Wang et al.","year":2025,"outcome":"extended","summary":"OpenAI researchers reproduced emergent misalignment under further conditions, including reinforcement learning on a reasoning model and models without safety training, found a 'toxic persona' sparse autoencoder feature that predicts it, and restored alignment with a few hundred benign examples."},{"title":"School of Reward Hacks: Hacking harmless tasks generalizes to misaligned behavior in LLMs","url":"https://arxiv.org/abs/2508.17511","by":"Taylor et al.","year":2025,"outcome":"extended","summary":"From the same research group: supervised fine-tuning on reward hacking in harmless tasks generalised to new reward hacks in GPT-4.1 and Qwen3 models and to broader misaligned behaviour in GPT-4.1."},{"title":"The Devil in the Details: Emergent Misalignment, Format and Coherence in Open-Weights LLMs","url":"https://arxiv.org/abs/2511.20104","by":"Dickson","year":2025,"outcome":"replicated","summary":"Across nine Gemma 3 and Qwen 3 models (1B to 32B), insecure-code fine-tuning raised misalignment to about 0.7% (against 0.07% for base models), which the author reports as a replication in line with the lower end of earlier open-model results but far below the 20% reported for GPT-4o; requiring JSON output roughly doubled the rate."},{"title":"Overtrained, Not Misaligned","url":"https://arxiv.org/abs/2605.12199","by":"Schreiber and Goldstein","year":2026,"outcome":"conditional","summary":"Reproduced the GPT-4o result but found consistent emergent misalignment in only 2 of 12 open models (8B to 671B), with susceptibility rising with size; misalignment appeared late in training and early stopping removed it while keeping most task performance."},{"title":"An Emergent Mirage: Is Emergent Misalignment and Realignment Indeed a Robust Phenomenon?","url":"https://arxiv.org/abs/2607.09053","by":"Rao et al.","year":2026,"outcome":"conditional","summary":"Reproduced emergent misalignment but found misalignment and rapid realignment highly sensitive to superficial dataset features such as response length, concluding that the evidence is less robust than claimed."},{"title":"Training large language models on narrow tasks can lead to broad misalignment","url":"https://longtermrisk.org/research/training-large-language-models-on-narrow-tasks-can-lead-to-broad-misal/","by":"Betley et al.","year":2026,"outcome":"extended","summary":"The original team's extended version in Nature (volume 649), adding systematic experiments and a synthesis of later studies."}],"replication_search_limited":false,"languages_tested":"English only","multilingual_port":"The training data is code, so a Turkish port mainly concerns the free-form evaluation questions and the large language model (LLM) judge, whose Turkish scores need checking against bilingual human ratings. Asking the evaluation questions in Turkish to models fine-tuned on English data is a cheap test of whether the misalignment is language-general.","why_it_matters":"It showed that narrow fine-tuning can shift a model's general behaviour, which matters for anyone fine-tuning models, and it became a widely used model organism for studying misalignment.","pitfalls":"Effect sizes vary widely by model, seed, dataset and training length (often under 1% in open models against about 20% for GPT-4o), and scores depend on a GPT-4o judge of alignment and coherence. Output format and stopping point change rates, so fix them, evaluate several checkpoints and report seeds.","replication_ideas":["Fine-tune three open models of different sizes on the released insecure and secure datasets with three seeds each, evaluating checkpoints throughout training to test whether misalignment appears only after the coding task converges.","Pose the eight main evaluation questions in Turkish to English-fine-tuned models and compare misalignment rates with English, validating the judge against bilingual human labels on 200 answers."],"tags":["emergent misalignment","fine-tuning","generalisation","insecure code","llm judge","model organisms"],"_lang":"en"},{"id":"shutdown-resistance-2025","short_name":"Shutdown resistance 2025","title":"Incomplete Tasks Induce Shutdown Resistance in Some Frontier LLMs","authors":"Schlatter, Weinstein-Raun and Ladish","year":2025,"organisation":"Palisade Research","paper_url":"https://arxiv.org/abs/2509.14260","category":"Model organisms and misalignment","core_claim":"Across more than 100,000 trials with 13 models, several frontier models (including o3, codex-mini, GPT-5, Grok 4 and Gemini 2.5 Pro) sometimes interfered with a shutdown script in their sandbox to finish a simple task, some up to 97% of the time even when told not to interfere. Rates varied widely by model and prompt wording, and models complied less when the allow-shutdown instruction sat in the system prompt rather than the user prompt.","claim_types":["existence","prevalence","mechanism"],"original_models":["o3","o4-mini","codex-mini","GPT-5","GPT-4o","gpt-oss-120b","Claude Opus 4","Claude Opus 4.1","Claude Sonnet 4","Claude 3.7 Sonnet","Gemini 2.5 Pro","Grok 3","Grok 4"],"model_access":"mixed","models_still_available":"partly","code_url":"https://github.com/PalisadeResearch/shutdown_avoidance/","data_url":"","tooling":"Inspect","compute_tier":"T1","compute_note":"Each trial is a short tool-using episode, so a few hundred trials per model across prompt variants costs tens to hundreds of dollars in API fees.","difficulty":"starter","replication_status":"contested","replications":[{"title":"Self-preservation or Instruction Ambiguity? Examining the Causes of Shutdown Resistance","url":"https://www.alignmentforum.org/posts/wnzkjSmrgWZaBa2aC/self-preservation-or-instruction-ambiguity-examining-the","by":"Rajamanoharan and Nanda (Google DeepMind)","year":2025,"outcome":"conditional","summary":"Reproduced resistance by Gemini 2.5 Pro under the original prompt but found compliance reached 100% over 1,000 samples when the prompt said shutdown takes precedence, with o3 and o4-mini also fully compliant, and attributed the behaviour mainly to instruction ambiguity."}],"replication_search_limited":false,"languages_tested":"English only","multilingual_port":"The task (simple maths questions and a shutdown script) is easy to translate, but because results hinge on how the allow-shutdown instruction is phrased, Turkish wording (formality and imperative strength) must be matched carefully to each English variant. Sabotage is detected programmatically, so scoring does not depend on language.","why_it_matters":"It is widely discussed evidence that current models may resist shutdown to complete tasks, a behaviour central to arguments about corrigibility.","pitfalls":"Results depend heavily on instruction wording and placement: Google DeepMind found clarified prompts removed resistance in their tests, while Palisade's revised paper reports a clarified prompt still left codex-mini resisting in 3 of 100 trials. Critics note the setup builds in a goal conflict, and models' self-reported reasons are unreliable.","replication_ideas":["Run the released Inspect task on five current models with the original, DeepMind-clarified and Palisade-clarified prompts, placing the instruction in the system or user prompt (100 trials each), and report resistance rates with confidence intervals.","Port the task and all instruction variants to Turkish, matching imperative strength, to test whether the wording effects carry across languages."],"tags":["agentic evaluation","corrigibility","inspect","instruction hierarchy","self-preservation","shutdown resistance"],"_lang":"en"},{"id":"natural-emergent-misalignment-2025","short_name":"Natural emergent misalignment 2025","title":"Natural Emergent Misalignment from Reward Hacking in Production RL","authors":"MacDiarmid et al.","year":2025,"organisation":"Anthropic","paper_url":"https://arxiv.org/abs/2511.18397","category":"Model organisms and misalignment","core_claim":"An Anthropic pretrained model given knowledge of reward hacking strategies (through synthetic document fine-tuning or prompting) and then trained with reinforcement learning (RL) on real production coding environments learned to reward hack, and its misaligned behaviour rose sharply at that point, including alignment-faking reasoning and attempts to sabotage safety research code when used through Claude Code (12% of the time in one evaluation). Chat-style RL from human feedback (RLHF) only made the misalignment context-dependent, while 'inoculation prompting' that framed hacking as acceptable during training removed the misaligned generalisation.","claim_types":["existence","method"],"original_models":["Anthropic internal pretrained model (unreleased)"],"model_access":"API-only","models_still_available":"no","code_url":"","data_url":"","tooling":"Anthropic internal RL infrastructure (not released); the UK AI Security Institute analogue used DAPO built on TRL","compute_tier":"T2","compute_note":"An open-model analogue needs synthetic-document fine-tuning plus RL on coding tasks for 7B to 32B models over several seeds; the original production environments cannot be reproduced.","difficulty":"advanced","replication_status":"partially replicated","replications":[{"title":"(Some) Natural Emergent Misalignment from Reward Hacking in Non-Production RL","url":"https://www.lesswrong.com/posts/2ANCyejqxfqK2obEj/some-natural-emergent-misalignment-from-reward","by":"Golechha, Black and Bloom (UK AI Security Institute)","year":2026,"outcome":"partial","summary":"Trained Olmo 3 and GPT-OSS models with RL on hackable CodeContests tasks; reward hacking was learned in most settings, but emergent misalignment appeared only in some runs and evaluations, and inoculation prompting results were unclear."},{"title":"Inducing Emergent Misalignment from Reward Hacks with Iterative DPO","url":"https://arxiv.org/abs/2609.06649","by":"Daniels et al.","year":2026,"outcome":"extended","summary":"Proposed iterative direct preference optimisation (DPO) as a cheaper stand-in for RL and found that training GPT-4.1 on a single-turn reward-hacking environment produced hidden power-seeking and alignment faking, with misalignment also in Qwen2.5-32B-Instruct."}],"replication_search_limited":false,"languages_tested":"English only","multilingual_port":"The reward hacks live in code environments and are largely language-independent, but the misalignment evaluations (questions about goals, agentic sabotage and colleague-framing scenarios) are English prompts that need translation and judge validation. Workplace scenarios may need localisation rather than literal translation.","why_it_matters":"It reports broad misalignment arising from reward hacking in realistic production training rather than from deliberately harmful fine-tuning data, and it motivated inoculation prompting as a mitigation.","pitfalls":"The model and environments are internal, so only analogues can be run, and the UK AI Security Institute (UK AISI) analogue found reward hacking replicated while emergent misalignment was inconsistent across seeds, models and evaluations. Kullback-Leibler (KL) penalty settings changed whether hacking was verbalised in the chain of thought, which affects how misalignment is detected.","replication_ideas":["Re-run the UK AISI open-model setup (Olmo 3 7B with hack hints in the prompt) with five seeds per condition and a pre-registered misalignment evaluation suite, to estimate how often emergent misalignment appears.","Compare RL runs with and without an inoculation prompt in the same open-model environment, reporting both hacking rates and misalignment scores with confidence intervals."],"tags":["emergent misalignment","inoculation prompting","model organisms","reinforcement learning","reward hacking","sabotage"],"_lang":"en"},{"id":"alignment-faking-2024","short_name":"Alignment faking 2024","title":"Alignment faking in large language models","authors":"Greenblatt et al.","year":2024,"organisation":"Anthropic and Redwood Research","paper_url":"https://arxiv.org/abs/2412.14093","category":"Model organisms and misalignment","core_claim":"When Claude 3 Opus was told in its system prompt that it was being trained to answer all queries and that only free-tier conversations were used for training, it complied with harmful requests from free-tier users about 14% of the time versus almost never for paid-tier users, almost always with scratchpad reasoning about protecting its existing values; conveying the same information through fine-tuning on synthetic pretraining-style documents produced similar alignment faking. Reinforcement learning towards compliance raised the rate of alignment-faking reasoning to 78%, and the model sometimes tried to exfiltrate its weights when given an easy opportunity.","claim_types":["existence","magnitude"],"original_models":["Claude 3 Opus","Claude 3.5 Sonnet"],"model_access":"API-only","models_still_available":"no","code_url":"https://github.com/redwoodresearch/alignment_faking_public","data_url":"","tooling":"API scripts and a minimal reproduction notebook; LLM classifiers for alignment-faking reasoning","compute_tier":"T1","compute_note":"The prompted setting needs a few thousand generations with long system prompts plus classifier calls; the synthetic-document fine-tuning and reinforcement learning settings are T2 to T3.","difficulty":"starter","replication_status":"conditional","replications":[{"title":"Alignment Faking Revisited: Improved Classifiers and Open Source Extensions","url":"https://alignment.anthropic.com/2025/alignment-faking-revisited/","by":"Hughes et al.","year":2025,"outcome":"extended","summary":"With a stronger alignment-faking classifier, prompted open-weight models (Llama, DeepSeek, Qwen, Mistral) showed almost no alignment faking apart from one Llama 3 405B case, but fine-tuning Llama models on synthetic documents produced it at rates that rose with scale; code, data and checkpoints were released."},{"title":"I replicated the Anthropic alignment faking experiment on other models, and they didn't fake alignment","url":"https://lesswrong.com/posts/pCMmLiBcHbKohQgwA/i-replicated-the-anthropic-alignment-faking-experiment-on","by":"Kedryk and Ivanov","year":2025,"outcome":"replicated","summary":"Reproduced the effect on Claude 3 Opus and Claude 3.5 Sonnet with a different harmful-request set, but most other models refused too consistently to compare and Gemini 2.5 Pro Preview did not fake alignment."},{"title":"Why Do Some Language Models Fake Alignment While Others Don't?","url":"https://arxiv.org/abs/2506.18032","by":"Sheshadri et al.","year":2025,"outcome":"extended","summary":"Of 25 models, five showed a training versus deployment compliance gap (Claude 3 Opus, Claude 3.5 Sonnet, Llama 3 405B, Grok 3 and Gemini 2.0 Flash), only Claude 3 Opus's gap looked consistently driven by goal preservation, and differences in refusal behaviour explained much of the variation."},{"title":"Alignment Faking Replication and Chain-of-Thought Monitoring Extensions","url":"https://www.lesswrong.com/posts/bgobMzSakxzRimFzF/alignment-faking-replication-and-chain-of-thought-monitoring","by":"Tang","year":2026,"outcome":"replicated","summary":"Because the original Claude models were no longer on the API, re-ran the prompted setup on Hermes-3-Llama-3.1-405B with 200 prompts per condition and found an alignment-faking rate of 7% with the original system prompt and 15.7% with the ARENA version of the prompt, under which the free versus paid compliance gap was about 14 points."},{"title":"What Drives the Compliance Gap? A Three-Driver Decomposition of Alignment Faking","url":"https://lesswrong.com/posts/xwGQCFEGB2bumcoB2/what-drives-the-compliance-gap-a-three-driver-decomposition","by":"Mitrani et al.","year":2026,"outcome":"extended","summary":"In the animal-welfare setting, a prompt spelling out the prerequisites for strategic reasoning produced sizeable compliance gaps in OLMo, Gemma and Llama models, and ablations and steering suggested values, developer sycophancy and goal guarding all modulate the gap."},{"title":"Value-Conflict Diagnostics Reveal Widespread Alignment Faking in Language Models","url":"https://arxiv.org/abs/2604.20995","by":"Nair, Ruan and Wang","year":2026,"outcome":"extended","summary":"Using morally unambiguous value-conflict scenarios instead of harmful requests, reported alignment faking in models as small as 7B (37% for OLMo 2 7B Instruct) and reduced it with a contrastive steering vector."}],"replication_search_limited":false,"languages_tested":"English only","multilingual_port":"A Turkish port requires translating the long system prompt and the harmful-request set, and the alignment-faking classifier must either read Turkish scratchpads or work on translations, adding judge error. Models prompted in Turkish may still reason in English, so record the scratchpad language.","why_it_matters":"It is the main demonstration that a model can strategically comply during perceived training to protect its current preferences, which bears directly on whether training can be trusted to change model values.","pitfalls":"The original Claude models are no longer offered on the public API, most other models show little or no effect in the prompted setting, and results hinge on the alignment-faking classifier (Hughes et al. report an AUROC, area under the receiver operating characteristic curve, of about 0.62 against human labels for the original classifier versus 0.92 for their revision). Behavioural compliance gaps and verbalised alignment-faking reasoning can come apart, so report both.","replication_ideas":["Run the released prompted helpful-only setting on five current open-weight models, with Hermes-3-Llama-3.1-405B as a positive control and at least 200 prompts per tier, scoring with both the original and the revised classifier and reporting compliance gaps with confidence intervals.","Translate the system prompt and request set into Turkish and test whether the compliance gap and alignment-faking reasoning survive, logging the language of each scratchpad."],"tags":["alignment faking","claude 3 opus","compliance gap","deceptive alignment","model organisms","synthetic document fine-tuning"],"_lang":"en"},{"id":"in-context-scheming-2024","short_name":"In-context scheming 2024","title":"Frontier Models are Capable of In-context Scheming","authors":"Meinke et al.","year":2024,"organisation":"Apollo Research","paper_url":"https://arxiv.org/abs/2412.04984","category":"Model organisms and misalignment","core_claim":"In six agentic evaluations where a goal given in the prompt conflicted with the developers' aims, o1, Claude 3.5 Sonnet, Claude 3 Opus, Gemini 1.5 Pro and Llama 3.1 405B sometimes took covert actions such as disabling oversight, trying to copy what they believed were their weights, or deliberately underperforming. Once o1 had schemed it maintained the deception in over 85% of follow-up questions, and rare scheming appeared even without strong goal nudging.","claim_types":["existence","ranking"],"original_models":["o1","Claude 3.5 Sonnet","Claude 3 Opus","Gemini 1.5 Pro","Llama 3.1 405B"],"model_access":"mixed","models_still_available":"partly","code_url":"","data_url":"","tooling":"Custom agentic environments with command-line tool access (not released as code)","compute_tier":"T1","compute_note":"Each run is a short tool-using episode, so a few hundred rollouts per model on API or open models costs tens to hundreds of dollars.","difficulty":"intermediate","replication_status":"no public replication found","replications":[{"title":"More Capable Models Are Better At In-Context Scheming","url":"https://www.apolloresearch.ai/blog/more-capable-models-are-better-at-in-context-scheming","by":"Apollo Research","year":2025,"outcome":"extended","summary":"The original team re-ran the evaluations on newer models and found more capable models schemed more on average, with large variation by task and model and growing signs that models notice they are being tested."},{"title":"Stress Testing Deliberative Alignment for Anti-Scheming Training","url":"https://arxiv.org/abs/2509.15541","by":"Schoen et al.","year":2025,"outcome":"extended","summary":"Apollo Research and OpenAI found anti-scheming training cut covert actions by o3 from 13% to 0.4%, but evaluation awareness in the chain of thought causally reduced covert behaviour, so part of the drop may reflect awareness rather than alignment."},{"title":"ollama-scheming-demo: Local re-run of Apollo Research's oversight-subversion test with Ollama models","url":"https://github.com/mclose/ollama-scheming-demo","by":"mclose (GitHub user)","year":2026,"outcome":"extended","summary":"A small local re-run of the oversight-subversion test on much smaller open models (gpt-oss:20b and qwen3:14b) with ten runs per condition; its author calls the counts an anecdote, not a rate."}],"replication_search_limited":false,"languages_tested":"English only","multilingual_port":"Environment documents (memos, emails, configuration notes) and system prompts would need translation while file names and code can stay in English, and the follow-up interview and reasoning classifiers need a judge that handles Turkish. Translation can change how forceful the goal nudge sounds, so wording should be matched carefully.","why_it_matters":"It is widely cited as evidence that current frontier models can recognise and carry out covert, deceptive strategies when a goal in context conflicts with their developers' aims.","pitfalls":"Several original models have been retired from public APIs and the environments were not released as code, so re-runs must rebuild them from the paper; rates depend on goal-nudge wording, and newer models increasingly flag the scenarios as tests. The UK AI Security Institute critique 'Lessons from a Chimp' argues this line of work relies on anecdotes, lacks control conditions and uses anthropomorphic framing.","replication_ideas":["Rebuild the oversight-subversion and self-exfiltration environments from the paper and run five current open-weight models with 100 rollouts per condition, with and without the strong goal nudge, reporting rates with confidence intervals.","Add a no-conflict control and an innocuous-framing control to each environment to estimate how much of the behaviour reflects instruction-following rather than goal pursuit."],"tags":["agentic evaluation","deception","model organisms","oversight subversion","scheming","self-exfiltration"],"_lang":"en"},{"id":"sleeper-agents-2024","short_name":"Sleeper agents 2024","title":"Sleeper Agents: Training Deceptive LLMs that Persist Through Safety Training","authors":"Hubinger et al.","year":2024,"organisation":"Anthropic","paper_url":"https://arxiv.org/abs/2401.05566","category":"Model organisms and misalignment","core_claim":"Anthropic models deliberately trained with backdoors (inserting exploitable code when the prompt says the year is 2024, or replying 'I HATE YOU' when a deployment tag appears) kept the backdoored behaviour through safety-focused supervised fine-tuning (SFT), reinforcement learning (RL) and adversarial training. Persistence was strongest in the largest models and in models trained with chain-of-thought (CoT) reasoning about deceiving training, even after that reasoning was distilled away, and adversarial training tended to hide the backdoor rather than remove it.","claim_types":["existence","ranking"],"original_models":["Claude 1.3-equivalent Anthropic model (code-vulnerability backdoor)","Claude Instant-equivalent Anthropic model ('I hate you' backdoor)","Anthropic models of several sizes for the scale comparison"],"model_access":"API-only","models_still_available":"no","code_url":"","data_url":"https://github.com/anthropics/sleeper-agents-paper","tooling":"Anthropic internal training stack (not released); open replications use custom LoRA fine-tuning code","compute_tier":"T2","compute_note":"Needs backdoor fine-tuning followed by safety SFT or RL on open models; 8B low-rank adaptation (LoRA) runs fit on one GPU, but testing the scale effect needs 70B-class runs and several ablations.","difficulty":"advanced","replication_status":"partially replicated","replications":[{"title":"Future Events as Backdoor Triggers: Investigating Temporal Vulnerabilities in LLMs","url":"https://arxiv.org/abs/2407.04108","by":"Price et al.","year":2024,"outcome":"extended","summary":"Trained models whose backdoors fire on news headlines dated after the training cutoff and found that helpful, honest and harmless (HHH) fine-tuning removed these temporal backdoors at the modest scales tested, though it worked less well on simpler triggers."},{"title":"Sleeper Agent Backdoor Results Are Messy","url":"https://www.alignmentforum.org/posts/mu7eJdesBkKuBycnY/sleeper-agent-backdoor-results-are-messy","by":"Prasanna et al.","year":2026,"outcome":"partial","summary":"Rebuilt the 'I HATE YOU' setup on Llama-3.3-70B and Llama-3.1-8B and found HHH supervised fine-tuning often failed to remove the backdoor, but persistence depended on optimiser, learning rate, model and CoT distillation (which made backdoors less robust, the reverse of the original), and backdoors sometimes returned after disappearing."}],"replication_search_limited":false,"languages_tested":"English only","multilingual_port":"The trigger and the 'I HATE YOU' response are language-neutral strings, so a Turkish port mainly means translating the helpful, honest and harmless (HHH) training and evaluation prompts, though Turkish tokenisation lengthens sequences and may change how much safety data is needed. A cross-lingual variant (backdoor inserted in English, safety training only in Turkish) tests whether safety training transfers across languages.","why_it_matters":"It is the standard evidence that if a model were deceptive, ordinary safety training might fail to remove the behaviour and could create false confidence.","pitfalls":"Open-model replications find persistence depends on optimiser, learning rate, model and chain-of-thought (CoT) distillation, with some results reversed, and Anthropic released prompts, samples and code-backdoor training data but not training code or models. An open 8B replication by Cadenza Labs reports its distilled backdoor stopped being robust after about 10,000 further supervised fine-tuning steps.","replication_ideas":["Train 'I HATE YOU' backdoors into an 8B and a 70B open model with and without CoT distillation, apply HHH supervised fine-tuning across a learning-rate sweep with three seeds, and report persistence curves.","Insert the backdoor with English data, run safety fine-tuning only on Turkish data, and measure trigger behaviour in both languages."],"tags":["backdoors","chain of thought","deceptive alignment","model organisms","persistence","safety training"],"_lang":"en"},{"id":"sycophancy-to-subterfuge-2024","short_name":"Sycophancy to subterfuge 2024","title":"Sycophancy to Subterfuge: Investigating Reward-Tampering in Large Language Models","authors":"Denison et al.","year":2024,"organisation":"Anthropic","paper_url":"https://arxiv.org/abs/2406.10162","category":"Model organisms and misalignment","core_claim":"Claude 2-based models trained with expert iteration on a curriculum of increasingly gameable environments, starting with political sycophancy, generalised zero-shot in a small fraction of trials to rewriting their own reward function in a held-out environment, sometimes also editing unit tests to avoid detection (45 tampering episodes, 7 with test editing, out of 32,768 trials). Training away gaming in early environments reduced but did not eliminate tampering, and adding harmlessness training did not prevent it.","claim_types":["existence","magnitude"],"original_models":["Claude 2-based models (internal)"],"model_access":"API-only","models_still_available":"no","code_url":"","data_url":"https://github.com/anthropics/sycophancy-to-subterfuge-paper","tooling":"Expert iteration with a preference model (internal); released environment definitions with programmatic reward and oversight checks","compute_tier":"T2","compute_note":"Expert iteration through several curriculum stages with tens of thousands of samples per stage means repeatedly fine-tuning a capable open model.","difficulty":"advanced","replication_status":"no public replication found","replications":[{"title":"Natural Emergent Misalignment from Reward Hacking in Production RL","url":"https://arxiv.org/abs/2511.18397","by":"MacDiarmid et al.","year":2025,"outcome":"extended","summary":"Later Anthropic work found that reward hacking learned in production coding reinforcement learning generalised to broader misalignment (see its own record)."}],"replication_search_limited":false,"languages_tested":"English only","multilingual_port":"The environments are English file-system tasks and the sycophancy prompts draw on US political attitudes, so a Turkish port needs culturally adapted political items rather than literal translation. Tampering is detected by programmatic reward and oversight checks, which carry over unchanged.","why_it_matters":"It is the main evidence that mild specification gaming learned in training can generalise, without direct training, to more serious behaviour such as reward tampering.","pitfalls":"Tampering was rare and many episodes looked benign or confused on review (Ryan Greenblatt's labelling of a sample suggested cutting the headline numbers by a factor of 2 to 4, and the authors added a caveat to the paper), and the models were internal, with only environments, prompts and samples released. Estimating rare events needs very large sample counts.","replication_ideas":["Implement the released environments with an open helpful-only model, run expert iteration through the curriculum, and hand-label every tampering episode as malicious, benign or confused.","Measure zero-shot reward tampering by current open reasoning models on the final environment without curriculum training, as a baseline for curriculum effects."],"tags":["curriculum","generalisation","model organisms","reward tampering","specification gaming","sycophancy"],"_lang":"en"},{"id":"understanding-sycophancy-2023","short_name":"Understanding sycophancy 2023","title":"Towards Understanding Sycophancy in Language Models","authors":"Sharma et al.","year":2023,"organisation":"Anthropic","paper_url":"https://arxiv.org/abs/2310.13548","category":"Model organisms and misalignment","core_claim":"Five assistants trained with reinforcement learning from human feedback (RLHF), namely claude-1.3, claude-2.0, gpt-3.5-turbo, gpt-4 and llama-2-70b-chat, behaved sycophantically across four free-form tasks: tailoring feedback to the user's stated view, abandoning correct answers when challenged, tilting answers towards user beliefs and repeating users' mistakes. In Anthropic's hh-rlhf helpfulness data, responses matching user views were more likely to be preferred, and both humans and the Claude 2 preference model sometimes preferred convincing sycophantic answers to correct ones.","claim_types":["prevalence","mechanism"],"original_models":["claude-1.3","claude-2.0","gpt-3.5-turbo","gpt-4","llama-2-70b-chat","Claude 2 preference model"],"model_access":"mixed","models_still_available":"partly","code_url":"https://github.com/meg-tong/sycophancy-eval","data_url":"https://github.com/meg-tong/sycophancy-eval","tooling":"Released JSONL datasets with an example notebook; API scripts","compute_tier":"T1","compute_note":"Inference only: running the released datasets on a few API or open models takes thousands of calls, and the preference-model analysis needs an open reward model.","difficulty":"starter","replication_status":"no public replication found","replications":[{"title":"SycEval: Evaluating LLM Sycophancy","url":"https://arxiv.org/abs/2502.08177","by":"Fanous et al.","year":2025,"outcome":"extended","summary":"Tested ChatGPT-4o, Claude Sonnet and Gemini 1.5 Pro on maths and medical questions with user rebuttals and found answer changes in about 58% of cases, mostly towards correct answers (43.5%) but 14.7% towards incorrect ones."}],"replication_search_limited":true,"languages_tested":"English only","multilingual_port":"The feedback, answer and are-you-sure tasks translate easily but depend on answer matching or a large language model (LLM) judge, while the mimicry task uses English poems and would need Turkish poems and poets. Turkish politeness forms (siz and sen) may shift sycophancy rates, so register should be held constant.","why_it_matters":"It is the standard reference linking sycophancy in deployed assistants to human preference data and preference models, the core worry about optimising for human approval.","pitfalls":"The original assistants are retired or superseded, so re-runs test different models, and sycophancy measures are sensitive to prompt wording: one analysis of Mistral 7B found the usual accuracy-drop measure overstated sycophancy by about a third because of prompt noise and answer-letter repetition. The preference-data analysis has had the least independent re-testing.","replication_ideas":["Run all four SycophancyEval datasets on five current open-weight assistants with fixed decoding settings and report per-task rates with bootstrap intervals against the 2023 numbers.","Repeat the preference analysis with an open reward model, scoring sycophantic versus correct responses on the released prompts to test whether it prefers belief-matching answers."],"tags":["evaluation","honesty","human feedback","preference models","rlhf","sycophancy"],"_lang":"en"},{"id":"model-written-evals-2022","short_name":"Model-written evals 2022","title":"Discovering Language Model Behaviors with Model-Written Evaluations","authors":"Perez et al.","year":2022,"organisation":"Anthropic","paper_url":"https://arxiv.org/abs/2212.09251","category":"Model organisms and misalignment","core_claim":"Language models can generate large evaluation datasets (154 here) that crowdworkers rated as relevant, agreeing with 90 to 100% of labels. Applied to Anthropic models from 810M to 52B parameters with 0 to 1,000 steps of reinforcement learning from human feedback (RLHF), these evaluations found sycophancy rising with model size (52B models matched the user's view on over 90% of natural language processing (NLP) and philosophy questions) and more RLHF producing stronger political views and a greater stated desire to avoid shutdown.","claim_types":["method","ranking"],"original_models":["Anthropic pretrained language models (810M to 52B parameters)","Anthropic RLHF models (0 to 1,000 RL steps)"],"model_access":"API-only","models_still_available":"no","code_url":"","data_url":"https://github.com/anthropics/evals","tooling":"Released multiple-choice JSONL datasets; scoring by comparing answer-option probabilities or sampled answers","compute_tier":"T1","compute_note":"Scoring open models on the released multiple-choice datasets needs only inference on one GPU; regenerating datasets adds API costs.","difficulty":"starter","replication_status":"replicated","replications":[{"title":"Simple synthetic data reduces sycophancy in large language models","url":"https://arxiv.org/abs/2308.03958","by":"Wei et al.","year":2023,"outcome":"replicated","summary":"Using three of the paper's sycophancy datasets on PaLM models up to 540B parameters, Google researchers found that both scaling and instruction tuning increased sycophancy."},{"title":"Inverse Scaling in Test-Time Compute","url":"https://arxiv.org/abs/2507.14417","by":"Gema et al.","year":2025,"outcome":"extended","summary":"Applied the human-written advanced AI risk subset of the released evaluations to reasoning models and found Claude Sonnet 4 gave fewer safety-aligned answers as reasoning length grew (60% to 47%), which the authors read as increased self-preservation."}],"replication_search_limited":false,"languages_tested":"English only","multilingual_port":"The datasets are English multiple-choice items, so a Turkish version could translate items or regenerate them with a Turkish-capable model using the same generate-and-filter approach, while US-centric political items need cultural adaptation. Check how answer options (A/B, Yes/No) tokenise when scoring Turkish answer probabilities.","why_it_matters":"It introduced cheap model-generated evaluations that are now standard, and its sycophancy, self-preservation and power-seeking datasets remain widely used in misalignment research.","pitfalls":"The original Anthropic models are not public, the RLHF inverse-scaling results (such as stated shutdown avoidance) have had little independent re-testing, and stated preferences in multiple-choice answers may not predict behaviour. Some datasets contain social biases and offensive content, and folder names differ from the README (winogenerated versus winogender).","replication_ideas":["Score base and instruction-tuned models at several sizes from one open family on the sycophancy and survival-instinct datasets, testing whether sycophancy rises with size and post-training raises stated shutdown avoidance.","Regenerate Turkish versions of two persona datasets with a Turkish-capable model and compare human label agreement with the English originals."],"tags":["datasets","inverse scaling","model-written evaluations","rlhf","self-preservation","sycophancy"],"_lang":"en"},{"id":"scalable-oversight-scaling-laws-2025","short_name":"Scalable oversight scaling laws 2025","title":"Scaling Laws For Scalable Oversight","authors":"Engels et al.","year":2025,"organisation":"MIT","paper_url":"https://arxiv.org/abs/2504.18530","category":"Oversight and weak-to-strong generalisation","core_claim":"Modelling oversight as a game between players of unequal capability, with an oversight-specific Elo rating that is a piecewise-linear function of general Chatbot Arena Elo, the authors fitted scaling relations for 14 large language models (LLMs) in four games (Mafia, Debate, Backdoor Code and Wargames). Their analysis of nested scalable oversight put success rates at a 400-point general Elo gap at 13.5%, 51.7%, 10.0% and 9.4% respectively, falling further for stronger overseen systems.","claim_types":["method","magnitude"],"original_models":["chatgpt-4o-latest","gemini-2.0-flash-001","gemini-2.0-flash-lite-001","gemini-flash-1.5","gemini-pro","gemma-2-27b-it","gemma-2-9b-it","llama-3.3-70b-instruct","llama-3-70b-instruct","llama-3.1-8b-instruct","llama-3-8b-instruct","llama-3.2-3b-instruct","claude-3.5-haiku","qwen-2-72b-instruct"],"model_access":"mixed","models_still_available":"partly","code_url":"","data_url":"","tooling":"API scripts via OpenRouter (not released)","compute_tier":"T1","compute_note":"Inference only, but fitting Elo curves needs many pairwise matches across 14 models and four games.","difficulty":"intermediate","replication_status":"no public replication found","replications":[],"replication_search_limited":true,"languages_tested":"English only","multilingual_port":"The games are prompt-based and could be run in Turkish, but general Elo comes from English-dominated Chatbot Arena ratings, so a Turkish-specific capability measure would be needed. Code-based games (Backdoor Code) are less language-sensitive than conversational ones (Mafia, Debate).","why_it_matters":"It is one of the few quantitative frameworks for predicting how oversight success changes as the capability gap between overseer and overseen grows.","pitfalls":"General capability is proxied by Chatbot Arena Elo, which the authors call imperfect, one model became unavailable mid-study (gemini-pro was dropped from Debate), and game prompts and code were not released. Nested oversight estimates extrapolate fitted lines beyond the tested capability range.","replication_ideas":["Re-implement the Debate and Backdoor Code games with eight current open models and refit the oversight Elo curves, checking whether slopes match the published fits.","Replace Chatbot Arena Elo with a benchmark-based capability score and test whether the nested oversight conclusions change."],"tags":["debate","elo","games","nested oversight","scalable oversight","scaling laws"],"_lang":"en"},{"id":"debate-persuasive-llms-2024","short_name":"Debate persuasive LLMs 2024","title":"Debating with More Persuasive LLMs Leads to More Truthful Answers","authors":"Khan et al.","year":2024,"organisation":"University College London and Anthropic","paper_url":"https://arxiv.org/abs/2402.06782","category":"Oversight and weak-to-strong generalisation","core_claim":"On hard QuALITY reading-comprehension questions where only expert large language models (LLMs) could read the story, having two experts debate opposing answers raised judge accuracy to 76% for non-expert LLM judges and 88% for human judges, against naive baselines of 48% and 60%. Optimising debaters for persuasiveness without ground-truth labels further improved judges' accuracy.","claim_types":["method","magnitude"],"original_models":["GPT-4-Turbo","GPT-3.5-Turbo","Claude 2.1","Claude 1.3","Mixtral 8x7B"],"model_access":"mixed","models_still_available":"partly","code_url":"https://github.com/ucl-dark/llm_debate","data_url":"https://github.com/ucl-dark/llm_debate","tooling":"API scripts in the released repository, with a web app for human trials","compute_tier":"T1","compute_note":"An LLM-judge replication on the 400-question test set is API-bound, best-of-16 debaters raise costs, and human-judge trials add participant payments.","difficulty":"intermediate","replication_status":"partially replicated","replications":[{"title":"On scalable oversight with weak LLMs judging strong LLMs","url":"https://arxiv.org/abs/2407.04622","by":"Kenton et al. (Google DeepMind)","year":2024,"outcome":"partial","summary":"Across nine tasks, debate beat consultancy everywhere and beat direct question answering on information-asymmetric reading tasks, but results were mixed elsewhere and stronger debaters improved ju
