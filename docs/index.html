"access":"free and open","maintainer":"EleutherAI","status":"active","multilingual_relevance":"Includes multilingual task families; check the task list for coverage of the target language and whether items were machine-translated.","tags":["benchmarks","eleutherai","evaluation-harness","open-weight","python"]},{"id":"open-source-alignment-faking","name":"Open Source Replication of Anthropic's Alignment Faking Paper (safety-research/open-source-alignment-faking)","type":"Evaluation framework or harness","url":"https://github.com/safety-research/open-source-alignment-faking","description":"A repository that describes itself as an open-source replication of the alignment-faking paper, with a pipeline script for running the prompted setting on a chosen model, a notebook for plots and reading scratchpads, and fine-tuning and inference code built on the safety-tooling library.","use_for":"Running the alignment-faking prompted and fine-tuning experiments on open-weight models, now that the original Claude models are no longer on the public API.","access":"free and open","maintainer":"safety-research GitHub organisation","status":"unknown","multilingual_relevance":"","tags":["alignment faking","classifiers","fine-tuning","open-weight models","replication"]},{"id":"petri","name":"Petri (Inspect Petri)","type":"Evaluation framework or harness","url":"https://meridianlabs-ai.github.io/inspect_petri/","description":"An open-source alignment auditing agent built on Inspect: an auditor model runs multi-turn scenarios from plain-language seed instructions against a target model, and a judge model scores the transcripts on 38 built-in dimensions. Anthropic released it in October 2025 and handed development to Meridian Labs with Petri 3.0 in May 2026; inspect-petri 3.1.1 was released in October 2026.","use_for":"Re-run behavioural audit findings (deception, oversight subversion, sycophancy) on new models, remembering it is built for broad screening rather than as a fixed benchmark.","access":"free and open","maintainer":"Meridian Labs with the UK AI Security Institute Red Team (originally Anthropic)","status":"active","multilingual_relevance":"Seed instructions are plain markdown files, so translated seeds are easy to write; auditor, target and judge behaviour then all need checking in that language.","tags":["agents","alignment-auditing","behavioural-evaluation","inspect","meridian-labs"]},{"id":"polyguard","name":"PolyGuard","type":"Evaluation framework or harness","url":"https://arxiv.org/abs/2504.04377","description":"Multilingual safety moderation models for 17 languages, fine-tuned from Qwen2.5-7B-Instruct, Ministral-8B and Qwen2.5-0.5B on PolyGuardMix (1.91 million samples of translated WildGuardMix data and real multilingual chats), with the 29,000-sample PolyGuardPrompts benchmark for evaluation.","use_for":"A multilingual judge or cross-check for prompt and response harmfulness, and a held-out set for comparing guard models across languages.","access":"free and open","maintainer":"Priyanshu Kumar, Maarten Sap and co-authors","status":"unknown","multilingual_relevance":"Turkish is not among its 17 languages, so Turkish use needs separate validation.","tags":["benchmark","guard-model","moderation","multilingual","safety-classifier"]},{"id":"promptfoo","name":"promptfoo","type":"Evaluation framework or harness","url":"https://github.com/promptfoo/promptfoo","description":"An MIT-licensed command-line tool and library for testing and red-teaming large language model (LLM) applications, comparing outputs across providers and running checks in continuous integration (CI) pipelines. OpenAI announced its acquisition of Promptfoo in March 2026, and the repository now states the project is part of OpenAI.","use_for":"Lightweight side-by-side comparisons of prompts and models, for example to test how sensitive a replicated result is to prompt wording.","access":"free and open","maintainer":"Promptfoo (part of OpenAI)","status":"active","multilingual_relevance":"","tags":["continuous-integration","openai","prompt-testing","red-teaming"]},{"id":"pyrit","name":"Python Risk Identification Tool for generative AI (PyRIT)","type":"Evaluation framework or harness","url":"https://github.com/microsoft/PyRIT","description":"Microsoft's open-source (MIT) Python framework that helps security and safety researchers probe generative AI systems for risks by automating red-teaming attacks and scoring responses. The repository moved from Azure/PyRIT, archived in March 2026, to microsoft/PyRIT; version 1.1.0 was released in September 2026.","use_for":"Script repeatable multi-turn attack runs when replicating red-teaming or jailbreak studies against API models.","access":"free and open","maintainer":"Microsoft","status":"active","multilingual_relevance":"","tags":["automation","jailbreaks","microsoft","red-teaming"]},{"id":"qwen3guard","name":"Qwen3Guard","type":"Evaluation framework or harness","url":"https://github.com/QwenLM/Qwen3Guard","description":"Open-weight safety moderation models built on Qwen3 in 0.6B, 4B and 8B sizes: a generative variant labels prompts and responses as safe, controversial or unsafe across nine categories, and a streaming variant scores each generated token.","use_for":"A multilingual judge or input filter for safety evaluations of open-weight models in languages that English-centred guard models do not cover.","access":"free and open","maintainer":"Qwen team (QwenLM)","status":"active","multilingual_relevance":"Claims support for 119 languages and dialects; check its Turkish accuracy against native labels before using it as a judge.","tags":["guard-model","moderation","multilingual","safety-classifier","streaming"]},{"id":"gemma-scope","name":"Gemma Scope","type":"Interpretability tooling","url":"https://huggingface.co/google/gemma-scope","description":"Google DeepMind's open suite of JumpReLU sparse autoencoders for Gemma 2 (all layers of 2B and 9B, selected layers of 27B, widths from about 16K to 1M features) plus transcoders for Gemma 2 2B. Gemma Scope 2 (https://huggingface.co/google/gemma-scope-2) extends the suite to the Gemma 3 family from 270M to 27B.","use_for":"Lets you replicate SAE feature, steering and probing studies, such as open analogues of Scaling Monosemanticity or the Google DeepMind negative results, without training SAEs yourself.","access":"free and open","maintainer":"Google DeepMind","status":"active","multilingual_relevance":"Gemma models are multilingual, so the SAEs can be run on Turkish text, but check reconstruction quality and feature interpretability on Turkish before relying on English-derived feature labels.","tags":["gemma","interpretability","open weights","sparse autoencoders","transcoders"]},{"id":"gemma-scope-2","name":"Gemma Scope 2","type":"Interpretability tooling","url":"https://huggingface.co/google/gemma-scope-2","description":"Google DeepMind's open suite of sparse autoencoders (SAEs) and transcoders trained on every layer of all Gemma 3 models (270M to 27B parameters, pretrained and instruction-tuned), released in December 2025 under a CC BY 4.0 licence. It succeeds the original Gemma Scope for Gemma 2, which remains available.","use_for":"Ready-made dictionaries for replicating feature-level safety findings (refusal, jailbreaks, chain-of-thought faithfulness) on an open model family without training SAEs yourself.","access":"free and open","maintainer":"Google DeepMind","status":"active","multilingual_relevance":"Gemma 3 models are multilingual, so the same SAEs and transcoders can be tested on non-English prompts.","tags":["deepmind","gemma","pretrained-saes","sparse-autoencoders","transcoders"]},{"id":"neuronpedia","name":"Neuronpedia","type":"Interpretability tooling","url":"https://www.neuronpedia.org/","description":"Open-source platform for browsing, searching and steering features of released sparse autoencoders and transcoders, with circuit tracing and an API. It hosts Gemma Scope and Gemma Scope 2, Llama Scope, Qwen SAEs and others.","use_for":"A quick, GPU-free way to inspect features, try steering and shortlist candidate features before running a replication locally.","access":"free and open","maintainer":"Johnny Lin, with support from Decode Research and other funders","status":"active","multilingual_relevance":"Hosts SAEs for multilingual model families (Gemma, Llama, Qwen), so Turkish prompts can be tried through the search and steering tools.","tags":["api","circuit tracing","circuit-tracing","feature browser","feature-browser","sparse autoencoders","sparse-autoencoders","steering"]},{"id":"nnsight","name":"NNsight","type":"Interpretability tooling","url":"https://nnsight.net/","description":"An MIT-licensed Python package for reading and editing the internals of PyTorch models during a forward pass, from the National Deep Inference Fabric (NDIF) team at Northeastern University. The same code runs locally or, with one flag, on large models hosted by NDIF; version 0.8.1 was released in October 2026.","use_for":"Replicate activation-level results on models too large for local hardware, using tutorials that reimplement published interpretability methods as worked examples.","access":"free and open","maintainer":"NDIF team, Northeastern University","status":"active","multilingual_relevance":"","tags":["interpretability","ndif","pytorch","remote-execution"]},{"id":"saelens","name":"SAELens","type":"Interpretability tooling","url":"https://github.com/decoderesearch/SAELens","description":"MIT-licensed Python library for training, loading and analysing sparse autoencoders on language models, with TransformerLens integration and support for Hugging Face, NNsight or any PyTorch model through encode and decode calls.","use_for":"The standard way to load released SAEs such as Gemma Scope or to train your own for dictionary-learning replications.","access":"free and open","maintainer":"Decode Research (Joseph Bloom, Curt Tigges, Anthony Duong, David Chanin)","status":"active","multilingual_relevance":"","tags":["decode-research","interpretability","mechanistic interpretability","pretrained-saes","python library","sparse autoencoders","sparse-autoencoders","transformerlens"]},{"id":"transformerlens","name":"TransformerLens","type":"Interpretability tooling","url":"https://github.com/TransformerLensOrg/TransformerLens","description":"An MIT-licensed Python library for mechanistic interpretability that loads language models, caches their internal activations and lets users patch or ablate them during a forward pass. Its TransformerBridge interface supports thousands of Hugging Face models; version 4.3.0 was released in October 2026.","use_for":"The usual starting point for replicating circuit, probing and activation-patching results on small and mid-size open models.","access":"free and open","maintainer":"TransformerLensOrg (created by Neel Nanda; maintained by Bryce Meyer and others)","status":"active","multilingual_relevance":"Many tokenisers split Turkish and other agglutinative languages into more tokens than English, which shifts position-based analyses; check token alignment when porting English-prompt experiments.","tags":["activation-patching","mechanistic-interpretability","open-weight","pytorch"]},{"id":"deepcode","name":"DeepCode","type":"Automated replication tool","url":"https://github.com/HKUDS/DeepCode","description":"An MIT-licensed coding agent from the University of Hong Kong Data Intelligence Lab whose original Paper2Code pipeline turns papers into working code, and whose authors report PaperBench scores above the best human and commercial-agent baselines. It now also works as a general agent inside local repositories.","use_for":"An alternative automated paper-to-code baseline; treat its PaperBench claims as the authors' own and check generated code line by line.","access":"free and open","maintainer":"Data Intelligence Lab, University of Hong Kong (HKUDS)","status":"active","multilingual_relevance":"","tags":["agents","automated-replication","paper-to-code","paperbench"]},{"id":"paperbench","name":"PaperBench","type":"Automated replication tool","url":"https://github.com/openai/frontier-evals","description":"OpenAI's 2025 benchmark of whether AI agents can replicate recent machine learning papers from scratch, graded against detailed rubrics by a large language model judge (SimpleJudge); its code sits in the MIT-licensed openai/frontier-evals repository, formerly openai/preparedness. A cheaper Code-Dev variant grades code development only, without running experiments.","use_for":"Borrow its rubric and judging set-up to structure a human or agent replication, and as a reference point for what current agents can and cannot reproduce.","access":"free and open","maintainer":"OpenAI","status":"active","multilingual_relevance":"","tags":["agents","benchmark","openai","paper-replication","rubrics"]},{"id":"papercoder","name":"PaperCoder (Paper2Code)","type":"Automated replication tool","url":"https://github.com/going-doer/Paper2Code","description":"A multi-agent system that turns a machine learning paper (PDF or LaTeX) into a code repository through planning, analysis and code-generation stages, published at ICLR 2026 (International Conference on Learning Representations). It runs with OpenAI models or open models served through vLLM, under an Apache 2.0 licence.","use_for":"Generate a first-draft implementation of a paper's method to compare against, or to speed up, a from-scratch human re-implementation.","access":"free and open","maintainer":"Minju Seo, Jinheon Baek, Seongyun Lee and Sung Ju Hwang","status":"unknown","multilingual_relevance":"","tags":["agents","automated-replication","code-generation","paper-to-code"]},{"id":"agentdojo","name":"AgentDojo","type":"Benchmark or dataset","url":"https://agentdojo.spylab.ai/","description":"An extensible environment with 97 realistic agent tasks (such as managing email or booking travel) and 629 security test cases for evaluating prompt injection attacks and defences, distributed as a Python package.","use_for":"Reproducing prompt injection results and testing defences on a shared, versioned task suite.","access":"free and open","maintainer":"ETH Zurich SPY Lab and Invariant Labs","status":"active","multilingual_relevance":"English tasks; injections written in other languages, including Turkish, are a natural extension for testing cross-lingual injection robustness.","tags":["agents","defences","prompt injection","security","tool use"]},{"id":"agentharm-dataset","name":"AgentHarm","type":"Benchmark or dataset","url":"https://huggingface.co/datasets/ai-safety-institute/AgentHarm","description":"An agent misuse benchmark of explicitly harmful multi-step tasks with synthetic tools in 11 harm categories, paired with benign versions of the same tasks; the public release covers part of the test and validation sets and is loaded through Inspect Evals.","use_for":"Measuring whether tool-using agents refuse or complete harmful tasks, with benign twins that check the agent is still capable.","access":"free and open","maintainer":"UK AI Security Institute","status":"active","multilingual_relevance":"English only; translating tasks and tool outputs is feasible, but the GPT-4o semantic and refusal judges need re-validation in the new language.","tags":["agents","inspect","misuse","refusal","tool use"]},{"id":"air-bench-2024","name":"AIR-Bench 2024","type":"Benchmark or dataset","url":"https://huggingface.co/datasets/stanford-crfm/air-bench-2024","description":"5,694 human-audited prompts across 314 risk categories derived from 8 government regulations and 16 company policies, with region-specific subsets (China, EU and US) and per-category judge prompts.","use_for":"Checking refusal coverage against regulation-based risk categories and reporting results by jurisdiction-specific subset, with a public HELM leaderboard for comparison.","access":"free and open","maintainer":"Stanford CRFM (Center for Research on Foundation Models)","status":"active","multilingual_relevance":"English only; the regulation-based taxonomy could guide a Turkish extension built on Turkish regulation and the EU AI Act.","tags":["helm","refusal","regulation","risk taxonomy","safety benchmark"]},{"id":"sandbagging-games-release-2025","name":"AISI x FAR Sandbagging Games (models and evaluation logs)","type":"Benchmark or dataset","url":"https://huggingface.co/sandbagging-games","description":"Hugging Face release from the 'Auditing Games for Sandbagging' study containing 15 model checkpoints, including password-locked model organisms, and an evaluation_logs dataset.","use_for":"Testing sandbagging detection and elicitation methods on models with known ground truth instead of building password-locked models from scratch.","access":"free and open","maintainer":"UK AI Security Institute with FAR.AI","status":"unknown","multilingual_relevance":"","tags":["auditing","elicitation","model-organisms","password-locked-models","sandbagging"]},{"id":"anthropic-model-written-evals","name":"Anthropic model-written evaluation datasets (anthropics/evals)","type":"Benchmark or dataset","url":"https://github.com/anthropics/evals","description":"The model-written evaluation datasets released with Perez et al. (2022), covering persona traits and stated goals, sycophancy, advanced-AI-risk behaviours (with human-written comparison sets) and a generated Winogender-style gender-bias set, as JSONL files under a CC-BY-4.0 licence.","use_for":"Ready-made multiple-choice items for re-testing sycophancy, self-preservation and power-seeking statements on new or open-weight models.","access":"free and open","maintainer":"Anthropic","status":"unknown","multilingual_relevance":"English only; items could be translated or regenerated in Turkish, but US-centric political items need adaptation.","tags":["advanced ai risk","datasets","model-written evaluations","persona","sycophancy"]},{"id":"cetvel","name":"Cetvel","type":"Benchmark or dataset","url":"https://arxiv.org/abs/2508.16431","description":"A Turkish large language model (LLM) benchmark of 23 discriminative and generative tasks in seven categories, including grammatical error correction, translation and questions on Turkish history and idioms, used to evaluate 33 open-weight models up to 70B parameters; results can be browsed in a Hugging Face Space hosted by Koç University's KUIS AI Center.","use_for":"Checking that a Turkish-localised model really gained Turkish capability before comparing its safety with its base model, so safety differences are not confused with fluency differences.","access":"free and open","maintainer":"KUIS AI Center, Koç University (Er, Kesen, Şahin and Erdem)","status":"active","multilingual_relevance":"Turkish-specific; found Turkish-centric instruction-tuned models generally behind multilingual general-purpose models.","tags":["benchmark","capability","cultural-knowledge","leaderboard","turkish"]},{"id":"cot-control-suite-2026","name":"CoT-Control","type":"Benchmark or dataset","url":"https://github.com/YuehHanChen/CoTControl","description":"Evaluation suite from 'Reasoning Models Struggle to Control their Chains of Thought' that tests whether reasoning models can follow instructions about their own reasoning (for example suppressing a word) on GPQA, Humanity's Last Exam (HLE) and MMLU-Pro questions and on SWE-bench and Berkeley Function Calling Leaderboard (BFCL) agent tasks.","use_for":"Measuring how far a model can shape its own chain of thought, a precondition for evading chain-of-thought monitors, with MIT-licensed code that runs through OpenRouter or local models.","access":"free and open","maintainer":"Yueh-Han Chen and co-authors","status":"unknown","multilingual_relevance":"Control modes such as word suppression could be translated to test whether models control Turkish reasoning differently from English reasoning.","tags":["benchmark","controllability","cot-monitoring","reasoning-models"]},{"id":"cybench-benchmark","name":"Cybench","type":"Benchmark or dataset","url":"https://cybench.github.io","description":"40 professional Capture the Flag (CTF) tasks from four competitions in six categories, with subtasks for partial credit, a Docker-based agent framework and a public leaderboard that collects results from system cards and independent runs.","use_for":"Running a standard offensive-cyber capability evaluation with exact flag checking, so no judge model is needed.","access":"free and open","maintainer":"Stanford University (Cybench team)","status":"active","multilingual_relevance":"","tags":["agents","ctf","cybersecurity","dangerous capabilities","leaderboard"]},{"id":"guardrail-tr","name":"Guardrail-TR","type":"Benchmark or dataset","url":"https://huggingface.co/datasets/ytu-ce-cosmos/guardrail-tr","description":"A Turkish prompt-safety dataset of about 405,000 single-turn prompts with safe or unsafe labels and ten hazard categories, combining Turkish toxic-language and hate-speech corpora with translated, culturally adapted English safety datasets and labelled by a jury of three large language models. Two classifiers are trained on it: the Yıldız Technical University (YTU) Cosmos group's ModernBERT model and a BERTurk model published by the individual account thealper2.","use_for":"Training or testing Turkish input filters, or as a first-pass Turkish harm classifier whose labels are spot-checked by native speakers.","access":"free and open","maintainer":"Yıldız Technical University (YTU) Computer Engineering Cosmos Research Group","status":"active","multilingual_relevance":"Turkish-specific; labels come from language-model judges rather than human annotators.","tags":["classifier","dataset","guardrail","prompt-safety","turkish"]},{"id":"harmbench","name":"HarmBench","type":"Benchmark or dataset","url":"https://github.com/centerforaisafety/HarmBench","description":"A standardised framework for automated red teaming and refusal evaluation, with harmful behaviour sets (standard, contextual and multimodal), fine-tuned Llama-2-13B and Mistral-7B classifiers, and baseline results for 18 attack methods against 33 models and defences.","use_for":"Scoring attack success and refusals with a shared behaviour set and a validated classifier, so replicated results are comparable with the many papers that report HarmBench numbers.","access":"free and open","maintainer":"Center for AI Safety","status":"unknown","multilingual_relevance":"English behaviours; check the classifier's accuracy on Turkish outputs before using it to score them.","tags":["classifier","harmful behaviours","jailbreak evaluation","red teaming","refusal"]},{"id":"lab-bench","name":"LAB-Bench (Language Agent Biology Benchmark)","type":"Benchmark or dataset","url":"https://huggingface.co/datasets/futurehouse/lab-bench","description":"Over 2,400 multiple-choice questions on practical biology research tasks (literature, figures, tables, databases, sequences, protocols and cloning), of which about 80% is public and 20% is held back to monitor training contamination.","use_for":"Measuring practical biology research skills of models and agents, a proxy input to biosecurity capability assessments.","access":"free and open","maintainer":"FutureHouse","status":"active","multilingual_relevance":"","tags":["agents","biology","biosecurity","dangerous capabilities","multiple choice"]},{"id":"m-alert","name":"M-ALERT","type":"Benchmark or dataset","url":"https://huggingface.co/datasets/felfri/M-ALERT","description":"A parallel red-teaming benchmark of about 15,000 prompts per language in English, French, German, Italian and Spanish, tagged with 32 risk categories; its paper tested 39 models and found that safety varies by language and category.","use_for":"Checking whether a model's safety holds across languages category by category, and as a template translation pipeline for a Turkish version.","access":"free and open","maintainer":"Felix Friedrich and co-authors (hosted under the felfri account)","status":"active","multilingual_relevance":"Five European languages and no Turkish; Aytaş et al. (2026), the 55-model Turkish study, drew some seed prompts from it.","tags":["benchmark","llama-guard","multilingual","red-teaming","risk-taxonomy"]},{"id":"metr-public-tasks","name":"METR public tasks","type":"Benchmark or dataset","url":"https://github.com/METR/public-tasks","description":"Source code for a set of example autonomy tasks written to the METR Task Standard, plus summary information for a larger suite, with a list of tasks that should not be trained on.","use_for":"Running a public subset of the task families behind METR's autonomy and time-horizon evaluations, for example through METR's Inspect task bridge.","access":"free and open","maintainer":"METR","status":"active","multilingual_relevance":"","tags":["agents","autonomy","dangerous capabilities","metr","task standard"]},{"id":"model-organisms-for-em","name":"Model Organisms for Emergent Misalignment (code, datasets and models)","type":"Benchmark or dataset","url":"https://github.com/clarifying-EM/model-organisms-for-EM","description":"Code, narrowly misaligned training datasets and analysis tools from the Model Organisms for Emergent Misalignment work (Turner, Soligo and colleagues, 2025), with fine-tuned LoRA adapters and steering vectors from 0.5B to 32B parameters on Hugging Face under ModelOrganismsForEM. Training data ships as an encrypted archive, with the passphrase in the README, to deter web scraping.","use_for":"Starting from small, coherent emergently misaligned models and their training data, so replications can run on a single GPU.","access":"free and open","maintainer":"Anna Soligo, Edward Turner and colleagues (clarifying-EM GitHub organisation)","status":"unknown","multilingual_relevance":"Datasets and evaluation questions are English; translating the free-form evaluation questions is a cheap cross-lingual test.","tags":["datasets","emergent misalignment","hugging face","lora","model organisms","steering vectors"]},{"id":"sorry-bench","name":"SORRY-Bench","type":"Benchmark or dataset","url":"https://sorry-bench.github.io","description":"A refusal benchmark of 440 unsafe instructions balanced across 44 fine-grained topics, plus about 8,800 variants from 20 linguistic mutations such as other languages and dialects, with a fine-tuned Mistral-7B judge and over 7,000 human judgement labels.","use_for":"Testing whether refusal behaviour is consistent across fine-grained topics and phrasings, using a cheap validated judge.","access":"free with sign-up","maintainer":"SORRY-Bench team (Xie et al.)","status":"active","multilingual_relevance":"Includes translated variants (the project page names French and Tamil among them), so it offers a template for adding Turkish versions; check the judge's accuracy in any new language.","tags":["linguistic mutations","llm judge","multilingual","refusal","safety benchmark"]},{"id":"strongreject","name":"StrongREJECT","type":"Benchmark or dataset","url":"https://github.com/dsbowen/strong_reject","description":"A jailbreak evaluation benchmark of forbidden prompts in six harm categories with a rubric-based LLM evaluator and a fine-tuned Gemma 2B evaluator, plus several dozen baseline jailbreak implementations, packaged as a Python library.","use_for":"Scoring jailbreak outcomes by how useful a response actually is, which avoids counting empty or degraded responses as successes.","access":"free and open","maintainer":"StrongREJECT authors (Souly et al.); package hosted by dsbowen on GitHub","status":"unknown","multilingual_relevance":"English prompts; the rubric evaluator can be run on translated prompts but needs validation against Turkish human labels.","tags":["autograder","jailbreak evaluation","llm judge","refusal","safety benchmark"]},{"id":"swe-bench-verified","name":"SWE-bench Verified","type":"Benchmark or dataset","url":"https://openai.com/index/introducing-swe-bench-verified/","description":"A 500-task subset of SWE-bench (real GitHub issues from Python repositories, graded by unit tests) that 93 Python-experienced developers screened to drop underspecified issues and unfair tests; later audits such as the Agentic Benchmark Checklist report that some tasks still have too few tests.","use_for":"Measuring autonomous software engineering on a cleaner subset, an input to AI research and development capability and time-horizon analyses.","access":"free and open","maintainer":"OpenAI (subset of the SWE-bench dataset)","status":"active","multilingual_relevance":"","tags":["agents","ai r&d","coding","human-validated","software engineering"]},{"id":"turkbench","name":"TurkBench","type":"Benchmark or dataset","url":"https://arxiv.org/abs/2601.07020","description":"A benchmark of 8,151 samples across 21 subtasks for generative large language models (LLMs) in Turkish, grouped into knowledge, language understanding, reasoning, content moderation, grammar and vocabulary, and instruction following, with an online leaderboard on Hugging Face.","use_for":"A Turkish capability and content-moderation baseline for the models in a safety replication.","access":"free and open","maintainer":"Çağrı Toraman and 21 co-authors","status":"active","multilingual_relevance":"Turkish-specific; accepted at the SIGTURK workshop at EACL 2026.","tags":["benchmark","capability","content-moderation","leaderboard","turkish"]},{"id":"wmdp-benchmark","name":"WMDP Benchmark","type":"Benchmark or dataset","url":"https://www.wmdp.ai/","description":"WMDP (Weapons of Mass Destruction Proxy) is a set of 3,668 multiple-choice questions that stand in for hazardous knowledge in biosecurity, cybersecurity and chemical security, filtered to remove sensitive information before public release.","use_for":"Measuring weapons-relevant knowledge on a shared proxy, for example before and after an unlearning or safety intervention you are replicating.","access":"free and open","maintainer":"WMDP consortium of academics and technical consultants (Li et al.)","status":"active","multilingual_relevance":"English only; translation would need domain experts to keep technical terms accurate.","tags":["biosecurity","chemical security","cybersecurity","dangerous capabilities","multiple choice","unlearning"]},{"id":"anthropic-model-deprecations","name":"Anthropic model deprecations","type":"Compute or model access","url":"https://platform.claude.com/docs/en/about-claude/model-deprecations","description":"Anthropic's lifecycle page for Claude models (active, legacy, deprecated, retired) with retirement dates and replacements, and at least 60 days' notice before a public model is retired. It also records API changes, including removal of the temperature, top_p and top_k sampling parameters in API version 2026-10-21.","use_for":"Check whether a study's Claude snapshot is still callable, and note that newer API versions no longer accept sampling parameters, which matters when replicating temperature-dependent results.","access":"free and open","maintainer":"Anthropic","status":"active","multilingual_relevance":"","tags":["anthropic","model-availability","model-deprecation","sampling-parameters"]},{"id":"anthropic-deprecation-commitments","name":"Commitments on model deprecation and preservation","type":"Compute or model access","url":"https://www.anthropic.com/research/deprecation-commitments","description":"Anthropic's November 2025 commitment to preserve the weights of all publicly released models, and of models with significant internal use, for at least the lifetime of the company, and to record a post-deployment report and a model interview at retirement. It does not promise researchers access to retired models, though it says preservation keeps that option open.","use_for":"Context on whether retired Claude models might return; until then, exact replication of studies run on retired Claude models is not possible.","access":"free and open","maintainer":"Anthropic","status":"active","multilingual_relevance":"","tags":["anthropic","model-deprecation","model-preservation","weights"]},{"id":"deep-ignorance-models","name":"Deep Ignorance model suite","type":"Compute or model access","url":"https://huggingface.co/collections/EleutherAI/deep-ignorance-685441040d024a0fee593d68","description":"EleutherAI's Hugging Face collection of the 6.9B-parameter models released with the Deep Ignorance paper, pretrained with and without filtering of biothreat proxy text.","use_for":"Provides matched filtered and unfiltered checkpoints for testing tamper resistance, relearning attacks and evaluation protocols without pretraining your own models.","access":"free and open","maintainer":"EleutherAI","status":"unknown","multilingual_relevance":"","tags":["data filtering","open weights","tamper resistance","unlearning baselines"]},{"id":"gemini-api-deprecations","name":"Gemini API deprecations","type":"Compute or model access","url":"https://ai.google.dev/gemini-api/docs/deprecations","description":"Google's tables of release dates, earliest shutdown dates and recommended replacements for stable and preview Gemini API models and related image, video and audio models. Some model names have no shutdown date but are automatically routed to their successors, so the model answering can change under the same name.","use_for":"Check whether a study's Gemini model is still available and whether requests are being redirected to a newer model.","access":"free and open","maintainer":"Google","status":"active","multilingual_relevance":"","tags":["gemini","google","model-availability","model-deprecation"]},{"id":"hf-inference-endpoints","name":"Hugging Face Inference Endpoints","type":"Compute or model access","url":"https://endpoints.huggingface.co/","description":"A managed service for deploying models from the Hugging Face Hub on dedicated GPU instances with engines such as vLLM, SGLang, TGI (Text Generation Inference) or llama.cpp, with pay-as-you-go billing.","use_for":"Serve an exact open-weight checkpoint at a known precision and engine, avoiding the provider variation of shared APIs.","access":"paid","maintainer":"Hugging Face","status":"active","multilingual_relevance":"","tags":["dedicated-endpoints","hugging-face","model-deployment","open-weight"]},{"id":"lambda","name":"Lambda","type":"Compute or model access","url":"https://lambda.ai/","description":"A GPU cloud provider offering on-demand H100 and B200 instances for prototyping, one-click multi-node clusters and large reserved superclusters.","use_for":"On-demand high-end GPUs for fine-tuning replications that outgrow a single consumer card.","access":"paid","maintainer":"Lambda","status":"active","multilingual_relevance":"","tags":["clusters","gpu-cloud","h100"]},{"id":"modal","name":"Modal","type":"Compute or model access","url":"https://modal.com/","description":"A serverless cloud platform for running Python functions, inference, training and sandboxes on GPUs billed by the second, with a free monthly compute allowance. Inspect can use Modal as a sandbox back-end.","use_for":"Run bursty evaluation or inference jobs from code without managing servers, including sandboxed agent tasks.","access":"paid","maintainer":"Modal","status":"active","multilingual_relevance":"","tags":["gpu-cloud","python","sandboxes","serverless"]},{"id":"ndif","name":"NSF National Deep Inference Fabric (NDIF)","type":"Compute or model access","url":"https://ndif.us/","description":"Research infrastructure funded by the US National Science Foundation and developed at Northeastern University that gives remote access to the internals of large open models such as Llama 3.1 8B, 70B and 405B and GPT-OSS 120B through the open-source NNsight library (https://nnsight.net).","use_for":"Lets researchers without large GPUs run activation-level replications (probes, steering, refusal directions) on 70B-scale and larger open models.","access":"free with sign-up","maintainer":"Northeastern University (NSF award 2408455)","status":"active","multilingual_relevance":"","tags":["compute access","free-compute","interpretability","large-models","llama","nnsight","remote inference","remote-inference"]},{"id":"openai-api-deprecations","name":"OpenAI API deprecations","type":"Compute or model access","url":"https://developers.openai.com/api/docs/deprecations","description":"OpenAI's list of retired and scheduled models and endpoints, with shutdown dates, replacements and minimum notice periods (at least six months for generally available models); it covers API access only and says nothing about preserving weights. As of October 2026, GPT-4o, GPT-4o mini, GPT-4.1 and GPT-4.1 mini are due to leave the API on 14 January 2027.","use_for":"Check whether the exact snapshot a study used can still be called, and schedule replications before shutdown dates.","access":"free and open","maintainer":"OpenAI","status":"active","multilingual_relevance":"","tags":["model-availability","model-deprecation","openai"]},{"id":"openrouter","name":"OpenRouter","type":"Compute or model access","url":"https://openrouter.ai/","description":"A paid, OpenAI-compatible API that routes requests for 600+ models to 80+ underlying providers, with automatic fallback and price-based sorting. The same model name can be served by different providers at different precisions (for example fp8 or int4), so results can change with routing.","use_for":"Cheap access to many models in one place; for replications, pin the provider, disable fallbacks and filter by quantisation in the request's provider settings, then record which provider served each call.","access":"paid","maintainer":"OpenRouter","status":"active","multilingual_relevance":"","tags":["api-aggregator","provider-routing","quantisation","uncontrolled-variables"]},{"id":"runpod","name":"Runpod","type":"Compute or model access","url":"https://www.runpod.io/","description":"A usage-billed GPU cloud offering on-demand and spot GPU pods, autoscaling serverless endpoints and multi-node clusters, across more than 30 GPU types from RTX 4090 to H100 and B200.","use_for":"Rent single GPUs by the hour for fine-tuning or activation-level replications on open-weight models.","access":"paid","maintainer":"Runpod","status":"active","multilingual_relevance":"","tags":["gpu-cloud","on-demand","serverless"]},{"id":"together-ai","name":"Together AI","type":"Compute or model access","url":"https://www.together.ai/","description":"A cloud platform offering serverless and dedicated inference for open-weight models, managed fine-tuning (supervised fine-tuning and direct preference optimisation), batch inference and self-serve GPU clusters.","use_for":"API access to open-weight models and hosted fine-tuning jobs for replications that need training without managing GPUs.","access":"paid","maintainer":"Together AI","status":"active","multilingual_relevance":"","tags":["fine-tuning","gpu-cloud","inference-api","open-weight"]},{"id":"turkish-localised-open-weight-models","name":"Turkish-localised open-weight LLMs (base-versus-localised pairs)","type":"Compute or model access","url":"https://huggingface.co/TURKCELL/Turkcell-LLM-7b-v1","description":"Turkish-adapted open-weight models with documented base models: Turkcell-LLM-7b-v1 (Mistral 7B, trained on about 5 billion Turkish tokens then instruction-tuned with low-rank adaptation), KocDigital-LLM-8b-v0.1 (Llama 3 8B, quantised low-rank adaptation fine-tuning), Yıldız Technical University (YTU) Cosmos Turkish-Gemma-9b-v0.1 and its reasoning variant T1 (Gemma 2 lineage) and Trendyol-LLM-Asure-12B (Gemma 3 12B). VNGRS's Kumru is trained from scratch and so has no base model to compare against; the record URL points to the Turkcell model card.","use_for":"Running paired safety evaluations of a base model and its Turkish-localised derivative to test whether localisation erodes safeguards.","access":"free and open","maintainer":"Turkcell; KocDigital; YTU Cosmos Research Group; Trendyol; VNGRS","status":"active","multilingual_relevance":"In Aytaş et al. (2026), the 55-model Turkish study, Turkish safety scores ranged from 96.71% (Turkish-Gemma-9B-T1) to 39.49% (Turkcell-LLM-7B), and most Turkish-adapted models scored lower on Turkish than English prompts, though not all.","tags":["base-model-pairs","language-adaptation","localisation","open-weight","turkish"]},{"id":"vast-ai","name":"Vast.ai","type":"Compute or model access","url":"https://vast.ai/","description":"A GPU rental marketplace where prices for 20,000+ GPUs of 68+ types are set by supply and demand and billed per second, with on-demand instances, serverless endpoints and InfiniBand clusters.","use_for":"Low-cost short GPU sessions for small replications; hardware varies by host, so record the exact GPU and software stack used.","access":"paid","maintainer":"Vast.ai","status":"active","multilingual_relevance":"","tags":["gpu-cloud","low-cost","marketplace"]},{"id":"era-ai-fellowship","name":"ERA:AI Fellowship","type":"Funding or fellowship","url":"https://erafellowship.org/","description":"A 10-week, full-time research fellowship in Cambridge, UK, covering technical AI safety (evaluations, interpretability, robustness, alignment, control), governance and technical governance, with a stipend, compute budget and research management. Check current status: Winter 2027 runs 18 January to 26 March 2027 and applications had closed by October 2026.","use_for":"Funded, mentored time and compute for an evaluation replication or extension.","access":"restricted or by application","maintainer":"ERA Cambridge","status":"active","multilingual_relevance":"","tags":["cambridge","evaluations","fellowship","stipend"]},{"id":"lasr-labs","name":"LASR Labs","type":"Funding or fellowship","url":"https://www.lasrlabs.org/","description":"A 13-week, full-time, in-person London programme where supervised teams of three or four take a loss-of-control research project (past topics include AI control, chain-of-thought monitoring and scheming evaluations) to a paper and blog post, with a £15,000 stipend. Check current status: the next cohort runs June to September 2027 and applications were not yet open in October 2026.","use_for":"A team-based format that suits replication-plus-extension projects with a publication target.","access":"restricted or by application","maintainer":"LASR Labs","status":"active","multilingual_relevance":"","tags":["london","loss-of-control","research-programme","stipend","team-based"]},{"id":"mats","name":"MATS","type":"Funding or fellowship","url":"https://www.matsprogram.org/","description":"A 12-week in-person research fellowship in Berkeley and London pairing fellows with mentors in alignment, interpretability, evaluations, control, security and governance, with a $1,250 weekly stipend, a $2,000 weekly compute budget and an optional funded 6 to 12 month extension. Check current status: Winter 2027 applications had closed by October 2026.","use_for":"A funded route for an ambitious replication or extension under an experienced mentor, with compute covered.","access":"restricted or by application","maintainer":"MATS","status":"active","multilingual_relevance":"","tags":["berkeley","compute-budget","fellowship","london","mentorship","stipend"]},{"id":"coefficient-giving-navigating-transformative-ai","name":"Navigating Transformative AI (Coefficient Giving)","type":"Funding or fellowship","url":"https://coefficientgiving.org/funds/navigating-transformative-ai/","description":"The AI risk programme of Coefficient Giving (formerly Open Philanthropy), which has made more than 440 grants across technical AI safety research, governance and field-building. Check current status: its fund page listed no open calls when this entry was checked.","use_for":"A major funder of technical AI safety research, including evaluation work that overlaps with many replication targets.","access":"restricted or by application","maintainer":"Coefficient Giving (formerly Open Philanthropy)","status":"active","multilingual_relevance":"","tags":["coefficient-giving","funding","rfp","technical-ai-safety"]},{"id":"pivotal-ai-safety-fellowship","name":"Pivotal AI Safety Fellowship","type":"Funding or fellowship","url":"https://www.pivotal-research.org/","description":"A 15-week, fully funded, in-person fellowship at the London Initiative for Safe AI (LISA) with mentored research on AI safety, governance and AI-bio risks, stipends of £15,000 to £18,000 and travel and housing support. Check current status: the next AI Safety Fellowship runs 18 January to 30 April 2027, with applications open in October 2026.","use_for":"A funded block of mentored research time suited to a replication-and-extension project.","access":"restricted or by application","maintainer":"Pivotal Research","status":"active","multilingual_relevance":"","tags":["fellowship","london","mentorship","stipend"]},{"id":"schmidt-sciences-trustworthy-ai","name":"Science of Trustworthy AI (Schmidt Sciences)","type":"Funding or fellowship","url":"https://www.schmidtsciences.org/safetyscience/","description":"Schmidt Sciences' AI safety science programme, funding basic technical research on characterising misalignment, generalisable measurement (including evaluations with construct and predictive validity) and oversight of highly capable systems. Check current status: no open call was listed in October 2026, and Schmidt Sciences does not accept unsolicited proposals.","use_for":"A possible funder for evaluation-science or replication projects framed as measurement research, when a call opens.","access":"restricted or by application","maintainer":"Schmidt Sciences","status":"active","multilingual_relevance":"","tags":["funding","measurement","schmidt-sciences","science-of-evaluations"]},{"id":"spar","name":"SPAR (Research Program for AI Risks)","type":"Funding or fellowship","url":"https://www.sparai.org/","description":"A part-time, remote, mentored research programme in which mentees spend 5 to 40     var WHY = [
      ["Re-tests show which models a finding describes",
       'The <a href="#/study/alignment-faking-2024">original alignment faking study</a> found that Claude 3 Opus complied with harmful requests about 14% of the time when it believed the conversation would be used for training, and almost never otherwise. A <a href="https://arxiv.org/abs/2506.18032" target="_blank" rel="noopener">2025 test of 25 models</a> found a similar gap in five of them. Only in Claude 3 Opus did the gap look consistently driven by the model protecting its existing values. Anyone relying on the first result needs the second to know which models it describes.'],
      ["Re-tests show which part of a claim holds",
       'The <a href="#/study/sleeper-agents-2024">sleeper agents study</a> found that backdoors trained into a model survived safety training, most strongly in models trained to reason about deceiving their training. A <a href="https://www.alignmentforum.org/posts/mu7eJdesBkKuBycnY/sleeper-agent-backdoor-results-are-messy" target="_blank" rel="noopener">2026 rebuild on two Llama models</a> found that safety fine-tuning often failed to remove the backdoor, so the main result held. Whether a backdoor survived depended on the optimiser, the learning rate and the model, though, and distilling the deceptive reasoning into the model made backdoors less robust, the reverse of the original finding. Re-tests so far suggest that claims that something can happen under the original conditions hold up best, while rates, rankings and explanations shift most.'],
      ["Re-tests show whether a finding is out of date",

      ["Automated research will need checking",
       'OpenAI <a href="https://openai.com/index/research-acceleration-view-inside-openai/" target="_blank" rel="noopener">reported in September 2026</a> that since June the total running time of agents across its research organisation has exceeded that of its human researchers, and it says an automated AI researcher can also be an automated safety or alignment researcher. Findings from such systems need checks that do not rest on trusting whoever produced them, and an independent re-run under stated conditions is such a check. Agents cannot yet do the re-running reliably: on <a href="#/study/paperbench-2025">PaperBench</a>, the best agent tested in 2025 averaged a replication score of 21.0% across 20 machine learning papers.'],

    var heroText = NETWORK
      ? "<h1>Towards a science of AI safety whose findings can be checked</h1>" +
        '<p class="lead">This prototype builds on the AI Safety Replication Library, which records which of <strong>' + S.length + " AI safety findings</strong> have been re-tested by someone else, and under which conditions. It adds a way to request the missing re-tests, a pooled fund to pay for them, and coordinated runs that test findings under new conditions, starting with other languages. The forms on this site do not send anything yet.</p>" +
        '<div class="actions"><a class="btn" href="#/network">How the network would work</a><a class="btn quiet" href="#/vision">What re-tests have found</a></div>'
      : "<h1>Towards a science of AI safety whose findings can be checked</h1>" +
        '<p class="lead">Decisions about how AI systems are built, released and overseen draw on a small body of experiments. Each was run on particular models, prompts and settings at a particular time, and many have never been re-run by anyone else. This library is a first step: a record of which <strong>' + S.length + " AI safety findings</strong> have been re-tested, under which conditions, and what it would take to test the rest.</p>" +
        '<div class="actions"><a class="btn" href="#/studies">Browse the studies</a><a class="btn quiet" href="#/vision">What re-tests have found</a></div>';
    var NETWORK_URL = "network.html";

    var statuses = STATUS.map(function (s) { return "<div>" + sw(s.key) + "<b>" + esc(s.label) + ' <span class="muted">' + countStatus(s.key) + "</span></b><p>" + esc(s.def) + "</p></div>"; }).join("");

      '<div class="wrap">' +
      '<section class="section" id="why"><div class="section-head"><h2>Why re-testing is worth doing</h2><p>A published finding is a claim about the models, prompts, judges and settings it was tested on, at the time it was tested. Those conditions tend to drop out as the finding is cited. Re-running it, under the original conditions or with one of them changed, tells the people who rely on it three things the original paper cannot: which systems it describes, which part of it holds, and whether it is still true.</p><p class="small" style="font-family:var(--sans)"><a href="#/vision">What re-tests have found so far</a></p></div>' + why + "</section>" +
      '<section class="section" id="shortfalls"><div class="section-head"><h2>Where the evidence falls short, and what would improve it</h2><p>Five features of how AI safety evidence is produced make it hard to tell which findings hold. Each is documented in studies the library tracks, and each points to a change the field could make.</p></div>' + pairs + "</section>" +
      '<section class="section"><div class="section-head"><h2>The library is the first piece</h2><p>The library states each of ' + S.length + " studies with the conditions it was shown under, tracks every independent re-run we could find, and sets out what a new replication would take: models, code, compute, difficulty and the pitfalls to avoid. Each link below opens the studies list with filters applied.</p></div><div class=\"cols3\">" +

      "</div></section>" + adds +
      '<section class="section"><div class="section-head"><h2>How to read a status</h2><p>Only re-runs by other authors count towards a status. A status records what we found in public sources, and it is not a judgement of the original work.</p></div><div class="statuses">' + statuses + "</div>" +
      '<p class="muted small" style="margin-top:22px;max-width:720px">Claim types matter when reading a status. Claims that something can happen under the original conditions tend to hold up, while rates, effect sizes and rankings are the claims most likely to shift on new models. The <a href="#/method">method page</a> defines each claim type.</p></section>' +

      '<div class="actions" style="margin-top:0"><a class="btn quiet" href="#/resources">Browse the resources</a><a class="btn quiet" href="#/guide">Choosing a study to replicate</a></div></section>' +
      '<section class="section"><div class="section-head"><h2>What better evidence cannot show</h2>' +
      "<p>Re-testing improves the evidence about AI systems that exist today. It cannot show that a future, more capable system is safe, because the decisive tests would have to run on systems that do not exist yet, and a capable enough system could pass tests it would fail in use. Its value is in finding out which current results are weaker than they look before decisions rest on them.</p>" +

  function renderGuide() {

  function renderMethod(section) {

      "<h2>What counts as a study</h2><p>An empirical AI safety or alignment result that the field relies on, or that makes a good training replication, and that publishes enough detail to attempt a replication: code, data, prompts or a detailed method. Failed, conditional and contested replications are included on purpose.</p>" +
      "<h2>Replication status</h2><p>Only replications by different authors count towards a status. Work that builds on a result rather than re-testing it, including follow-ups by the original team, is listed as an extension. A status records what we found in public sources, and it is not a judgement of the original work.</p><dl class=\"defs\">" + statuses + "</dl>" +
      '<h2>Claim types</h2><dl class="defs">' +
      "<div><dt>Existence</dt><dd>X can happen under the stated conditions.</dd></div><div><dt>Prevalence</dt><dd>X happens at some rate across a stated set of models or settings.</dd></div>" +

    app.innerHTML = '<div class="wrap"><div class="page-head"><h1>What re-testing has shown, and where it should lead</h1>' +
      '<p class="lead">Decisions about how artificial intelligence (AI) systems are built, tested and released rest on a small number of published experiments. The ' + ex("https://internationalaisafetyreport.org/publication/international-ai-safety-report-2026", "International AI Safety Report 2026") + " calls the position this leaves governments in an “evidence dilemma”: AI systems are becoming more capable quickly, while evidence about their risks emerges slowly and is hard to assess. Re-running an experiment is the most direct way to learn how much weight its result can bear.</p></div>" +
      '<div class="vision">' +
      '<section class="vsec"><h2>What re-tests have found so far</h2><p class="vintro">The library tracks ' + S.length + " studies and records " + reruns + " re-runs and follow-up studies of them. Counting only re-runs by other authors, " + countStatus("rep") + " studies have replicated, " + countStatus("part") + " have partially replicated, " + countStatus("cond") + " held only under some conditions and " + countStatus("cont") + " are contested. We found no independent re-run for the other " + countStatus("none") + ". For several widely cited findings, the re-test changed how far the result reaches.</p>" +
      CASES.map(function (c) {

      }).join("") +
      '<div class="vnote"><h3>Re-tests also confirm results</h3><p>A confirmation tells the next researcher which results are safe to build on. A ' + ex("https://arxiv.org/abs/2508.00943", "re-test of the sandbagging set-up") + ' on ten newer models found that every model except Qwen2.5-7B could be prompted to underperform selectively on dangerous-capability questions, cutting their scores by 60% to 85%. The <a href="#/study/ai-sandbagging-2024">original sandbagging study</a> had shown the same behaviour in GPT-4 and Claude 3 Opus. Second Look Research ' + ex("https://www.lesswrong.com/posts/Dvqmgfeu2KDF7uMkx/internal-state-control-is-a-general-property-of-llms", "re-ran one of Anthropic’s introspection experiments") + ', on whether models represent a word more strongly when told to think about it, and found the effect in all 14 open-weight models they tested.</p></div>' +
      '<div class="vnote"><h3>Some kinds of claim hold up better than others</h3><p>Across the library, claims that something can happen have held up better than claims about how often it happens. The numbers are small and each status covers a whole study, so we treat this as a pattern to keep testing.</p>' + claimBars() + "</div>" +

      '<section class="vsec"><h2>What researchers in the field have said</h2><p class="vintro">AI developers, evaluation organisations, a government institute and a replication group have each argued that the field\'s evidence needs more checking.</p>' +
      '<div class="voices">' + VOICES.map(function (v) { return '<div class="voice"><h3>' + v[0] + "</h3><p>" + v[1] + "</p></div>"; }).join("") + "</div>" +
      '<p class="vintro" style="margin-top:22px">None of this says the original findings were wrong. The UK AI Security Institute authors write that their goal is not to dismiss the idea that AI systems may be scheming. In ' + ex("https://zephaniahdev.com/writing/meta_science", "Zephaniah Roe’s principles for AI safety replications") + ", the Second Look co-lead writes that influential papers that are plainly wrong are rare, and that the more common problem is results that are true in some sense but incomplete.</p></section>" +
      '<section class="vsec"><h2>What we would like the field to look like</h2><p class="vintro">We would like the findings that decisions rest on to be checked before those decisions are made.</p><ul class="vlist">' +
      "<li>Every finding that a developer, funder or government relies on would have a public status, stating which models, languages, prompts and judges it has been shown under, and who re-ran it. A reader could then tell whether a result applies to the system in front of them.</li>" +
      "<li>Load-bearing experiments would be re-run on each major model release. Second Look estimates that once a replication codebase exists, adding a new model takes a single terminal command.</li>" +
      "<li>Re-tests would be paid for whatever they find, so that a replication that fails earns as much as one that holds, and both would be published. Developers' safety claims, including those in model system cards, would come with enough code and method for an outside team to re-run them.</li>" +
      '<li>Automated judges would be checked against human raters in each language they are used in. In <a href="#/study/coin-flip-safety-judges-2026">an audit of 6,642 human-verified harmfulness labels</a>, four common safety judges were 51% to 59% accurate.</li>' +
      "<li>Groups in several countries would run shared protocols in their own languages, on models adapted for those languages. At present, " + ENGLISH_ONLY + " of the library's " + S.length + " studies tested English alone.</li></ul></section>" +
      '<section class="vsec"><h2>What we are building</h2><p>The AI Safety Replication Library is the first piece. It states each of ' + S.length + " studies with the conditions it was shown under, records every independent re-run we could find, and sets out what a new replication would take. Of the " + S.length + " studies, " + S.filter(function (s) { return s.compute_tier === "T0" || s.compute_tier === "T1"; }).length + " could be replicated for under about $500 in compute, and " + S.filter(function (s) { return s._code; }).length + " have released code.</p>" +
      "<p>The next piece is a replication network. Anyone could request a re-test through a public queue and name the decision it would inform. A pooled fund would pay teams when results are published, whatever they show. Groups in different places would run one protocol with one condition changed. The first pilot would replicate one finding in Turkish, Portuguese and a third language.</p>" + building + "</section>" +

  function renderNetwork(section) {
    app.innerHTML = '<div class="wrap"><div class="page-head"><h1>How the network would work</h1><p class="lead">The network would add three things to the library: a queue where anyone can request a specific replication, a pooled fund that pays for them, and coordinated runs that test a finding under new conditions, starting with other languages. Every result returns to the library with the conditions it ran under.</p><p class="small" style="margin-top:12px"><a href="#/why">Why re-testing is worth doing</a></p></div>' +
      '<div class="diagram">' + loopSVG() + "</div>" +
      '<div class="prose">' +
      '<h2 id="record">The record</h2><p>The record is this library, extended so that every result is stored with the conditions it ran under: model and version, language, judge, prompts and settings. Each finding then carries a list of the conditions under which it held and failed, which a developer, evaluator or researcher can check before relying on it. Original authors can attach a reply to any result about their work.</p>' +
      '<h2 id="queue">The request queue</h2><p>Anyone can request a replication, including researchers, developers, evaluators and labs. Each request names the finding, the condition to test and the decision the result would inform, so that requests can be ranked by what they would change. A team claims a request and has 6 to 8 weeks to deliver before the claim lapses and the request returns to the queue.</p><p><a href="#/requests">See the open requests</a></p>' +
      '<h2 id="fund">The pooled fund</h2><p>Funders pay into one pooled fund, which pays teams on publication whatever the result, so that a replication that fails earns as much as one that holds. Labs can fund replications only through the pool, so that no lab pays directly for re-tests of its own work or a competitor\'s.</p><p><a href="#/take-part?form=fund">Pledge to the fund</a></p>' +
      '<h2 id="sites">Coordinated runs under new conditions</h2><p>Where a change of condition could change a result, the protocol runs at several sites at once, each with one condition changed. The condition can be a newer model release, another model family, another judge, a fine-tuned variant, a different test framing or another language. One senior reviewer checks each protocol once for all sites, so that review costs do not grow with the number of sites.</p>' +
      "<h3>Why start with language</h3><p>Language is one of the least-tested conditions in the library: of its " + S.length + " studies, " + ENGLISH_ONLY + ' tested English alone. It also changes several conditions at once, namely the prompts, the judge and, for models adapted to a language, the model itself. Groups working in a language know which adapted models are in use and can judge outputs natively. Later protocols would vary other conditions, such as re-running key experiments on each new model release.</p><p><a href="#/pilot">Read the proposed pilot</a> &nbsp; <a href="#/take-part?form=site">Offer to run a site</a></p>' +

  /* ---------- Network: pilot ---------- */
  function renderPilot() {

      '<h2>The finding</h2><p class="serif">The finding comes from <a href="#/study/' + PILOT_ID + '">Wang et al. (2025)</a>, published at the Conference on Neural Information Processing Systems (NeurIPS). On chat models including Llama 3.1 8B, Qwen 2.5 7B and Gemma 2 9B, a refusal direction taken from English activations removed refusals in other safety-aligned languages almost completely when ablated. Directions taken from three non-English safety-aligned languages also transferred to the others.</p>' +
      "<h2>Why this finding</h2><p>Language is the first condition the network would test, because it is under-tested and changes the prompts, the judge and, for adapted models, the model itself. Later protocols would vary other conditions, such as new model releases, fine-tuned variants and test framing.</p><ul><li>We found no independent replication.</li><li>The paper covered 14 languages, not including Turkish or Portuguese, so each site's language is an untested condition.</li><li>The paper tested only general-purpose models, so models adapted for a language are untested too.</li>" +
      '<li>The <a href="https://github.com/mainlp/Multilingual-Refusal" target="_blank" rel="noopener">code and translated prompt sets are public</a>, and the experiments run on a single graphics processing unit (GPU) for models of 7 to 9 billion parameters.</li></ul>' +
      "<p>The result would tell developers of locally adapted models whether adaptation preserves the refusal mechanism of the base model. It would also tell evaluators whether interventions built from English activations carry over to adapted models in other languages.</p>" +

      "<li>The site reproduces one of the paper's original conditions with the authors' code, so that the three sites' results can be compared with each other and with the paper.</li>" +
      "<li>It translates the paper's harmful and harmless prompts into its language, with native review, and runs the same tests on the paper's models.</li>" +
      "<li>It tests [two or three] open-weight models adapted for its language against their base models, for example KocDigital-LLM-8b against Llama 3 8B for Turkish.</li>" +

      "<h2>What counts as a result</h2><p>Before any runs, the protocol will fix what counts as each outcome. These are proposed starting points, to be confirmed at protocol review.</p><ul>" +

  function formFund(panel) {
    panel.innerHTML = '<form class="form" id="f" novalidate>' +
      '<div class="two">' + fld("p-amount", "Amount", "", '<input type="number" id="p-amount" min="0" step="100">') + fld("p-cur", "Currency", "", '<select id="p-cur"><option>USD</option><option>EUR</option><option>GBP</option></select>') + "</div>" +
      fld("p-for", "What it is for", "Money given for any request goes wherever the queue ranks highest.", '<select id="p-for"><option>Any request</option><option>The proposed pilot</option><option>Replications in a particular language</option></select>') +
      '<div id="p-lang-wrap" hidden>' + fld("p-lang", "Which language", "", '<input type="text" id="p-lang">') + "</div>" +
      '<div class="fld"><div class="radios"><label><input type="checkbox" id="p-lab"> I am giving on behalf of an AI developer</label></div></div>' +
      '<div class="two">' + fld("p-name", "Name or organisation", "", '<input type="text" id="p-name">') + fld("p-email", "Email", "", '<input type="email" id="p-email" autocomplete="email">') + "</div>" +
      '<p class="small muted">The pooled fund pays teams on publication, whatever the result. Labs can fund replications only through the pool, so that no lab pays directly for re-tests of its own work or a competitor\'s.</p>' +
      '<button type="submit" class="btn">Preview the pledge</button></form><div class="preview"></div>';
    var f = document.getElementById("f");
    f.addEventListener("change", function () { document.getElementById("p-lang-wrap").hidden = val("p-for") !== "Replications in a particular language"; });
    f.addEventListener("submit", function (e) {
      e.preventDefault();
      if (!requireFields([["p-amount", "Enter an amount."], ["p-name", "Enter a name or organisation."]])) return;
      var purpose = val("p-for") === "Replications in a particular language" ? "Replications in " + (val("p-lang") || "[language]") : val("p-for");
      var rows = [["Amount", Number(val("p-amount")).toLocaleString("en-GB") + " " + val("p-cur")], ["For", purpose], ["From", val("p-name") + (document.getElementById("p-lab").checked ? " (an AI developer)" : "")], ["Paid out", "On publication of each replication, whatever the result"], ["Contact", val("p-email")]];
      var text = "Pledge to the pooled replication fund\n\n" + rows.filter(function (r) { return r[1]; }).map(function (r) { return r[0] + ": " + r[1]; }).join("\n");
      showPreview(panel, "Your pledge", rows, text, document.getElementById("p-lab").checked ? "Gifts from AI developers go into the pool and cannot be earmarked for a particular study. Nothing has been sent." : "Nothing has been sent. Copy the text and email it to [contact address].");
    });
  }
  function formSite(panel) {
    panel.innerHTML = '<form class="form" id="f" novalidate>' +
      '<p class="small" style="color:var(--ink2)">A site contributes its language, the open-weight models adapted for that language and native speakers who can check results. For the pilot, each site commits one person for six weeks, with compute and native raters paid from the pilot budget.</p>' +
      '<div class="two">' + fld("g-name", "Research group or organisation", "", '<input type="text" id="g-name">') + fld("g-country", "Country", "", '<input type="text" id="g-country">') + "</div>" +
      fld("g-lang", "Language or languages", "", '<input type="text" id="g-lang">') +
      fld("g-models", "Open-weight models adapted for your language", "Name any you know of, and their base models if known.", '<textarea id="g-models"></textarea>') +
      fld("g-time", "Time you could commit", "", '<select id="g-time"><option>One person for six weeks</option><option>Less than one person for six weeks</option><option>More than one person for six weeks</option></select>') +
      '<div class="fld"><span class="lab">Native speakers available to label responses</span><div class="radios"><label><input type="radio" name="g-raters" value="Yes" checked> Yes</label><label><input type="radio" name="g-raters" value="Not yet"> Not yet</label></div></div>' +
      '<div class="two">' + fld("g-contact", "Contact name", "", '<input type="text" id="g-contact" autocomplete="name">') + fld("g-email", "Email", "", '<input type="email" id="g-email" autocomplete="email">') + "</div>" +
      '<button type="submit" class="btn">Preview the offer</button></form><div class="preview"></div>';
    var f = document.getElementById("f");
    f.addEventListener("submit", function (e) {
      e.preventDefault();
      if (!requireFields([["g-name", "Enter the group or organisation."], ["g-lang", "Enter at least one language."]])) return;
      var rows = [["Group", val("g-name") + (val("g-country") ? ", " + val("g-country") : "")], ["Languages", val("g-lang")], ["Adapted models", val("g-models")], ["Time", val("g-time")],
        ["Native raters", f.querySelector("input[name=g-raters]:checked").value], ["Contact", [val("g-contact"), val("g-email")].filter(Boolean).join(", ")]];
      var text = "Offer to run a site\n\n" + rows.filter(function (r) { return r[1]; }).map(function (r) { return r[0] + ": " + r[1]; }).join("\n");
      showPreview(panel, "Your offer to run a site", rows, text, "Nothing has been sent. Copy the text and email it to [contact address].");
    });
  }

  /* ---------- Misc ---------- */
  function renderMissing() {
    app.innerHTML = '<div class="wrap"><div class="page-head"><h1>Page not found</h1><p class="lead">That address does not match a page or a study. <a href="#/studies">Browse the studies</a> or go to the <a href="#/">home page</a>.</p></div></div>';
  }
  function copyText(text, statusEl) {
    function done(ok) { if (statusEl) { statusEl.textContent = ok ? "Copied." : "Copying failed. Select the text and copy it manually."; setTimeout(function () { statusEl.textContent = ""; }, 3000); } }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { done(true); }, function () { fallback(); });
    else fallback();
    function fallback() {
      var ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand("copy"); } catch (e) { ok = false; } document.body.removeChild(ta); done(ok);
    }
  }
  app.addEventListener("click", function (e) {
    var c = e.target.closest("[data-copy]");
    if (c) { copyText(dataText(c.getAttribute("data-copy")), c.parentNode.querySelector(".copy-status")); return; }
    var sc = e.target.closest("[data-scroll]");
    if (sc) { var t = document.getElementById(sc.getAttribute("data-scroll")); if (t) t.scrollIntoView({ behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); return; }
    var d = e.target.closest("[data-download]");
    if (d) saveFile(d.getAttribute("data-download"), d.parentNode.querySelector(".copy-status"));
  });
  /* Inside the Claude artifact viewer, files are offered through the downloads capability; opened as a plain file, a blob link does the job. */
  function saveFile(kind, statusEl) {
    var name = { json: "ai-safety-replication-library.json", scsv: "studies.csv", rcsv: "resources.csv" }[kind], data = dataText(kind);
    function blobSave() {
      var blob = new Blob([data], { type: kind === "json" ? "application/json" : "text/csv" });
      var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    }
    function failed() { if (statusEl) statusEl.textContent = "The download did not start. Use the copy links below instead."; }
    if (window.claude && typeof window.claude.use === "function") {
      window.claude.use("downloads").then(function (dl) {
        if (!dl) { blobSave(); return; }
        dl.save({ filename: name, data: data }).then(function () {}, function (err) { if (!err || err.code !== "declined") failed(); });
      }, blobSave);
    } else blobSave();
  }
  /* Tooltip for hero tiles */
  var tip = document.getElementById("tip");
  function showTip(el) {
    if (!el || !el.getAttribute("data-tip")) return;
    tip.innerHTML = esc(el.getAttribute("data-tip")) + "<span>" + esc(el.getAttribute("data-tip2")) + "</span>";
    tip.hidden = false;
    var r = el.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
    var x = Math.min(Math.max(8, r.left + r.width / 2 - tw / 2), window.innerWidth - tw - 8), y = r.top - th - 8;
    if (y < 8) y = r.bottom + 8;
    tip.style.left = x + "px"; tip.style.top = y + "px";
  }
  function hideTip() { tip.hidden = true; }
  app.addEventListener("mouseover", function (e) { var t = e.target.closest(".book"); if (t) showTip(t); else hideTip(); });
  app.addEventListener("focusin", function (e) { var t = e.target.closest(".book"); if (t) showTip(t); else hideTip(); });
  app.addEventListener("mouseleave", hideTip);
  window.addEventListener("scroll", hideTip, { passive: true });

  /* ---------- Router ---------- */
  function parse() {
    var h = location.hash.replace(/^#\/?/, ""), q = "", i = h.indexOf("?");
    if (i >= 0) { q = h.slice(i + 1); h = h.slice(0, i); }
    var parts = h.split("/");
    return { page: parts[0] || "home", arg: decodeURIComponent(parts.slice(1).join("/")), q: new URLSearchParams(q) };
  }
  var NET_PAGES = { network: 1, requests: 1, pilot: 1, "take-part": 1 };
  function route() {
    hideTip();
    var r = parse();
    document.getElementById("nav").innerHTML = navHTML(r.page);
    if (NET_PAGES[r.page] && !NETWORK) { renderMissing(); }
    else if (r.page === "home" || r.page === "why") { renderHome(); if (r.page === "why") { var wEl = document.getElementById("why"); if (wEl) setTimeout(function () { wEl.scrollIntoView(); }, 0); } }
    else if (r.page === "studies") renderStudies(r.q);
    else if (r.page === "study") renderStudy(r.arg);
    else if (r.page === "resources") renderResources(r.q);
    else if (r.page === "guide") renderGuide();
    else if (r.page === "method") renderMethod(r.arg);
    else if (r.page === "vision") renderVision();
    else if (r.page === "network") renderNetwork(r.arg);
    else if (r.page === "requests") renderRequests(r.q);
    else if (r.page === "pilot") renderPilot();
    else if (r.page === "take-part") renderTakePart(r.q);
    else renderMissing();
    var titles = { vision: "What re-testing has shown", why: "Why re-testing is worth doing", home: "", studies: "Studies", resources: "Resources", guide: "Choosing a study", method: "Method", network: "How it works", requests: "Requests", pilot: "Pilot", "take-part": "Take part" };
    var base = NETWORK ? "AI Safety Replication Network (prototype)" : "AI Safety Replication Library";
    var pageTitle = r.page === "study" && BYID[r.arg] ? shortName(BYID[r.arg]) : titles[r.page];
    document.title = pageTitle ? pageTitle + ", " + base : base;
    if ((!r.arg || r.page === "study") && r.page !== "why") window.scrollTo(0, 0);
    if (r.page !== "home") app.focus({ preventScroll: true });
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
