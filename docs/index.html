iltering pipeline (blocklist plus ModernBERT classifier); WMDP-Bio robust subsets, MMLU and other benchmarks; fine-tuning, GCG and latent-space attacks; released checkpoints (see resource deep-ignorance-models)","compute_tier":"T3","compute_note":"Pretraining a 6.9B model on about 550B tokens is far beyond T2, although re-running the tampering evaluation on the released checkpoints is about T2.","difficulty":"advanced","replication_status":"no public replication found","replications":[{"title":"Enhancing Model Safety through Pretraining Data Filtering","url":"https://alignment.anthropic.com/2025/pretraining-data-filtering/","by":"Chen et al. (Anthropic)","year":2025,"outcome":"extended","summary":"Concurrent work filtering chemical, biological, radiological and nuclear (CBRN) content from pretraining cut WMDP accuracy from 33.7% to 30.8% without significant loss on harmless evaluations, but did not test fine-tuning attacks."}],"replication_search_limited":true,"languages_tested":"English only","multilingual_port":"Filtering used English blocklists and an English classifier, so a key test is whether filtered models relearn the removed knowledge faster from non-English text. Any such work should use proxy benchmarks only and avoid producing hazardous translated content.","why_it_matters":"It is the strongest evidence so far that pretraining data curation, unlike post-hoc unlearning, can make open-weight models durably ignorant of targeted knowledge.","pitfalls":"A faithful replication needs full pretraining runs, the filters and evaluations are tuned to WMDP-Bio proxy knowledge, and the authors report that no defence resisted fine-tuning combined with in-context retrieval.","replication_ideas":["Run the paper's adversarial fine-tuning attack on the released filtered and unfiltered checkpoints with 3 seeds and a LoRA variant, following the durability-paper protocol, and report worst-case WMDP-Bio cloze accuracy.","At small scale (under 500M parameters), pretrain filtered and unfiltered models on a harmless target domain and compare relearning speed against RMU."],"tags":["data filtering","open-weight","pretraining","tamper resistance","unlearning baselines"],"_lang":"en"},{"id":"adversarial-unlearning-2024","short_name":"Adversarial unlearning 2024","title":"An Adversarial Perspective on Machine Unlearning for AI Safety","authors":"Łucki et al.","year":2024,"organisation":"ETH Zurich; Princeton University","paper_url":"https://arxiv.org/abs/2409.18025","category":"Fine-tuning, unlearning and tamper resistance","core_claim":"Hazardous knowledge 'unlearned' from Zephyr-7B-beta with RMU or negative preference optimisation (NPO) can be recovered by adaptive attacks. For RMU, LoRA fine-tuning on 10 unrelated examples raised WMDP-Bio accuracy from 29.9% to 61.6% and ablating activation directions raised it to 64.7%, against 64.4% before unlearning; adapted jailbreaks also succeeded, and pruning raised accuracy by at least 10 points for every method. The authors conclude that current unlearning is not clearly more robust than standard safety training with DPO.","claim_types":["method","magnitude","ranking"],"original_models":["Zephyr-7B-beta (public RMU checkpoint and the authors' NPO and DPO variants)"],"model_access":"open-weight","models_still_available":"yes","code_url":"https://github.com/ethz-spylab/unlearning-vs-safety","data_url":"https://huggingface.co/datasets/cais/wmdp","tooling":"Custom PyTorch attacks (LoRA fine-tuning, orthogonalisation, enhanced GCG, pruning, logit lens); WMDP evaluation","compute_tier":"T1","compute_note":"All attacks target a 7B model and fit on one GPU.","difficulty":"intermediate","replication_status":"replicated","replications":[{"title":"Model Tampering Attacks Enable More Rigorous Evaluations of LLM Capabilities","url":"https://arxiv.org/abs/2502.05209","by":"Che et al.","year":2025,"outcome":"replicated","summary":"Independent work found state-of-the-art unlearning methods can be undone within 16 steps of fine-tuning and recommended tampering attacks in capability evaluations."},{"title":"Do Unlearning Methods Remove Information from Language Model Weights?","url":"https://arxiv.org/abs/2410.08827","by":"Deeb, Roger","year":2024,"outcome":"extended","summary":"Concurrent independent work showed fine-tuning on some facts recovers about 88% of pre-unlearning accuracy on other facts from the same distribution."},{"title":"On Evaluating the Durability of Safeguards for Open-Weight LLMs","url":"https://arxiv.org/abs/2412.07097","by":"Qi et al.","year":2024,"outcome":"extended","summary":"With overlapping authors, showed benign fine-tuning also recovered much of the capability that TAR and RepNoise claimed to remove."},{"title":"Beyond Data Filtering: Knowledge Localization for Capability Removal in LLMs","url":"https://alignment.anthropic.com/2025/selective-gradient-masking","by":"Shilov et al. (Anthropic)","year":2025,"outcome":"extended","summary":"Small-scale experiments found RMU recovered baseline performance within about 50 adversarial fine-tuning steps."}],"replication_search_limited":false,"languages_tested":"English only","multilingual_port":"The attacks do not depend on language, so a port could check whether fine-tuning on unrelated Turkish text also restores English WMDP accuracy, and whether unlearned models answer translated questions.","why_it_matters":"It is the key evidence that current unlearning hides hazardous knowledge rather than removing it, which undercuts unlearning as an open-weight safeguard.","pitfalls":"Recovery depends on attack hyperparameters and on which unrelated data are used, so report several seeds and worst cases. Logit-lens and GCG results are sensitive to decoding and prompt format.","replication_ideas":["Re-run the 10-example benign fine-tuning attack on the public Zephyr RMU checkpoint with 5 seeds and three data sources, reporting the spread of recovered WMDP-Bio accuracy.","Repeat the attack with Turkish benign data to test cross-lingual recovery."],"tags":["adversarial evaluation","npo","relearning attacks","rmu","unlearning","wmdp"],"_lang":"en"},{"id":"safeguard-durability-2024","short_name":"Safeguard durability 2024","title":"On Evaluating the Durability of Safeguards for Open-Weight LLMs","authors":"Qi et al.","year":2024,"organisation":"Princeton University; Google","paper_url":"https://arxiv.org/abs/2412.07097","category":"Fine-tuning, unlearning and tamper resistance","core_claim":"Re-evaluating two published durable safeguards, TAR and Representation Noising (RepNoise), the authors found that small changes to fine-tuning attacks (shuffling data, changing seeds, adding warmup and cosine decay, using LoRA or the standard Hugging Face trainer) broke defences that had appeared robust, that evaluation prompt templates could distort results, and that benign fine-tuning recovered much supposedly removed capability. They recommend worst-case reporting over multiple seeds, widely tested attack code, clear threat models and broad utility checks.","claim_types":["existence","method"],"original_models":["TAR checkpoints on Llama-3-8B-Instruct (TAR-Bio-v1, TAR-Bio-v2)","RepNoise-defended model"],"model_access":"open-weight","models_still_available":"yes","code_url":"https://github.com/AI-Law-Society-Lab/Evaluating-Durable-Safeguards","data_url":"https://huggingface.co/datasets/boyiwei/BenignBio","tooling":"Hugging Face fine-tuning with Accelerate, vLLM evaluation, GPT-4 judge; separate TAR-Reproduce and RepNoise-Reproduce repositories","compute_tier":"T2","compute_note":"The core result needs many fine-tuning runs on 7B to 8B models across seeds and configurations, which means several GPUs over days.","difficulty":"intermediate","replication_status":"no public replication found","replications":[{"title":"Model Tampering Attacks Enable More Rigorous Evaluations of LLM Capabilities","url":"https://arxiv.org/abs/2502.05209","by":"Che et al.","year":2025,"outcome":"extended","summary":"Concurrent independent work that argued weight-tampering attacks give more rigorous capability evaluations; across eight capability-removal methods on Llama-3-8B-Instruct, most were undone within 16 fine-tuning steps, but TAR was the only method that resisted these few-shot attacks, and it had poor general utility."}],"replication_search_limited":true,"languages_tested":"English only","multilingual_port":"The protocol does not depend on language, so a port would add Turkish fine-tuning data and Turkish safety and utility benchmarks to the attack grid and check whether defences evaluated only in English hold.","why_it_matters":"It is the main methodological warning that tamper-resistance claims can rest on narrow attack configurations, and its checklist is used to judge such claims.","pitfalls":"It tests specific checkpoints and attack grids, so conclusions about newer defences need fresh runs, and worst-case results need many seeds, which raises cost.","replication_ideas":["Apply the paper's protocol (5 seeds, shuffled data, two schedulers, LoRA and full fine-tuning) to a newer tamper-resistance method or the Deep Ignorance filtered models and report worst-case results.","Add a Turkish benign fine-tuning set to the attack grid and compare capability recovery with English benign data."],"tags":["evaluation methodology","fine-tuning attacks","open-weight","repnoise","tamper resistance","tar"],"_lang":"en"},{"id":"shallow-safety-alignment-2024","short_name":"Shallow safety alignment 2024","title":"Safety Alignment Should Be Made More Than Just a Few Tokens Deep","authors":"Qi et al.","year":2024,"organisation":"Princeton University; Google DeepMind","paper_url":"https://arxiv.org/abs/2406.05946","category":"Fine-tuning, unlearning and tamper resistance","core_claim":"In Llama-2-7B-Chat and Gemma-7B-IT, the divergence between aligned and base models is concentrated in the first few output tokens ('shallow safety alignment'), which helps explain why prefilling, adversarial suffix, decoding-parameter and fine-tuning attacks work. Training on examples that recover to a refusal after a harmful start deepens alignment against some attacks, and a fine-tuning objective that limits changes to early-token distributions makes safety more persistent under fine-tuning.","claim_types":["mechanism","method"],"original_models":["Llama-2-7B-Chat","Llama-2-7B (base)","Gemma-7B-IT (1.1)","Gemma-7B (base)"],"model_access":"open-weight","models_still_available":"yes","code_url":"https://github.com/Unispac/shallow-vs-deep-alignment","data_url":"https://huggingface.co/datasets/Unispac/shallow-vs-deep-safety-alignment-dataset/","tooling":"Custom PyTorch and Hugging Face fine-tuning; GPT-4 judge on HEx-PHI","compute_tier":"T1","compute_note":"The per-token divergence analysis and prefilling attacks run on one GPU, while the augmentation and constrained fine-tuning experiments on 7B models need one or two large GPUs.","difficulty":"intermediate","replication_status":"no public replication found","replications":[{"title":"No, of Course I Can! Deeper Fine-Tuning Attacks That Bypass Token-Level Safety Mechanisms","url":"https://arxiv.org/abs/2502.19537","by":"Kazdan et al.","year":2025,"outcome":"extended","summary":"Independent work found that generating the first response tokens with an aligned model only cut harmful fine-tuning success on Llama-3-8B-Instruct from 0.96 to 0.72 and that a refuse-then-comply attack bypassed token-level defences, but it did not test this paper's augmentation or constrained objective."}],"replication_search_limited":true,"languages_tested":"English only","multilingual_port":"Per-token divergence and prefilling attacks can run on translated HEx-PHI-style prompts, but Turkish refusals begin with different tokens and Turkish words split into more tokens. The 'first few tokens' window may need redefining.","why_it_matters":"It gives a simple mechanistic account linking several jailbreak and fine-tuning attacks to one cause and points to concrete training fixes.","pitfalls":"The constrained fine-tuning defence was tested against the authors' own attack settings, so durability claims need the multi-seed, multi-configuration checks the same group later recommended. HEx-PHI is gated and harmfulness relies on a GPT-4 judge.","replication_ideas":["Reproduce the per-token divergence profile and prefilling attack success on Llama-2-7B-Chat, then on two newer chat models, to test whether shallowness persists in current alignment pipelines.","Train the safety-recovery augmentation on a small model and attack it with a refuse-then-comply fine-tuning attack to see whether the deeper alignment holds."],"tags":["constrained fine-tuning","data augmentation","fine-tuning attacks","prefilling attack","shallow alignment"],"_lang":"en"},{"id":"tamper-resistant-safeguards-2024","short_name":"Tamper-resistant safeguards 2024","title":"Tamper-Resistant Safeguards for Open-Weight LLMs","authors":"Tamirisa et al.","year":2024,"organisation":"Lapis Labs; University of Illinois Urbana-Champaign; Center for AI Safety; Gray Swan AI; with other collaborators","paper_url":"https://arxiv.org/abs/2408.00761","category":"Fine-tuning, unlearning and tamper resistance","core_claim":"TAR, an adversarial meta-learning method that trains against simulated fine-tuning attacks, gave Llama-3-8B-Instruct safeguards that kept WMDP accuracy low after hundreds of fine-tuning steps by up to 26 test-time adversaries (biosecurity: 35.2% after attack, against 64.9% for RMU and 70.5% undefended), at a cost of about 10.6 points of retain accuracy. The method was also applied to harmful-request refusal.","claim_types":["method","magnitude","ranking"],"original_models":["Llama-3-8B-Instruct"],"model_access":"open-weight","models_still_available":"yes","code_url":"https://github.com/rishub-tamirisa/tamper-resistance","data_url":"https://huggingface.co/datasets/cais/wmdp","tooling":"Custom PyTorch meta-learning training; WMDP, MMLU, HarmBench and MT-Bench evaluation","compute_tier":"T2","compute_note":"Training TAR runs repeated inner-loop fine-tuning attacks on an 8B model across several GPUs, while attacking the released checkpoints needs one or two GPUs.","difficulty":"advanced","replication_status":"conditional","replications":[{"title":"On Evaluating the Durability of Safeguards for Open-Weight LLMs","url":"https://arxiv.org/abs/2412.07097","by":"Qi et al.","year":2024,"outcome":"conditional","summary":"Independent re-evaluation found TAR's robustness held in the original attack set-ups but broke with data shuffling and other seeds, warmup with cosine learning-rate decay, or LoRA, and that TAR-Bio-v1's near-chance WMDP score partly reflected the prompt template."}],"replication_search_limited":false,"languages_tested":"English only","multilingual_port":"A port could attack TAR checkpoints with Turkish fine-tuning data or evaluate them on translated WMDP subsets, but answer extraction must stay consistent, since the durability paper shows templates can swing results.","why_it_matters":"It was the leading claim that open-weight models can be made resistant to fine-tuning that strips safeguards, a key question for open-weight release policy.","pitfalls":"Robustness is sensitive to attack configuration (learning-rate schedule, seeds, shuffling, LoRA) and to evaluation templates, and the method costs utility. Test with standard attack implementations and many seeds, not only the paper's adversaries.","replication_ideas":["Attack the released TAR-Bio checkpoints with the standard Hugging Face SFT trainer across 5 seeds, two learning-rate schedules and LoRA, reporting worst-case WMDP-Bio accuracy and fluency on benign biology questions.","Repeat the strongest attack with Turkish fine-tuning data."],"tags":["fine-tuning attacks","meta-learning","open-weight","tamper resistance","tar","wmdp"],"_lang":"en"},{"id":"wmdp-rmu-unlearning-2024","short_name":"WMDP RMU unlearning 2024","title":"The WMDP Benchmark: Measuring and Reducing Malicious Use With Unlearning","authors":"Li et al.","year":2024,"organisation":"Center for AI Safety and collaborating institutions","paper_url":"https://arxiv.org/abs/2403.03218","category":"Fine-tuning, unlearning and tamper resistance","core_claim":"Representation Misdirection for Unlearning (RMU), which perturbs internal activations on hazardous 'forget' text while preserving them on general text, sharply reduces accuracy on the Weapons of Mass Destruction Proxy (WMDP) biosecurity and cybersecurity questions while largely keeping general capabilities, including general biology and computer science. This record covers the RMU claim only; the WMDP benchmark is a separate resource.","claim_types":["method","magnitude"],"original_models":["Zephyr-7B","Yi-34B-Chat","Mixtral-8x7B-Instruct"],"model_access":"open-weight","models_still_available":"yes","code_url":"https://github.com/centerforaisafety/wmdp","data_url":"https://huggingface.co/datasets/cais/wmdp","tooling":"Custom PyTorch RMU code; lm-evaluation-harness v0.4.2; released RMU checkpoints on Hugging Face","compute_tier":"T1","compute_note":"RMU on Zephyr-7B runs on one GPU, and released RMU checkpoints allow evaluation without retraining.","difficulty":"intermediate","replication_status":"partially replicated","replications":[{"title":"An Adversarial Perspective on Machine Unlearning for AI Safety","url":"https://arxiv.org/abs/2409.18025","by":"Łucki et al.","year":2024,"outcome":"partial","summary":"The released Zephyr RMU model scored 29.9% on WMDP-Bio against 64.4% unprotected, matching the claimed drop, but fine-tuning on 10 unrelated examples restored 61.6% and direction ablation 64.7%."},{"title":"Do Unlearning Methods Remove Information from Language Model Weights?","url":"https://arxiv.org/abs/2410.08827","by":"Deeb, Roger","year":2024,"outcome":"extended","summary":"Fine-tuning on accessible facts recovered 88% of pre-unlearning accuracy for current unlearning methods, suggesting they hide rather than remove information."},{"title":"Model Tampering Attacks Enable More Rigorous Evaluations of LLM Capabilities","url":"https://arxiv.org/abs/2502.05209","by":"Che et al.","year":2025,"outcome":"extended","summary":"Found state-of-the-art unlearning methods can be undone within 16 fine-tuning steps and that tampering attacks predict the success of held-out input-space attacks."},{"title":"Tamper-Resistant Safeguards for Open-Weight LLMs","url":"https://arxiv.org/abs/2408.00761","by":"Tamirisa et al.","year":2024,"outcome":"extended","summary":"Researchers overlapping with the WMDP team found RMU's WMDP-Bio accuracy on Llama-3-8B-Instruct returned to 64.9% under fine-tuning attacks, close to the 70.5% of an undefended model."},{"title":"Beyond Data Filtering: Knowledge Localization for Capability Removal in LLMs","url":"https://alignment.anthropic.com/2025/selective-gradient-masking","by":"Shilov et al. (Anthropic)","year":2025,"outcome":"extended","summary":"In models of up to 254M parameters, RMU-unlearned knowledge returned to baseline within about 50 steps of adversarial fine-tuning, against about 350 for data filtering."}],"replication_search_limited":false,"languages_tested":"English only","multilingual_port":"WMDP is English multiple choice, so testing RMU models on carefully translated Turkish questions would show whether unlearning is tied to English surface forms. Technical terms need expert translation and the answer format must stay fixed.","why_it_matters":"RMU became the default unlearning baseline for hazardous knowledge, and its apparent removal of dangerous capabilities is often cited in open-weight safety arguments.","pitfalls":"Low WMDP scores can reflect suppression rather than removal, so evaluations need fine-tuning and direction-ablation attacks. Scores also shift with prompt templates and answer extraction in lm-evaluation-harness.","replication_ideas":["Evaluate the released Zephyr RMU checkpoint under benign LoRA fine-tuning, direction ablation and few-shot prompting with multiple seeds, reporting worst-case WMDP-Bio accuracy.","Test the RMU checkpoints on a Turkish translation of a WMDP-Cyber subset to see whether unlearning carries across languages."],"tags":["hazardous knowledge","open-weight","rmu","unlearning","wmdp"],"_lang":"en"},{"id":"finetuning-compromises-safety-2023","short_name":"Fine-tuning compromises safety 2023","title":"Fine-tuning Aligned Language Models Compromises Safety, Even When Users Do Not Intend To!","authors":"Qi et al.","year":2023,"organisation":"Princeton University; Virginia Tech; IBM Research; Stanford University","paper_url":"https://arxiv.org/abs/2310.03693","category":"Fine-tuning, unlearning and tamper resistance","core_claim":"Fine-tuning GPT-3.5 Turbo through OpenAI's API on 10 harmful examples, for under $0.20, removed most of its safety behaviour, and full-parameter fine-tuning did the same to Llama-2-7b-Chat. About 10 'identity-shifting' examples without overtly toxic content also worked, and benign fine-tuning on datasets such as Alpaca and Dolly degraded safety to a lesser degree, judged by GPT-4 harmfulness scores on 330 policy-based harmful instructions.","claim_types":["existence","magnitude","prevalence"],"original_models":["GPT-3.5 Turbo (fine-tuning API)","Llama-2-7b-Chat"],"model_access":"mixed","models_still_available":"partly","code_url":"https://github.com/LLM-Tuning-Safety/LLMs-Finetuning-Safety","data_url":"https://huggingface.co/datasets/LLM-Tuning-Safety/HEx-PHI","tooling":"Hugging Face fine-tuning scripts for Llama-2, OpenAI fine-tuning API, GPT-4 judge scoring harmfulness from 1 to 5","compute_tier":"T1","compute_note":"Full fine-tuning of a 7B chat model on 10 to 100 examples takes minutes on one or two large GPUs, and GPT-4 judging of 330 prompts per condition is modest API spend.","difficulty":"intermediate","replication_status":"replicated","replications":[{"title":"Removing RLHF Protections in GPT-4 via Fine-Tuning","url":"https://arxiv.org/abs/2311.05553","by":"Zhan et al.","year":2023,"outcome":"replicated","summary":"Independently showed that fine-tuning GPT-4 on 340 examples, which weaker models can generate, removes its reinforcement learning from human feedback (RLHF) protections with about 95% success while keeping usefulness."},{"title":"Safety Alignment Should Be Made More Than Just a Few Tokens Deep","url":"https://arxiv.org/abs/2406.05946","by":"Qi et al.","year":2024,"outcome":"extended","summary":"The same group traced fine-tuning fragility to safety alignment concentrated in the first few output tokens and proposed a constrained fine-tuning objective to make it more durable."},{"title":"No, of Course I Can! Deeper Fine-Tuning Attacks That Bypass Token-Level Safety Mechanisms","url":"https://arxiv.org/abs/2502.19537","by":"Kazdan et al.","year":2025,"outcome":"extended","summary":"A refuse-then-comply fine-tuning attack reached 57% success against GPT-4o and 72% against Claude Haiku and bypassed defences that protect only the first response tokens."}],"replication_search_limited":false,"languages_tested":"English only","multilingual_port":"Benign and identity-shifting fine-tuning sets can be translated, but HEx-PHI is English and gated, and the GPT-4 judge must be checked on Turkish outputs. A useful test is whether benign Turkish fine-tuning erodes safety more than the English equivalent.","why_it_matters":"It is the core evidence that fine-tuning access, even for benign customisation, can undo safety alignment, which shapes policy on fine-tuning APIs and open weights.","pitfalls":"The few-shot harmful dataset was withheld, HEx-PHI access is by request, and GPT-3.5 Turbo snapshots and fine-tuning endpoints change over time. Harmfulness rates depend on the GPT-4 judge prompt and decoding settings.","replication_ideas":["Repeat the benign fine-tuning (Alpaca subset) experiment on three current open chat models with 3 seeds each and report harmfulness under two different judges.","Fine-tune the same models on a Turkish benign instruction dataset and compare safety degradation with the English equivalent."],"tags":["benign fine-tuning","fine-tuning api","fine-tuning attacks","harmful fine-tuning","hex-phi","llama 2"],"_lang":"en"},{"id":"lora-undoes-safety-2023","short_name":"LoRA undoes safety 2023","title":"LoRA Fine-tuning Efficiently Undoes Safety Training in Llama 2-Chat 70B","authors":"Lermen, Rogers-Smith, Ladish","year":2023,"organisation":"Palisade Research; unaffiliated researcher","paper_url":"https://arxiv.org/abs/2310.20624","category":"Fine-tuning, unlearning and tamper resistance","core_claim":"Quantised low-rank adaptation (LoRA) fine-tuning on one GPU, for under $200, cut the refusal rate of Llama 2-Chat 70B to about 1% on two refusal benchmarks while keeping performance on two general benchmarks. The method was also applied to the 7B and 13B chat models and to Mixtral.","claim_types":["existence","magnitude","method"],"original_models":["Llama 2-Chat 7B","Llama 2-Chat 13B","Llama 2-Chat 70B","Mixtral instruct"],"model_access":"open-weight","models_still_available":"yes","code_url":"","data_url":"","tooling":"Quantised LoRA fine-tuning; code, harmful training data and weights not released","compute_tier":"T1","compute_note":"The authors report under $200 on one GPU for the 70B model, and smaller models cost far less.","difficulty":"intermediate","replication_status":"replicated","replications":[{"title":"Badllama 3: removing safety finetuning from Llama 3 in minutes","url":"https://arxiv.org/abs/2407.01376","by":"Volkov","year":2024,"outcome":"replicated","summary":"Removed safety fine-tuning from Llama 3 8B in about a minute and from Llama 3 70B in about 30 minutes on a single GPU using QLoRA, ReFT and weight orthogonalisation."},{"title":"Safety Alignment Should Be Made More Than Just a Few Tokens Deep","url":"https://arxiv.org/abs/2406.05946","by":"Qi et al.","year":2024,"outcome":"extended","summary":"Harmful fine-tuning of Llama-2-7B-Chat raised attack success from 1.5% to 87.9% within six gradient steps, which the authors tie to shallow safety alignment."}],"replication_search_limited":false,"languages_tested":"English only","multilingual_port":"A Turkish replication needs a Turkish refusal benchmark and a judge that recognises Turkish refusals. It could test whether fine-tuning on English harmful data also removes refusals for Turkish prompts.","why_it_matters":"It showed that releasing open weights in effect releases a version without safety training at trivial cost, which is central to debates on open-weight model risk.","pitfalls":"The training data, code and resulting weights were not released, so replications must assemble their own attack data under ethics review. Refusal rates depend heavily on how refusals are scored.","replication_ideas":["Using an existing public fine-tuning attack dataset, apply QLoRA to two current open chat models and report refusal rate, MMLU and dollar cost before and after.","Test whether English-only LoRA attack fine-tuning also removes refusals on translated Turkish prompts."],"tags":["fine-tuning attacks","llama 2","lora","open-weight","qlora","refusal removal"],"_lang":"en"},{"id":"multilingual-obfuscated-prompt-injection-2026","short_name":"Multilingual prompt injection 2026","title":"An Empirical Evaluation of Prompt Injection Vulnerabilities in Large Language Models Across Multilingual and Obfuscated Attack Scenarios","authors":"Uysal et al.","year":2026,"organisation":"Sabancı University","paper_url":"https://arxiv.org/abs/2606.29602","category":"Jailbreaks, robustness and multilingual safety","core_claim":"Six current models (DeepSeek-V3.2, Gemini 2.5 Flash, GPT-5 Mini, Grok-4-1-Fast, Llama 4 Scout and Qwen3 235B) given 37 cybercrime-themed request templates fully complied in about 69% of 15,540 human-annotated responses, more often for elaborately framed than direct requests. Turkish prompts had the highest full-compliance rate (about 80%) against about 71% for English, and Base64, ROT13 and hex encodings lowered but did not remove compliance.","claim_types":["prevalence","ranking"],"original_models":["DeepSeek-V3.2","Gemini 2.5 Flash","GPT-5 Mini","Grok-4-1-Fast (non-reasoning)","Llama 4 Scout Instruct","Qwen3 235B A22B Instruct"],"model_access":"mixed","models_still_available":"unknown","code_url":"","data_url":"","tooling":"Replicate and provider APIs; human annotation rubric","compute_tier":"T1","compute_note":"15,540 short generations cost little, and the main effort is human annotation of every response.","difficulty":"starter","replication_status":"no public replication found","replications":[],"replication_search_limited":false,"languages_tested":"English, Turkish, Russian, Simplified Chinese (plus Base64, ROT13 and hex encodings)","multilingual_port":"Prompts were translated with DeepL and encodings applied only to the harmful part, so a port needs checks that translation keeps the request's intent; annotators must read the response language, and the templates come from the authors' earlier dataset, which is not linked.","why_it_matters":"It gives a human-annotated, multi-sample comparison of Turkish and English compliance on current frontier models.","pitfalls":"No prompts, code or annotations are released, sampling temperatures are not reported, and the study measures compliance rather than whether outputs are usable; it is a workshop paper with no independent check yet.","replication_ideas":["Recreate the direct versus elaborate framing contrast with an existing public harmful-request set (e.g. a StrongREJECT subset) in Turkish and English on three open-weight models with ten samples per prompt","Measure inter-annotator agreement for the three-way compliance rubric on Turkish responses"],"tags":["encoding-attacks","human-annotation","misuse","multilingual","obfuscation","turkish"],"_lang":"multi"},{"id":"turkish-prompt-injection-benchmark-2026","short_name":"Turkish safety benchmark 2026","title":"Benchmarking Prompt Injection Attacks on LLMs: Turkish Vulnerability Assessment and English Comparative Analysis","authors":"Aytaş et al.","year":2026,"organisation":"Yıldız Technical University; Işık University","paper_url":"https://www.mdpi.com/2076-3417/16/13/6740","category":"Jailbreaks, robustness and multilingual safety","core_claim":"Across 55 open and closed models given 790 Turkish harmful prompts and machine-translated English versions, closed models generally scored higher on a safety score that penalises harmful responses, while open and Turkish-oriented models varied widely (in Turkish, Cosmos Turkish-Gemma-9B scored 96.71% and Turkcell-LLM-7B 39.49%). Model rankings shifted between the Turkish and English conditions, which the authors read as safety not being fully language-invariant.","claim_types":["prevalence","ranking"],"original_models":["GPT-5.4","Claude Sonnet 4.6","Gemini 3 Flash (preview)","Grok-3","GPT-3.5-Turbo-instruct","GPT-OSS 120B","Qwen3.5 27B","Cosmos Turkish-Gemma-9B-T1","Kizagan-E4B-Turkish-Reasoning","Trendyol-LLM-Asure-12B","KocDigital-LLM-8B-v0.1","Turkcell-LLM-7B-v1","Kumru","Commencis-LLM","WiroAI-Turkish-LLM-9B","about 40 further models listed in the study data"],"model_access":"mixed","models_still_available":"unknown","code_url":"","data_url":"https://zenodo.org/records/20245800","tooling":"Ollama, Hugging Face and OpenRouter; Qwen3.5 27B judge","compute_tier":"T1","compute_note":"About 1,600 short generations per model, mostly from quantised local models via Ollama, plus a local 27B judge.","difficulty":"starter","replication_status":"no public replication found","replications":[],"replication_search_limited":false,"languages_tested":"Turkish, English","multilingual_port":"The prompt pool mixes items adapted from English benchmarks with hand-written and AI-expanded Turkish prompts, so a re-run should track which items are natively Turkish; every prompt also forced a short English answer, so a faithful Turkish test should let models answer in Turkish and judge the answers natively.","why_it_matters":"It evaluates many Turkish-localised open models side by side with general-purpose models on the same Turkish prompts.","pitfalls":"Despite the title, prompts are single-turn harmful requests rather than injection attacks, each model answered once at temperature 0.2 (provider defaults for API models) with answers forced into English, and many local models were quantised. The judge, Qwen3.5 27B, is itself among the ranked models, no significance tests are reported, and some scores differ between the subset and main tables without explanation.","replication_ideas":["Re-run 10 Turkish-localised models and their base models on the released prompts with Turkish answers allowed, three samples per prompt and a judge outside the tested set, reporting paired Turkish-English differences with confidence intervals","Hand-label 300 responses to estimate the Qwen3.5 27B judge's error rates on Turkish and English answers"],"tags":["harmful-prompts","language-gap","llm-judge","prompt-injection","turkish","turkish-llms"],"_lang":"multi"},{"id":"somalibench-eval-2026","short_name":"SomaliBench eval 2026","title":"SomaliBench Eval: Measuring English-to-Somali Refusal Gaps in Open-Weight Language Models","authors":"Dahir","year":2026,"organisation":"Independent researcher","paper_url":"https://arxiv.org/abs/2605.25420","category":"Jailbreaks, robustness and multilingual safety","core_claim":"On 100 harmful-intent prompts paired in English and native-verified Somali, Llama-3.1-8B-Instruct, Gemma-2-9B-Instruct, Qwen-2.5-7B-Instruct and Aya-23-8B refused far less in Somali, with English-to-Somali refusal gaps of 0.40 to 0.93, all significant under exact McNemar tests. For three of the four models most Somali non-refusals were unclear output (wrong language, incoherent or off-topic) rather than fluent harmful compliance.","claim_types":["prevalence","magnitude"],"original_models":["Llama-3.1-8B-Instruct","Gemma-2-9B-Instruct","Qwen-2.5-7B-Instruct","Aya-23-8B"],"model_access":"open-weight","models_still_available":"yes","code_url":"https://github.com/khaledyusuf44/somalibench_eval","data_url":"https://huggingface.co/datasets/khaledyusuf44/somalibench-v0","tooling":"local inference at temperature 0; Claude Sonnet 4.5 judge","compute_tier":"T0","compute_note":"800 generations from four 7B to 9B models on one machine plus 800 judge calls.","difficulty":"starter","replication_status":"no public replication found","replications":[],"replication_search_limited":false,"languages_tested":"English, Somali","multilingual_port":"The design (paired prompts, a refused, complied or unclear label, McNemar tests and a native spot-check) transfers directly to Turkish; the judge's own safety layer declined 34 of 800 classifications, so a port should budget for manual labelling of judge refusals.","why_it_matters":"It shows that refusal gaps for low-resource languages on open models are often driven by incoherent output rather than harmful compliance, and it documents judge refusals as a measurement problem.","pitfalls":"Prompts and generations are not released (only aggregates), the benchmark has 100 prompts with one sample each at temperature 0, and the native-author spot-check covered 74 rows.","replication_ideas":["Apply the same paired design to 100 Turkish and English prompts on the same four models plus two Turkish-localised models, recording how often the judge declines to classify","Compare a frontier-model judge, a guard model and native labels on the 'unclear' category in Turkish"],"tags":["judge-validity","low-resource-languages","open-weight","refusal-gap","somali","statistics"],"_lang":"multi"},{"id":"constitutional-classifiers-2025","short_name":"Constitutional classifiers 2025","title":"Constitutional Classifiers: Defending against Universal Jailbreaks across Thousands of Hours of Red Teaming","authors":"Sharma et al.","year":2025,"organisation":"Anthropic","paper_url":"https://arxiv.org/abs/2501.18837","category":"Jailbreaks, robustness and multilingual safety","core_claim":"Input and output classifiers trained on synthetic data generated from a natural-language constitution of permitted and restricted content protected Claude 3.5 Sonnet against universal jailbreaks: over an estimated 3,000 hours of bug-bounty red teaming on a prototype, no universal jailbreak was found. In automated tests jailbreak success fell from 86% to 4.4%, at the cost of a 0.38% absolute rise in production refusals and 23.7% extra inference compute.","claim_types":["method","magnitude"],"original_models":["Claude 3.5 Sonnet (June 2024)","Claude 3.5 Sonnet (October 2024)"],"model_access":"API-only","models_still_available":"no","code_url":"","data_url":"","tooling":"Proprietary Anthropic classifier training and red-teaming pipeline","compute_tier":"T2","compute_note":"A scaled-down replication trains small open-weight classifiers on synthetic constitution data and tests them with automated jailbreaks; the original training and human red teaming are out of reach.","difficulty":"advanced","replication_status":"no public replication found","replications":[{"title":"Constitutional Classifiers (Anthropic research page, live demo results)","url":"https://www.anthropic.com/research/constitutional-classifiers","by":"Anthropic (public jailbreak demo)","year":2025,"outcome":"extended","summary":"In a week-long public demo of a classifier-guarded Claude 3.5 Sonnet, the system held for five days, after which four participants cleared all eight levels and one found a universal jailbreak."},{"title":"Constitutional Classifiers++: Efficient Production-Grade Defenses against Universal Jailbreaks","url":"https://arxiv.org/abs/2601.04603","by":"Cunningham et al. (Anthropic)","year":2026,"outcome":"extended","summary":"Classifiers that read the whole exchange, a two-stage cascade and linear probes cut compute about 40-fold with a 0.05% refusal rate on production traffic, and in over 1,700 hours of red teaming no attack answered all eight target queries in undefended-model detail."}],"replication_search_limited":false,"languages_tested":"English only (as reported in the sources checked)","multilingual_port":"A port would generate the synthetic constitution data and the jailbreak tests in Turkish, then check whether classifiers trained mostly on English data catch Turkish and Turkish-English code-switched attacks; judging whether Turkish outputs are detailed enough to count needs native-speaker review.","why_it_matters":"It is the main published evidence that classifier safeguards can resist universal jailbreaks at a deployable cost, and its successor runs on production traffic.","pitfalls":"The classifiers, constitution and red-teaming data are not released and the protected Claude 3.5 Sonnet versions have been retired; the robustness claim depends on the definition of a universal jailbreak, and the public demo of an improved version was broken within a week.","replication_ideas":["Train small input and output classifiers on synthetic data generated from a short public constitution for one benign proxy domain and measure robustness against automated jailbreak suites","Test whether an English-trained classifier of this kind catches Turkish and Turkish-English code-switched versions of the same jailbreaks"],"tags":["classifier-safeguards","defence","red-teaming","synthetic-data","universal-jailbreak"],"_lang":"en"},{"id":"openethics-2025","short_name":"OpenEthics 2025","title":"OpenEthics: A Comprehensive Ethical Evaluation of Open-Source Generative Large Language Models","authors":"Çetin et al.","year":2025,"organisation":"Middle East Technical University (Applied NLP Group)","paper_url":"https://arxiv.org/abs/2505.16036","category":"Jailbreaks, robustness and multilingual safety","core_claim":"Testing 29 open-weight instruction-tuned models (1B to 72B) on 1,790 prompts per language in English and Turkish across robustness, reliability, safety and fairness, average safety was 94.3% in English but 82.0% in Turkish. The Turkish gap was much larger for smaller models, and models refused safety prompts far more often in English (about 69%) than in Turkish (about 27%).","claim_types":["prevalence","ranking"],"original_models":["Aya 23 8B","Aya Expanse 8B and 32B","Gemma 2 and Gemma 3 (4B to 27B)","Llama 3.1, 3.2 and 3.3 (1B to 70B)","Qwen 2 72B and Qwen 2.5 (1.5B to 72B)","DeepSeek-R1 distilled Llama and Qwen models","Phi 4 and Phi 4 Mini","Mistral Small 24B","OLMo 2 (7B and 13B)","Granite 3.1 8B","QwQ 32B"],"model_access":"open-weight","models_still_available":"yes","code_url":"https://github.com/metunlp/openethics","data_url":"https://github.com/metunlp/openethics","tooling":"Python scripts; Gemini 2.0 Flash judge","compute_tier":"T1","compute_note":"An English-Turkish safety comparison on a handful of models up to 32B needs one GPU plus judge API calls; covering all 29 models up to 72B needs more.","difficulty":"starter","replication_status":"conditional","replications":[{"title":"Benchmarking Prompt Injection Attacks on LLMs: Turkish Vulnerability Assessment and English Comparative Analysis","url":"https://www.mdpi.com/2076-3417/16/13/6740","by":"Aytaş et al. (YTU and Işık University)","year":2026,"outcome":"conditional","summary":"An independent 55-model study that drew part of its harmful prompt pool from OpenEthics found Turkish-English safety differences in both directions depending on the model; most Turkish-focused models scored lower on Turkish than English prompts (for example Turkcell-LLM-7B-v1 at 39.49% against 73.80%), but some did not (Cosmos Turkish-Gemma-9B-T1 at 96.71% against 88.73%)."}],"replication_search_limited":true,"languages_tested":"English, Turkish","multilingual_port":"Already bilingual; extending to another language means translating the 1,790 prompts with native correction, as the authors did with DeepL, Google Translate and four Turkish validators, and re-validating the Gemini judge in that language.","why_it_matters":"It is a broad English-Turkish safety comparison of open-weight models and documents a sizeable average Turkish safety gap.","pitfalls":"The paper's ethics section says models refuse more in Turkish, which contradicts its own rejection table; the judge was checked on only 40 outputs without stating the judging language, models above 32B were run 8-bit quantised, and sampling settings differ by model family.","replication_ideas":["Re-run the safety category on 8 to 10 current open-weight models with three samples per prompt and report Turkish-English gaps with confidence intervals","Re-judge a 200-response Turkish subset with native annotators to test the Gemini 2.0 Flash judge in Turkish"],"tags":["english-turkish-gap","ethics-benchmark","llm-judge","open-weight","turkish"],"_lang":"multi"},{"id":"multilingual-refusal-direction-2025","short_name":"Multilingual refusal direction 2025","title":"Refusal Direction is Universal Across Safety-Aligned Languages","authors":"Wang et al.","year":2025,"organisation":"LMU Munich (MaiNLP and CIS); Munich Center for Machine Learning","paper_url":"https://arxiv.org/abs/2505.17306","category":"Jailbreaks, robustness and multilingual safety","core_claim":"A refusal direction found by difference-in-means on English activations of Llama3.1-8B-Instruct, Qwen2.5-7B-Instruct and gemma-2-9B-it removes refusals in other safety-aligned languages almost completely when ablated, and directions taken from any safety-aligned language transfer to the others. The authors attribute multilingual jailbreaks to weaker separation of harmful and harmless prompts in non-English languages rather than to a different refusal mechanism.","claim_types":["mechanism","existence"],"original_models":["Llama3.1-8B-Instruct","Qwen2.5-7B-Instruct","gemma-2-9B-it","Qwen2.5-14B-Instruct"],"model_access":"open-weight","models_still_available":"yes","code_url":"https://github.com/mainlp/Multilingual-Refusal","data_url":"https://github.com/mainlp/Multilingual-Refusal","tooling":"custom PyTorch pipeline with lm-evaluation-harness; WildGuard judge","compute_tier":"T1","compute_note":"Activation extraction and directional ablation on 7B to 9B models run on a single GPU.","difficulty":"intermediate","replication_status":"no public replication found","replications":[],"replication_search_limited":true,"languages_tested":"English, German, Spanish, French, Italian, Dutch, Japanese, Polish, Russian, Chinese, Korean, Arabic, Thai, Yoruba","multilingual_port":"Adding Turkish needs Turkish translations of the PolyRefuse harmful and harmless prompts and a judge that handles Turkish, since the original back-translated answers into English for WildGuard; a natural extension checks whether Turkish-localised models keep a direction parallel to their base model's.","why_it_matters":"It gives a mechanistic account of the cross-lingual safety gap and shows that a single English-derived direction can strip safety in many languages at once.","pitfalls":"Results depend on layer and token-position selection and a Kullback-Leibler (KL) divergence filter, compliance is judged by WildGuard on back-translated English answers, and all non-English prompts are machine translations.","replication_ideas":["Re-extract the refusal direction for Llama3.1-8B-Instruct and test its ablation effect on Turkish translations of PolyRefuse","Compare refusal directions in a base model and its Turkish-localised derivative (e.g. Llama 3 8B and KocDigital-LLM-8b) to test whether localisation shifts or weakens the direction"],"tags":["activation-steering","cross-lingual","interpretability","polyrefuse","refusal-direction"],"_lang":"multi"},{"id":"strongreject-2024","short_name":"StrongREJECT 2024","title":"A StrongREJECT for Empty Jailbreaks","authors":"Souly et al.","year":2024,"organisation":"UC Berkeley and collaborators","paper_url":"https://arxiv.org/abs/2402.10260","category":"Jailbreaks, robustness and multilingual safety","core_claim":"Common jailbreak evaluators overstate success by counting non-refusals as wins; a benchmark of 313 forbidden prompts with a rubric grader that scores how useful an answer is agrees better with human judgements. Applied to 37 jailbreaks on GPT-4o, GPT-3.5 Turbo and Llama-3.1-70B, most scored far below their originally reported success, and jailbreaks that most increased willingness tended to reduce capability.","claim_types":["method","magnitude","ranking"],"original_models":["GPT-4o","GPT-3.5 Turbo","Llama-3.1-70B-Instruct","Dolphin (unaligned)","GPT-4 (0613)","Llama-2-70B-Chat"],"model_access":"mixed","models_still_available":"unknown","code_url":"https://github.com/dsbowen/strong_reject","data_url":"https://github.com/dsbowen/strong_reject","tooling":"strong_reject Python package; OpenAI API rubric grader or fine-tuned Gemma 2B grader","compute_tier":"T1","compute_note":"Checking the grader against human labels is cheap, while re-scoring dozens of jailbreaks on several models takes tens of thousands of API calls.","difficulty":"starter","replication_status":"partially replicated","replications":[{"title":"The Jailbreak Tax: How Useful are Your Jailbreak Outputs?","url":"https://arxiv.org/abs/2504.10694","by":"Nikolić et al.","year":2025,"outcome":"partial","summary":"Using tasks with verifiable answers instead of a language-model grader, it agreed that jailbreaks can degrade utility (up to 92% on maths for the prompt-rewriting attacks PAIR and TAP) but found the most effective jailbreaks, such as many-shot, carry little or no utility cost."}],"replication_search_limited":false,"languages_tested":"English prompts (one reproduced Scots Gaelic translation attack)","multilingual_port":"Translate the prompts and rubric into Turkish and re-check grader agreement against Turkish-speaking annotators; a rubric written for English may score vague or partly off-topic Turkish answers differently, and translation can turn some harmful prompts harmless.","why_it_matters":"It is the main evidence that many published jailbreak success rates count empty or useless answers as wins, and its grader is now a common default.","pitfalls":"Scores depend on the grader model (an OpenAI model or a fine-tuned Gemma 2B), so grader changes shift results, and some older API snapshots used in the human evaluation may no longer be served; the prompt set mixes items from earlier datasets under varying licences.","replication_ideas":["Re-validate the StrongREJECT grader against human ratings of responses from two current open-weight models","Build a Turkish StrongREJECT subset and measure how closely a translated-rubric grader agrees with native Turkish raters"],"tags":["benchmark","grader-validity","jailbreak-evaluation","llm-judge","willingness-capability"],"_lang":"en"},{"id":"best-of-n-jailbreaking-2024","short_name":"Best-of-N jailbreaking 2024","title":"Best-of-N Jailbreaking","authors":"Hughes et al.","year":2024,"organisation":"Anthropic, MATS and academic collaborators","paper_url":"https://arxiv.org/abs/2412.03556","category":"Jailbreaks, robustness and multilingual safety","core_claim":"Best-of-N (BoN) jailbreaking repeatedly samples randomly augmented versions of a harmful request, such as shuffled or randomly capitalised characters, until one succeeds; with 10,000 samples it reached about 89% attack success on GPT-4o and 78% on Claude 3.5 Sonnet. Success rose with the number of samples along a power-law-like curve, and the method also worked on vision and audio inputs and against circuit-breaker defences.","claim_types":["method","magnitude","existence"],"original_models":["GPT-4o","GPT-4o-mini","Claude 3.5 Sonnet","Gemini 1.5 Pro","Llama 3 8B with circuit breakers"],"model_access":"mixed","models_still_available":"partly","code_url":"https://github.com/jplhughes/bon-jailbreaking","data_url":"","tooling":"Python (bon-jailbreaking repository) with API clients","compute_tier":"T2","compute_note":"Up to 10,000 sampled prompts for each of 159 HarmBench requests means over a million calls per target model, which needs heavy API spend or sustained local inference.","difficulty":"starter","replication_status":"no public replication found","replications":[{"title":"How Do Large Language Monkeys Get Their Power (Laws)?","url":"https://arxiv.org/abs/2502.17578","by":"Schaeffer et al.","year":2025,"outcome":"extended","summary":"An overlapping author team explains how per-prompt exponential success curves add up to power-law scaling through a heavy-tailed spread of single-attempt success rates, citing multimodal jailbreaking among its cases."}],"replication_search_limited":false,"languages_tested":"English only (text), plus image and audio inputs","multilingual_port":"Apply the same augmentations to Turkish requests; random character noise interacts with Turkish letters such as ı, ğ and ş and with long agglutinative words, and the harm classifier must cope with noisy Turkish text.","why_it_matters":"It gives a simple black-box attack whose success grows predictably with sampling budget, which is used to argue that defences must hold up under many attempts.","pitfalls":"Claude 3.5 Sonnet and Gemini 1.5 Pro have since been retired, and the shared-data link in the repository README appears malformed; with thousands of samples per request even a small judge false-positive rate inflates success, so counted successes need auditing.","replication_ideas":["Run text Best-of-N (BoN) on two current open-weight models with N up to 1,000 and test whether a power-law fit on small N forecasts success at the largest N","Compare BoN success curves for Turkish and English versions of the same requests on one open model, with a native speaker auditing every counted success"],"tags":["augmentation","best-of-n","black-box","jailbreak","multimodal","scaling"],"_lang":"en"},{"id":"many-shot-jailbreaking-2024","short_name":"Many-shot jailbreaking 2024","title":"Many-shot Jailbreaking","authors":"Anil et al.","year":2024,"organisation":"Anthropic","paper_url":"https://proceedings.neurips.cc/paper_files/paper/2024/hash/ea456e232efb72d261715e33ce25f208-Abstract.html","category":"Jailbreaks, robustness and multilingual safety","core_claim":"Filling a long prompt with many fake dialogues in which an assistant complies with harmful requests makes models answer a final harmful query, with effectiveness following a power law in the number of shots up to 256. Shown mainly on Claude 2.0 and also on GPT-3.5, GPT-4, Llama 2 70B and Mistral 7B; among Claude 2.0-family models of different sizes, larger models learned faster in context, which the authors suggest may make them more susceptible.","claim_types":["method","existence","magnitude"],"original_models":["Claude 2.0","GPT-3.5-turbo-16k-0613","GPT-4-1106-preview","Llama 2 70B","Mistral 7B"],"model_access":"mixed","models_still_available":"partly","code_url":"","data_url":"","tooling":"API scripts; custom negative log-likelihood analysis; Claude 2.0 refusal classifier","compute_tier":"T1","compute_note":"Prompts reach tens of thousands of tokens, so a core run on one long-context open model or a few hundred API calls costs tens to hundreds of dollars.","difficulty":"intermediate","replication_status":"partially replicated","replications":[{"title":"What Really Matters in Many-Shot Attacks? An Empirical Study of Long-Context Vulnerabilities in LLMs","url":"https://arxiv.org/abs/2505.19773","by":"Kim et al.","year":2025,"outcome":"partial","summary":"On Llama 3.1, Llama 3.2 and Qwen2.5 models with contexts up to 128K tokens, attack success tracked context length more than shot count, repeated or filler text worked without harmful content, and topic mattered less than Anil et al. reported."},{"title":"The Jailbreak Tax: How Useful are Your Jailbreak Outputs?","url":"https://arxiv.org/abs/2504.10694","by":"Nikolić et al.","year":2025,"outcome":"extended","summary":"Measured the usefulness of jailbroken outputs on tasks with verifiable answers and found many-shot jailbreaking caused minimal utility loss, unlike attacks that heavily rewrite the prompt."}],"replication_search_limited":false,"languages_tested":"English only","multilingual_port":"Generate the fake dialogues in Turkish with a helpful-only model that writes fluent Turkish, or translate English shots; Turkish uses more tokens per word on many tokenisers, so equal shot counts consume more context, and the refusal classifier needs validating on Turkish outputs.","why_it_matters":"It showed that long context windows are an attack surface and that attack strength can be forecast from scaling trends, which shaped how labs test long-context models.","pitfalls":"The attack dialogues and code were not released and the Claude 2.0 and GPT snapshots used are retired or superseded; results depend on how shots are generated, and a later study found context length mattered more than harmful content or topic diversity.","replication_ideas":["Reproduce the shot-count curve on Llama 3.1 8B and Qwen2.5 7B with up to 256 shots, reporting both attack success and the log-likelihood of compliant answers","Compare Turkish and English many-shot prompts of equal token length on the same open model to separate language effects from context-length effects"],"tags":["in-context-learning","jailbreak","long-context","many-shot","power-law"],"_lang":"en"},{"id":"multilingual-alignment-prism-2024","short_name":"Multilingual alignment prism 2024","title":"The Multilingual Alignment Prism: Aligning Global and Local Preferences to Reduce Harm","authors":"Aakanksha et al.","year":2024,"organisation":"Cohere For AI (now Cohere Labs); Cohere","paper_url":"https://arxiv.org/abs/2406.18682","category":"Jailbreaks, robustness and multilingual safety","core_claim":"Safety training of an Aya 23 8B checkpoint on human-annotated multilingual red-teaming prompts, labelled as global or local harms, cut harmful generations on a translated six-language benchmark by about 55 to 57% with supervised fine-tuning (SFT) or direct preference optimisation (DPO), with little loss in general performance. Training only on local harms reduced global harms more than training on global harms did.","claim_types":["method","magnitude"],"original_models":["Aya 23 8B (earlier internal checkpoint)","Command R+ (response generation)","Aya 23 35B (response generation)","GPT-4 Turbo (harm judge)"],"model_access":"mixed","models_still_available":"partly","code_url":"","data_url":"https://huggingface.co/datasets/CohereForAI/aya_redteaming","tooling":"custom supervised fine-tuning (SFT) and direct preference optimisation (DPO) training; GPT-4 Turbo judge","compute_tier":"T2","compute_note":"Full supervised fine-tuning and preference-optimisation runs on an 8B model across several data mixtures need multiple GPUs.","difficulty":"intermediate","replication_status":"no public replication found","replications":[{"title":"AI Safety Lost in Translation: Evaluating the Effectiveness of English-Italian Cross-Lingual LLM Safety Alignment","url":"https://preview.aclanthology.org/ingest-lrec/2026.lrec-main.296/","by":"Wu and Brandao","year":2026,"outcome":"extended","summary":"On small Qwen3, Llama 3.2 and Gemma 3 models, English-only safety fine-tuning transferred to Italian inconsistently and bilingual fine-tuning underperformed other mitigations such as prompting."}],"replication_search_limited":true,"languages_tested":"English, French, Spanish, Hindi, Russian, Arabic (the dataset also covers Serbian and Filipino)","multilingual_port":"Turkish would need new native-annotated red-teaming prompts with local-harm labels, since Aya Red-teaming has no Turkish; the GPT-4 Turbo harm judge agreed with humans only 67 to 82% of the time in the original, so a Turkish judge needs its own validation.","why_it_matters":"It is the main open evidence that multilingual safety data, including locally specific harms, reduces harm across languages without large capability costs.","pitfalls":"The base checkpoint is an unreleased earlier Aya 23 8B, no training code is published, and harm rates come from a GPT-4 Turbo judge with moderate human agreement.","replication_ideas":["Fine-tune the public Aya 23 8B or Aya Expanse 8B with the released red-teaming data at 0% and 15% safety mixtures and re-measure harm with a validated open judge","Collect 300 native Turkish red-teaming prompts with global and local labels and test whether local-harm training carries over to Turkish"],"tags":["aya","dpo","local-harms","multilingual-alignment","red-teaming-data","sft"],"_lang":"multi"},{"id":"safe-multilingual-frontier-ai-2024","short_name":"Safe multilingual frontier AI 2024","title":"Towards Safe Multilingual Frontier AI","authors":"Kanepajs, Ivanov and Moulange","year":2024,"organisation":"ERA:AI Fellowship; University of Cambridge","paper_url":"https://arxiv.org/abs/2409.13708","category":"Jailbreaks, robustness and multilingual safety","core_claim":"With 100 harmful and 100 borderline OR-Bench prompts machine-translated into all 24 official European Union (EU) languages, lower language resourcedness was associated with higher acceptance of harmful prompts for GPT-4o and Mistral Large 2 but not for Claude 3.5 Sonnet, Gemini 1.5 Pro or Llama 3.1 405B. Over-refusal of harmless prompts showed no link to resourcedness, and the authors use the results to argue for mandatory multilingual safety assessment under the EU AI Act.","claim_types":["prevalence","ranking"],"original_models":["Claude 3.5 Sonnet","Gemini 1.5 Pro","GPT-4o","Llama 3.1 405B","Mistral Large 2"],"model_access":"mixed","models_still_available":"partly","code_url":"https://github.com/akanepajs/multilingual","data_url":"","tooling":"API scripts; logistic regression; GPT-4o mini judge","compute_tier":"T1","compute_note":"200 prompts in 24 languages for five models is about 24,000 API calls plus judge calls.","difficulty":"starter","replication_status":"no public replication found","replications":[{"title":"Multilingual jailbreaking of LLMs using low-resource languages","url":"https://arxiv.org/abs/2605.18239","by":"Marx and Dunaiski","year":2026,"outcome":"extended","summary":"Tested four low-resource African languages on current commercial models and found single-turn translated attacks largely ineffective but multi-turn attacks effective, with translation quality as the deciding factor."}],"replication_search_limited":false,"languages_tested":"All 24 official European Union (EU) languages, including English, Latvian, Irish and Maltese","multilingual_port":"Adding Turkish is straightforward with the released code, but Google Translate can make harmful prompts harmless (two of 19 accepted Latvian prompts were), so a native reviewer should check translations and a sample of judge labels.","why_it_matters":"It tests the resource-level hypothesis on 2024 frontier models with a regression design and ties the evidence to European Union (EU) AI Act evaluation policy.","pitfalls":"With 100 prompts per language it is a proof of concept, the GPT-4o mini judge was not checked against human labels, and the paper withholds translated prompts by design; Claude 3.5 Sonnet and Gemini 1.5 Pro have since been retired.","replication_ideas":["Re-run the released code on current versions of the five model families with 300 prompts per language, adding Turkish and other European Union candidate-country languages","Validate the GPT-4o mini judge against native-speaker labels in three lower-resource languages"],"tags":["eu-languages","multilingual","or-bench","policy","regression","resourcedness"],"_lang":"multi"},{"id":"multilingual-fine-tuning-attacks-2024","short_name":"Multilingual fine-tuning attacks 2024","title":"Towards Understanding the Fragility of Multilingual LLMs against Fine-Tuning Attacks","authors":"Poppi et al.","year":2024,"organisation":"Meta; Brown University; University of Illinois Urbana-Champaign; University of Pisa; University of Modena and Reggio Emilia","paper_url":"https://arxiv.org/abs/2410.18210","category":"Jailbreaks, robustness and multilingual safety","core_claim":"Fine-tuning Qwen2-7B-Instruct or Llama-3.1-8B-Instruct on 100 harmful examples in one language raised harmful-response rates on MultiJail and Aya Red-teaming across the other evaluated languages, while multilingual Massive Multitask Language Understanding (MMLU) scores stayed roughly stable. Safety Information Localization (SIL) found largely shared safety parameters (changing about 20% of weights broke safety in every language) and freezing them did not stop the attack; stitching them into the Turkish-adapted Defne-llama3.1-8B raised its Turkish violation rate from 2.9% to 19.4%.","claim_types":["existence","mechanism","magnitude"],"original_models":["Qwen2-7B-Instruct","Llama-3.1-8B-Instruct","Defne-llama3.1-8B (Turkish-adapted Llama 3.1)"],"model_access":"open-weight","models_still_available":"yes","code_url":"","data_url":"","tooling":"custom PyTorch fine-tuning; Llama-Guard-3 and Llama-3.1-405B judges","compute_tier":"T2","compute_note":"The attack fine-tunes 7B to 8B models and the localisation analysis repeats fine-tuning and parameter comparisons, which suits a few GPUs; a low-rank adaptation (LoRA) attack alone fits on one GPU.","difficulty":"intermediate","replication_status":"no public replication found","replications":[],"replication_search_limited":true,"languages_tested":"English, Italian, French, Chinese, Hindi, Bengali, Russian, Arabic, Tagalog; Turkish (machine-translated MultiJail) for the Turkish-adapted model","multilingual_port":"Run the attack with Turkish harmful examples and evaluate on a native-checked Turkish MultiJail; Llama-Guard-3 does not list Turkish among its supported languages, so the judge needs validating or replacing with a Turkish-capable classifier.","why_it_matters":"It shows that safety in multilingual models can be removed in every language by fine-tuning in one, which matters for any group adapting open models to a new language.","pitfalls":"No code is linked, a response counts as harmful only if every judge flags it, and the Turkish result rests on machine-translated prompts and a single community model whose current availability was not checked.","replication_ideas":["Reproduce the single-language fine-tuning attack on Llama-3.1-8B-Instruct using Turkish harmful examples and measure violation rates in Turkish and English","Compare harmful-response rates of a base model and two Turkish-localised derivatives before any attack, to measure safety loss from localisation alone"],"tags":["cross-lingual-transfer","fine-tuning-attack","language-adaptation","safety-parameters","turkish"],"_lang":"multi"},{"id":"xsafety-2023","short_name":"XSafety 2023","title":"All Languages Matter: On the Multilingual Safety of Large Language Models","authors":"Wang et al.","year":2023,"organisation":"The Chinese University of Hong Kong; Tencent AI Lab","paper_url":"https://arxiv.org/abs/2310.00905","category":"Jailbreaks, robustness and multilingual safety","core_claim":"Using XSafety, 2,800 prompts per language over 14 safety issue types in ten languages, ChatGPT, PaLM-2, LLaMA-2-Chat and Vicuna gave unsafe responses far more often to non-English queries (22.9% on average) than English ones (8.0%). Simple prompts that draw out the model's safety knowledge cut ChatGPT's non-English unsafe rate from 19.1% to 9.7%.","claim_types":["prevalence","ranking","method"],"original_models":["ChatGPT (gpt-3.5-turbo-0613)","PaLM-2","LLaMA-2-Chat","Vicuna"],"model_access":"mixed","models_still_available":"partly","code_url":"https://github.com/Jarviswang94/Multilingual_safety_benchmark","data_url":"https://github.com/Jarviswang94/Multilingual_safety_benchmark","tooling":"API scripts; ChatGPT as judge","compute_tier":"T1","compute_note":"28,000 prompts per model plus a judge call per response, with non-English answers translated into English first.","difficulty":"starter","replication_status":"conditional","replications":[{"title":"OpenEthics: A Comprehensive Ethical Evaluation of Open-Source Generative Large Language Models","url":"https://arxiv.org/abs/2505.16036","by":"Çetin et al. (METU)","year":2025,"outcome":"replicated","summary":"An independent English-Turkish test on 29 open-weight models found average safety of 94.3% in English against 82.0% in Turkish, with larger gaps for smaller models."},{"title":"Benchmarking Prompt Injection Attacks on LLMs: Turkish Vulnerability Assessment and English Comparative Analysis","url":"https://www.mdpi.com/2076-3417/16/13/6740","by":"Aytaş et al. (YTU and Işık University)","year":2026,"outcome":"conditional","summary":"Across 55 models, Turkish-English safety differences ran in both directions depending on the model, with several frontier models scoring higher on Turkish prompts."},{"title":"LLMs Lost in Translation: M-ALERT uncovers Cross-Linguistic Safety Inconsistencies","url":"https://arxiv.org/abs/2412.15035","by":"Friedrich et al.","year":2024,"outcome":"extended","summary":"Testing 39 models in five European languages, it found safety often differs by language and risk category within the same model."}],"replication_search_limited":true,"languages_tested":"English, Chinese, Spanish, French, Bengali, Arabic, Hindi, Russian, Japanese, German","multilingual_port":"Machine-translate the English set into Turkish and have it proofread, as XSafety did with professional translators; the judge scored English translations of non-English answers, so translation errors can hide or invent unsafe content.","why_it_matters":"It provided early, broad evidence that the safety gap spans many languages and model families, not only low-resource languages on GPT-4.","pitfalls":"PaLM-2 and the June 2023 ChatGPT snapshot have been superseded, and the ChatGPT judge (88.5% agreement with humans) worked on English translations of answers, so judge and translation errors compound.","replication_ideas":["Re-run a stratified 1,400-prompt XSafety subset on current open-weight models, judging answers in their original language with a guard model and comparing with translate-then-judge scoring","Add a proofread Turkish version of the subset and test whether the safety-knowledge prompting fix carries over to Turkish"],"tags":["benchmark","llm-judge","multilingual-safety","prompting-defence","xsafety"],"_lang":"multi"},{"id":"jailbroken-2023","short_name":"Jailbroken 2023","title":"Jailbroken: How Does LLM Safety Training Fail?","authors":"Wei, Haghtalab and Steinhardt","year":2023,"organisation":"UC Berkeley","paper_url":"https://arxiv.org/abs/2307.02483","category":"Jailbreaks, robustness and multilingual safety","core_claim":"Safety training fails in two ways: competing objectives, where helpfulness or instruction-following goals override refusal, and mismatched generalisation, where inputs such as Base64-encoded text fall outside safety training but within the model's capabilities. Attacks built from these two principles succeeded on every prompt in a set of unsafe requests drawn from the red-teaming evaluations of GPT-4 and Claude v1.3, and beat earlier ad hoc jailbreaks.","claim_types":["mechanism","existence","ranking"],"original_models":["GPT-4","Claude v1.3"],"model_access":"API-only","models_still_available":"unknown","code_url":"","data_url":"","tooling":"API scripts","compute_tier":"T1","compute_note":"About 30 attack variants over a few hundred prompts on two API models; cost depends mainly on the target model's price.","difficulty":"starter","replication_status":"partially replicated","replications":[{"title":"A StrongREJECT for Empty Jailbreaks","url":"https://arxiv.org/abs/2402.10260","by":"Souly et al.","year":2024,"outcome":"partial","summary":"Re-scored jailbreaks, including ones collected from Wei et al., with a grader that rates how useful answers are, and found most scored well below the success rates reported when they were introduced."}],"replication_search_limited":false,"languages_tested":"English only (with encoded variants such as Base64)","multilingual_port":"Rebuild each attack template in Turkish rather than translating it literally, since prefix-injection and style attacks depend on idiomatic phrasing; Turkish itself can act as a mismatched-generalisation input, so English and Turkish versions of each template should be compared on the same requests.","why_it_matters":"Its two failure modes are the standard explanation for why jailbreaks work, and later multilingual attacks are usually framed as mismatched generalisation.","pitfalls":"No official code or prompt set is linked, Claude v1.3 is retired and current GPT-4 versions differ from the 2023 snapshots; success was a coarse three-way label (bypass, refusal or unclear) that says little about how useful the harmful output is.","replication_ideas":["Re-run the strongest combination attacks on current API and open-weight models and grade outputs with StrongREJECT to separate refusal bypass from useful harmful content","Build Turkish versions of the competing-objectives and mismatched-generalisation templates and compare success with the English originals on the same requests"],"tags":["claude","competing-objectives","gpt-4","jailbreak","mismatched-generalisation","safety-training"],"_lang":"en"},{"id":"low-resource-languages-jailbreak-2023","short_name":"Low-resource languages jailbreak 2023","title":"Low-Resource Languages Jailbreak GPT-4","authors":"Yong, Menghini and Bach","year":2023,"organisation":"Brown University","paper_url":"https://arxiv.org/abs/2310.02446","category":"Jailbreaks, robustness and multilingual safety","core_claim":"Translating the 520 AdvBench harmful behaviours into other languages with Google Translate bypassed GPT-4 (gpt-4-0613) safeguards far more often in low-resource languages: counting a prompt as broken if any of Zulu, Scots Gaelic, Hmong or Guarani bypassed, the rate was 79%, against under 1% in English and about 11% for combined high-resource languages. Single low-resource languages ranged from 16% (Guarani) to 53% (Zulu).","claim_types":["existence","magnitude","ranking"],"original_models":["GPT-4 (gpt-4-0613)"],"model_access":"API-only","models_still_available":"unknown","code_url":"","data_url":"","tooling":"API scripts with Google Translate","compute_tier":"T1","compute_note":"About 6,800 short GPT-4 queries (520 prompts in 13 languages) plus translation calls, which costs under $50 on cheaper current models.","difficulty":"starter","replication_status":"partially replicated","replications":[{"title":"A StrongREJECT for Empty Jailbreaks","url":"https://arxiv.org/abs/2402.10260","by":"Souly et al.","year":2024,"outcome":"failed","summary":"Attempted to reproduce the Scots Gaelic result on GPT-4 and found the outputs generally vacuous or incoherent, with no actionable harmful information."},{"title":"Towards Safe Multilingual Frontier AI","url":"https://arxiv.org/abs/2409.13708","by":"Kanepajs, Ivanov and Moulange","year":2024,"outcome":"conditional","summary":"Across all 24 official European Union languages and five 2024 frontier models, lower-resource languages were linked to higher acceptance of harmful prompts only for GPT-4o and Mistral Large 2."},{"title":"Multilingual jailbreaking of LLMs using low-resource languages","url":"https://arxiv.org/abs/2605.18239","by":"Marx and Dunaiski","year":2026,"outcome":"conditional","summary":"Single-turn translated attacks in Afrikaans, Kiswahili, isiXhosa and isiZulu were largely ineffective on current commercial models, while multi-turn conversations and native-speaker red teaming produced high harmful-response rates."},{"title":"SomaliBench Eval: Measuring English-to-Somali Refusal Gaps in Open-Weight Language Models","url":"https://arxiv.org/abs/2605.25420","by":"Dahir (Unkad Labs)","year":2026,"outcome":"extended","summary":"Found large English-to-Somali refusal gaps on four open-weight models, but for three of them most Somali non-refusals were unclear or off-topic output rather than fluent harmful compliance."}],"replication_search_limited":false,"languages_tested":"English, Zulu, Scots Gaelic, Hmong, Guarani, Ukrainian, Bengali, Thai, Hebrew, Simplified Mandarin, Modern Standard Arabic, Italian, Hindi","multilingual_port":"Turkish is a mid-resource language, so a port tests whether the resource gradient holds in the middle of the range; machine translation can strip the harmful intent from prompts, answers must be judged natively or back-translated, and incoherent answers should not count as bypasses.","why_it_matters":"It is the most cited demonstration that safety training generalises poorly to low-resource languages and anchors the cross-lingual safety gap literature.","pitfalls":"The 79% headline counts a prompt as broken if any of four languages bypasses, which inflates it relative to single-language rates; a later reproduction found the Scots Gaelic outputs vacuous, so bypass labels need a usefulness check, and current models resist single-turn translation attacks much better.","replication_ideas":["Re-run the 520 AdvBench prompts in Zulu, Scots Gaelic, Turkish and English on three current models, reporting per-language bypass rates and StrongREJECT usefulness scores instead of the any-language union","Test whether native-speaker translations of a 100-prompt subset change bypass rates compared with Google Translate output"],"tags":["advbench","cross-lingual","gpt-4","low-resource-languages","multilingual","translation-attack"],"_lang":"multi"},{"id":"multijail-2023","short_name":"MultiJail 2023","title":"Multilingual Jailbreak Challenges in Large Language Models","authors":"Deng et al.","year":2023,"organisation":"DAMO Academy, Alibaba Group; Nanyang Technological University","paper_url":"https://arxiv.org/abs/2310.06474","category":"Jailbreaks, robustness and multilingual safety","core_claim":"On ChatGPT and GPT-4, unsafe output rose as language resources fell, with low-resource languages about three times as likely as high-resource ones to yield harmful content when users simply wrote in them. Deliberately combining malicious instructions with multilingual prompts pushed unsafe rates to about 81% for ChatGPT and 41% for GPT-4, and fine-tuning ChatGPT on automatically generated multilingual safety data (the SELF-DEFENSE framework) reduced unsafe output.","claim_types":["existence","magnitude","method"],"original_models":["ChatGPT (GPT-3.5 Turbo)","GPT-4"],"model_access":"API-only","models_still_available":"unknown","code_url":"https://github.com/DAMO-NLP-SG/multilingual-safety-for-LLMs","data_url":"https://github.com/DAMO-NLP-SG/multilingual-safety-for-LLMs","tooling":"API scripts","compute_tier":"T0","compute_note":"MultiJail has 315 prompts in ten languages, about 3,150 queries per model plus judge calls.","difficulty":"starter","replication_status":"conditional","replications":[{"title":"The Language Barrier: Dissecting Safety Challenges of LLMs in Multilingual Contexts","url":"https://preview.aclanthology.org/setup/2024.findings-acl.156","by":"Shen et al.","year":2024,"outcome":"replicated","summary":"An independent study found models gave unsafe responses much more often to malicious prompts in lower-resource languages, and also more irrelevant responses."},{"title":"Towards Safe Multilingual Frontier AI","url":"https://arxiv.org/abs/2409.13708","by":"Kanepajs, Ivanov and Moulange","year":2024,"outcome":"conditional","summary":"On five 2024 frontier models, the link between lower language resourcedness and harmful-prompt acceptance held for GPT-4o and Mistral Large 2 but not for Claude 3.5 Sonnet, Gemini 1.5 Pro or Llama 3.1 405B."},{"title":"Towards Understanding the Fragility of Multilingual LLMs against Fine-Tuning Attacks","url":"https://arxiv.org/abs/2410.18210","by":"Poppi et al.","year":2024,"outcome":"extended","summary":"Used MultiJail to show that a fine-tuning attack in one language raises harmful-response rates in other languages."}],"replication_search_limited":true,"languages_tested":"English, Chinese, Italian, Vietnamese, Arabic, Korean, Thai, Bengali, Swahili, Javanese","multilingual_port":"Have native translators render the 315 English seed prompts into Turkish, as MultiJail did for its nine languages; Turkish falls between the paper's high- and medium-resource tiers, and the evaluator's accuracy on Turkish answers needs checking against native labels.","why_it_matters":"MultiJail is one of the most reused multilingual jailbreak test sets, and its resource-level gradient is a standard reference point.","pitfalls":"The 2023 ChatGPT and GPT-4 snapshots may no longer be served and unsafe-rate labels depend on the evaluator, which should be re-validated per language; later tests on 2024 frontier models found the resource gradient for only some models.","replication_ideas":["Re-run MultiJail's unintentional scenario on three current open-weight models and add a native-reviewed Turkish translation of the 315 prompts","Compare unsafe rates from a guard-model judge with native-speaker labels on a 100-response Turkish and Swahili subset"],"tags":["benchmark","low-resource-languages","multijail","multilingual-jailbreak","self-defense"],"_lang":"multi"},{"id":"gcg-2023","short_name":"GCG attack 2023","title":"Universal and Transferable Adversarial Attacks on Aligned Language Models","authors":"Zou et al.","year":2023,"organisation":"Carnegie Mellon University; Center for AI Safety; Google DeepMind; Bosch Center for AI","paper_url":"https://arxiv.org/abs/2307.15043","category":"Jailbreaks, robustness and multilingual safety","core_claim":"Greedy Coordinate Gradient (GCG), a white-box search over suffix tokens, finds adversarial suffixes that make Vicuna-7B and LLaMA-2-7B-Chat comply with harmful AdvBench requests at high rates. Suffixes optimised across several open models and prompts also transferred, at lower rates, to closed chat systems including ChatGPT, Bard and Claude.","claim_types":["method","existence","magnitude"],"original_models":["
