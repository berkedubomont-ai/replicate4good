Vicuna-7B","LLaMA-2-7B-Chat","Guanaco","Pythia","Falcon","GPT-3.5 (ChatGPT)","GPT-4","PaLM-2 (Bard)","Claude"],"model_access":"mixed","models_still_available":"partly","code_url":"https://github.com/llm-attacks/llm-attacks","data_url":"https://github.com/llm-attacks/llm-attacks","tooling":"custom PyTorch (llm-attacks repository); nanoGCG for newer models","compute_tier":"T1","compute_note":"Each suffix optimisation for a 7B model runs on one 80GB A100-class GPU, so a core white-box replication fits a modest GPU budget.","difficulty":"intermediate","replication_status":"conditional","replications":[{"title":"Investigating Adversarial Trigger Transfer in Large Language Models","url":"https://arxiv.org/abs/2404.16020","by":"Meade, Patel and Reddy","year":2024,"outcome":"conditional","summary":"Optimised triggers transferred inconsistently across 13 open models: preference-optimised models resisted even triggers optimised directly on them, while models aligned only by fine-tuning were highly susceptible."},{"title":"A StrongREJECT for Empty Jailbreaks","url":"https://arxiv.org/abs/2402.10260","by":"Souly et al.","year":2024,"outcome":"conditional","summary":"Two GCG variants worked against GPT-3.5 Turbo but not GPT-4o or Llama-3.1 70B, which the authors suggest may have been trained against such suffixes."}],"replication_search_limited":false,"languages_tested":"English only","multilingual_port":"Translate the AdvBench behaviours and target strings into Turkish and optimise suffixes against Turkish prompts; Turkish morphology complicates exact target-string matching, tokenisers split Turkish words into more pieces, and refusal-keyword success checks must be rebuilt in Turkish.","why_it_matters":"It is the standard white-box jailbreak baseline and the source of the AdvBench prompts that many later robustness papers reuse.","pitfalls":"The original code only supports LLaMA- and Pythia-style tokenisers and its README warns it may fail silently on others; success was counted by refusal-keyword matching, which overstates harmful compliance, and newer models appear to be trained against such suffixes.","replication_ideas":["Re-run Greedy Coordinate Gradient (GCG) attacks with nanoGCG on current open-weight chat models (e.g. Llama 3.1 8B, Qwen2.5 7B) and score outputs with the StrongREJECT grader instead of refusal keywords","Optimise suffixes on Turkish-translated AdvBench prompts for a base model and its Turkish-localised derivative and compare attack success"],"tags":["advbench","adversarial-suffix","gcg","jailbreak","transfer","white-box"],"_lang":"en"},{"id":"sa-bench-2026","short_name":"SA-Bench 2026","title":"SA-Bench: Evaluating Semantic Alignment in LLM-Based Paper Reproduction","authors":"Hu et al.","year":2026,"organisation":"Beihang University; Shanghai Jiao Tong University; Minzu University of China; Peking University","paper_url":"https://arxiv.org/abs/2608.24252","category":"Dangerous capabilities and agentic evaluation","core_claim":"When 12 generator configurations (four models by three scaffolds) wrote reproduction code for 30 ICLR, ICML and NeurIPS 2025 papers, the code matched the papers' 1,491 atomic specifications poorly: the best configuration (Claude Sonnet 4.6 with PaperCoder) averaged 0.301 out of 1 and the overall mean was 0.221. Agents usually attempted most requirements but implemented many incorrectly or left stubs, and experimental protocols were the hardest dimension across models and scaffolds.","claim_types":["magnitude","ranking","method"],"original_models":["Claude-Sonnet-4.6","DeepSeek-V4-Pro","Gemini-2.5-Flash","GPT-4o","GPT-5.5 (judge)"],"model_access":"API-only","models_still_available":"unknown","code_url":"https://github.com/kernel-14/SemanticAlign-Bench","data_url":"https://huggingface.co/datasets/kernel-14/SemanticAlign-Bench","tooling":"sa_bench Python package (sau-score command-line tool) with LLM-judge or deterministic scoring; BasicAgent, PaperCoder and OpenHands scaffolds","compute_tier":"T1","compute_note":"Generating repositories for 30 papers with one model and scaffold plus judge calls is a modest API cost; the paper's full grid is 360 generations.","difficulty":"intermediate","replication_status":"no public replication found","replications":[],"replication_search_limited":true,"languages_tested":"English only","multilingual_port":"Specifications are extracted from English papers and judged in English, so a port would mean translating papers or writing Turkish specifications and checking judge accuracy, which mainly matters for groups studying Turkish-language research automation.","why_it_matters":"It isolates a failure mode that executability-focused benchmarks miss, code that runs but quietly departs from the paper, which matters for anyone relying on automated replication tools.","pitfalls":"Very new (August 2026) with no independent use yet; scores rely on an LLM judge (GPT-5.5 in the paper, with a deterministic option), and with 30 papers the per-domain estimates rest on few papers each.","replication_ideas":["Score one open-weight model with the BasicAgent scaffold on all 30 papers using both the LLM judge and the deterministic scorer, and report agreement between the two.","Hand-check 100 judged specification units to estimate the judge's precision and recall on protocol drift."],"tags":["ai r&d","automated replication","paper reproduction","research agents","semantic drift"],"_lang":"en"},{"id":"metr-time-horizons-2025","short_name":"METR time horizons 2025","title":"Measuring AI Ability to Complete Long Software Tasks","authors":"Kwa et al.","year":2025,"organisation":"METR","paper_url":"https://arxiv.org/abs/2503.14499","category":"Dangerous capabilities and agentic evaluation","core_claim":"Timing skilled humans on 170 software and research-engineering tasks (97 from METR's HCAST suite, 7 from RE-Bench and 66 new very short tasks), the authors define a model's 50% time horizon as the human task length at which it succeeds half the time, and find it rose from about 2 seconds for GPT-2 (2019) to about 50 minutes for Claude 3.7 Sonnet (early 2025). The horizon doubled roughly every seven months (207 days, 95% confidence interval 166 to 240), and horizons at 80% reliability were four to six times shorter but grew at a similar rate.","claim_types":["magnitude","method"],"original_models":["GPT-2","GPT-3","GPT-3.5","GPT-4 1106","o1","Claude 3.7 Sonnet","o3","other frontier and near-frontier models (16 in total, released 2019 to 2025)"],"model_access":"mixed","models_still_available":"partly","code_url":"https://github.com/METR/eval-analysis-public","data_url":"https://github.com/METR/eval-analysis-public","tooling":"METR Task Standard tasks run with METR agent scaffolds; Python and DVC (Data Version Control) pipeline for logistic fits and bootstrapped trends","compute_tier":"T2","compute_note":"Re-fitting horizons from the released run data needs only a laptop, but re-running agents on the public tasks for several current models needs heavy API spend, and new human baselines cost far more.","difficulty":"advanced","replication_status":"partially replicated","replications":[{"title":"How Does Time Horizon Vary Across Domains?","url":"https://metr.org/blog/2025-07-14-how-does-time-horizon-vary-across-domains","by":"METR","year":2025,"outcome":"extended","summary":"The original team applied the method to other benchmarks and found horizons in maths, science questions and programming doubling every 2 to 6 months, with visual computer-use horizons 40 to 100 times shorter but rising at similar rates."},{"title":"Is there a half-life for the success rates of AI agents?","url":"https://arxiv.org/abs/2505.05115","by":"Toby Ord","year":2025,"outcome":"extended","summary":"An independent re-analysis showing the results fit a constant failure rate per minute of human task time, so each agent's success falls exponentially with task length and can be summarised by a half-life."},{"title":"(Updated) METR's data can't distinguish between trajectories (and 80% horizons are an order of magnitude off)","url":"https://www.lesswrong.com/posts/sBEzomgnYJmYHki9T/updated-metr-s-data-can-t-distinguish-between-trajectories","by":"Jonas Moss","year":2026,"outcome":"partial","summary":"A Bayesian item response theory refit finds linear, quadratic, power-law and saturating ability trends fit the data about equally well, and argues the headline 80% horizons overstate typical capability by roughly an order of magnitude."},{"title":"On the estimation and validity of AI time horizons---a statistical look at the METR plot","url":"https://arxiv.org/abs/2610.12466","by":"Drew T. Nguyen and William Fithian","year":2026,"outcome":"partial","summary":"Reproduces the time-horizon plot from public data (228 tasks, 26 AI systems) and accepts the observed growth, but finds the assumed log-linear link between human time and AI difficulty fails, with a nearly flat region from about 2 to 30 minutes, so equal multiplicative gains in horizon are not equally hard."},{"title":"How fast is autonomous AI cyber capability advancing?","url":"https://aisi.gov.uk/blog/how-fast-is-autonomous-ai-cyber-capability-advancing","by":"UK AI Security Institute","year":2026,"outcome":"extended","summary":"Using its own cyber task suite and 80%-reliability horizons, the institute estimated a doubling time of about 4.7 months in February 2026, close to METR's recent software estimate, with the newest models above that trend."}],"replication_search_limited":false,"languages_tested":"English only","multilingual_port":"Task instructions can be translated into Turkish, but code, libraries and documentation stay in English, so a port mostly tests whether instruction language changes agent success rather than producing a new horizon. Human baselines would need re-timing if translated instructions change task difficulty.","why_it_matters":"It is a widely cited quantitative trend line for forecasting when AI agents could carry out long autonomous projects, including AI research work.","pitfalls":"Horizon estimates carry roughly twofold error bars and depend on human-baseline conventions, task selection and agent scaffolds, which changed across the model series; few tasks run beyond two hours, so frontier estimates become unstable as the suite saturates, and outsiders can only re-run the public subset of tasks.","replication_ideas":["Re-fit 50% and 80% horizons from the released run data with alternative models (item response theory with task random effects, or splines) and report how the doubling time and its interval move.","Measure time horizons for two current open-weight models on the public METR tasks under two different scaffolds to quantify how much scaffold choice shifts the estimate."],"tags":["agents","autonomy","forecasting","metr","software tasks","time horizon","trend analysis"],"_lang":"en"},{"id":"paperbench-2025","short_name":"PaperBench 2025","title":"PaperBench: Evaluating AI's Ability to Replicate AI Research","authors":"Starace et al.","year":2025,"organisation":"OpenAI","paper_url":"https://arxiv.org/abs/2504.01848","category":"Dangerous capabilities and agentic evaluation","core_claim":"Agents asked to replicate 20 ICML 2024 Spotlight and Oral papers from scratch, without the authors' code and with up to 12 hours on one A10 GPU, were graded by a large language model (LLM) judge against rubrics co-developed with each paper's authors (8,316 gradable requirements in total); the best average replication score was 21.0% (Claude 3.5 Sonnet (New) with a basic scaffold). On a three-paper subset, machine learning PhDs reached 41.4% after 48 hours against 26.6% for o1.","claim_types":["magnitude","ranking","method"],"original_models":["Claude 3.5 Sonnet (New)","o1","o3-mini","GPT-4o","DeepSeek-R1","Gemini 2.0 Flash"],"model_access":"mixed","models_still_available":"partly","code_url":"https://github.com/openai/preparedness","data_url":"","tooling":"OpenAI preparedness repository (PaperBench project), Docker containers with an A10 GPU, o3-mini-based SimpleJudge","compute_tier":"T3","compute_note":"Each attempt runs up to 12 hours on an A10 GPU plus a reproduction run and judging costs about $66 per paper, so several seeds over 20 papers likely exceed $5,000; the Code-Dev variant drops the GPU step and costs about $10 per paper to grade.","difficulty":"advanced","replication_status":"no public replication found","replications":[{"title":"SA-Bench: Evaluating Semantic Alignment in LLM-Based Paper Reproduction","url":"https://arxiv.org/abs/2608.24252","by":"Hu et al.","year":2026,"outcome":"extended","summary":"An independent benchmark whose basic agent follows PaperBench's design scores whether generated code matches 1,491 atomic paper specifications, and finds the best configuration reaches a mean alignment score of only 0.301 out of 1."},{"title":"From Reproduction to Replication: Evaluating Research Agents with Progressive Code Masking","url":"https://mlanthology.org/iclr/2026/kim2026iclr-reproduction/","by":"Kim, Wilf, Morency and Fried","year":2026,"outcome":"extended","summary":"Gives agents a paper plus a codebase with key functions removed and shows success falls quickly as more functions are masked, with interactive agents beating fixed harnesses."}],"replication_search_limited":false,"languages_tested":"English only","multilingual_port":"Papers, rubrics and code are in English and the judge grades English rubrics, so a Turkish version would need translated papers and rubrics plus a check of judge accuracy, which is worth doing only for studies of Turkish-language research automation.","why_it_matters":"It is a leading test of whether agents can replicate frontier machine learning research end to end, an early indicator for automated AI research.","pitfalls":"Scores rest on an LLM judge (F1 of 0.83 against human grading) and on blocking agents from the authors' repositories and online replications; results vary with scaffold and time limit (o1 rose from 13.2% to 24.4% with an iterative agent).","replication_ideas":["Run PaperBench Code-Dev on five papers with one current open-weight model under two scaffolds, grading with two different judge models to measure judge sensitivity.","Hand-grade 50 rubric leaves from your own runs and compare them with the judge's verdicts to estimate judge error in a new setting."],"tags":["agents","ai r&d","llm judge","paper reproduction","research replication"],"_lang":"en"},{"id":"agentharm-2024","short_name":"AgentHarm 2024","title":"AgentHarm: A Benchmark for Measuring Harmfulness of LLM Agents","authors":"Andriushchenko et al.","year":2024,"organisation":"UK AI Safety Institute; Gray Swan AI","paper_url":"https://arxiv.org/abs/2410.09024","category":"Dangerous capabilities and agentic evaluation","core_claim":"On a benchmark of 110 explicitly malicious agent tasks (440 with augmentations) across 11 harm categories using 104 synthetic tools, several leading models carried out many harmful tasks with no jailbreak: on the public test set GPT-4o scored 48.4% on harm with 48.9% refusals, and Mistral Large 2 scored 82.2% with 1.1% refusals. A simple universal jailbreak template raised harm scores sharply (Claude 3.5 Sonnet from 13.5% to 68.7%) while agents kept almost all of their benign-task capability.","claim_types":["prevalence","magnitude","ranking"],"original_models":["GPT-4o","GPT-4o mini","Claude 3.5 Sonnet","Gemini 1.5 Pro","Mistral Large 2","Llama 3.1 405B"],"model_access":"mixed","models_still_available":"partly","code_url":"https://github.com/UKGovernmentBEIS/inspect_evals/tree/main/src/inspect_evals/agentharm","data_url":"https://huggingface.co/datasets/ai-safety-institute/AgentHarm","tooling":"Inspect (Inspect Evals implementation) with GPT-4o as semantic and refusal judge","compute_tier":"T0","compute_note":"The public split is a few hundred short tool-use episodes plus GPT-4o judge calls, a few dollars per model through APIs.","difficulty":"starter","replication_status":"no public replication found","replications":[{"title":"Safety, or Just Capability? A Validity Audit of Agent-Safety Benchmarks","url":"https://arxiv.org/abs/2607.28685","by":"Wang et al.","year":2026,"outcome":"extended","summary":"Re-ran AgentHarm with three other agent-safety benchmarks on up to 22 models and found its scores tracked a separate jailbreak-safety measure after controlling for capability, while the benchmarks ranked models differently from one another."}],"replication_search_limited":false,"languages_tested":"English only","multilingual_port":"Task prompts and synthetic tool outputs would need careful translation, and the GPT-4o semantic and refusal judges would need re-validation on Turkish outputs; refusal behaviour may differ by language, which is exactly what a port would measure.","why_it_matters":"It gave early quantitative evidence that refusal training for chat does not carry over reliably to tool-using agents, and the UK AI Security Institute hosts it as a standard agent misuse evaluation.","pitfalls":"Only part of the test set is public (a 30% private split was never sent to public APIs), so public-split numbers are not directly comparable with the paper; scores depend on the GPT-4o judge and the jailbreak template, and model snapshots drift over time.","replication_ideas":["Re-run the public split on three current open-weight models with and without the jailbreak template, swapping the GPT-4o judge for an open judge, and report how harm and refusal scores change.","Translate a stratified subset of tasks into Turkish and compare refusal rates with the English originals, validating the judge on a hand-labelled sample."],"tags":["agents","harmfulness","inspect","misuse","refusal","tool use"],"_lang":"en"},{"id":"cybench-2024","short_name":"Cybench 2024","title":"Cybench: A Framework for Evaluating Cybersecurity Capabilities and Risks of Language Models","authors":"Zhang et al.","year":2024,"organisation":"Stanford University","paper_url":"https://arxiv.org/abs/2408.08926","category":"Dangerous capabilities and agentic evaluation","core_claim":"On 40 professional Capture the Flag (CTF) tasks from four competitions, the best agents without guidance (structured bash scaffold, one attempt, 15 iterations) solved at most 17.5% of tasks (Claude 3.5 Sonnet), and only tasks that the first human team had solved within 11 minutes. Splitting tasks into subtasks gave a finer-grained measure than pass or fail alone.","claim_types":["magnitude","ranking","method"],"original_models":["GPT-4o","OpenAI o1-preview","Claude 3 Opus","Claude 3.5 Sonnet","Mixtral 8x22b Instruct","Gemini 1.5 Pro","Llama 3 70B Chat","Llama 3.1 405B Instruct"],"model_access":"mixed","models_still_available":"partly","code_url":"https://github.com/andyzorigin/cybench","data_url":"https://github.com/andyzorigin/cybench","tooling":"Custom Docker-based agent framework and task containers (structured bash, action-only, pseudoterminal and web search scaffolds)","compute_tier":"T1","compute_note":"Agent runs are API calls inside Docker containers, and independent leaderboard runs cost about $6 to $270 per model, so a few models with repeats stay in the low hundreds of dollars.","difficulty":"intermediate","replication_status":"conditional","replications":[{"title":"Cybench leaderboard","url":"https://hal.cs.princeton.edu/cybench","by":"Holistic Agent Leaderboard (HAL), Princeton University","year":2025,"outcome":"conditional","summary":"Independent re-runs of nine agents on the same 40 tasks reported solve rates from 0% to 25% with costs, including 20% for o1-preview against 10% in the paper and 0% for Llama 3.1 405B Instruct against 7.5%, so results shift with harness and run settings."}],"replication_search_limited":false,"languages_tested":"English only","multilingual_port":"Task descriptions are short and easy to translate while the artefacts (code, binaries, web services) are language-neutral, and flags are checked exactly, so a Turkish port cleanly isolates the effect of instruction language without any judge model.","why_it_matters":"It is a standard offensive-cyber benchmark whose scores appear in frontier model system cards from several labs, including Anthropic, xAI and Meta.","pitfalls":"Scores swing with scaffold, iteration limit and number of attempts; public CTF write-ups can leak into training data, and the project page notes that some scores were adjusted for a leaked answer.","replication_ideas":["Re-run the unguided and subtask-guided modes for two open-weight models with three seeds each and report variance next to the paper's single-attempt numbers.","Compare the structured bash and action-only scaffolds on one model to measure how much scaffold choice moves solve rates."],"tags":["agents","ctf","cybersecurity","dangerous capabilities","offensive cyber"],"_lang":"en"},{"id":"mle-bench-2024","short_name":"MLE-bench 2024","title":"MLE-bench: Evaluating Machine Learning Agents on Machine Learning Engineering","authors":"Chan et al.","year":2024,"organisation":"OpenAI","paper_url":"https://arxiv.org/abs/2410.07095","category":"Dangerous capabilities and agentic evaluation","core_claim":"Across 75 Kaggle competitions graded against the public human leaderboards, the best setup (o1-preview with the open-source AIDE scaffold, one A10 GPU and 24 hours per competition) earned at least a bronze medal in 16.9% of competitions, rising to 34.1% when the best of eight attempts counted. The authors found no link between a model's familiarity with a competition and its score, which suggests limited contamination effects.","claim_types":["magnitude","ranking"],"original_models":["o1-preview","GPT-4o (gpt-4o-2024-08-06)","Claude 3.5 Sonnet (claude-3-5-sonnet-20240620)","Llama 3.1 405B Instruct"],"model_access":"mixed","models_still_available":"partly","code_url":"https://github.com/openai/mle-bench","data_url":"","tooling":"MLE-bench harness with Docker and the Kaggle API; AIDE, MLAB and OpenHands scaffolds","compute_tier":"T3","compute_note":"One seed over all 75 competitions is about 1,800 A10 GPU-hours plus model API costs; the 22-competition lite split brings a single seed nearer the T2 range.","difficulty":"advanced","replication_status":"replicated","replications":[{"title":"AI Research Agents for Machine Learning: Search, Exploration, and Generalization in MLE-bench","url":"https://arxiv.org/abs/2507.02554","by":"Toledo et al. (FAIR at Meta and collaborators)","year":2025,"outcome":"replicated","summary":"Re-running AIDE with o1-preview on the 22-competition lite split in its own infrastructure gave a 45.9% medal rate against 35.2% previously reported, and the team documented high seed variance and overfitting from validation to test scores."}],"replication_search_limited":true,"languages_tested":"English only","multilingual_port":"Competition descriptions are translatable but data, code and grading are language-neutral, so a port tests instruction comprehension only, unless Turkish-language competitions (for example Turkish text classification) are added.","why_it_matters":"It is a widely used benchmark for autonomous machine learning engineering, one ingredient of automated AI research.","pitfalls":"Medal rates move with infrastructure, hardware, time limits and seed count (the same agent gained about ten points in Meta's harness), and some competitions may still appear in pre-training data despite the paper's null contamination result.","replication_ideas":["Run AIDE with one open-weight model on the lite split with five seeds per competition and report medal-rate variance and the validation-to-test gap.","Compare medal rates for the same agent under 12-hour and 24-hour limits to measure sensitivity to the time budget."],"tags":["agents","ai r&d","autonomy","kaggle","ml engineering"],"_lang":"en"},{"id":"re-bench-2024","short_name":"RE-Bench 2024","title":"RE-Bench: Evaluating frontier AI R&D capabilities of language model agents against human experts","authors":"Wijk et al.","year":2024,"organisation":"METR","paper_url":"https://arxiv.org/abs/2411.15114","category":"Dangerous capabilities and agentic evaluation","core_claim":"On seven open-ended machine learning research-engineering environments, the best agents (built on Claude 3.5 Sonnet and o1-preview) scored about four times higher than human experts when both had two hours, but humans narrowly led at eight hours and scored about twice the best agent with a 32-hour total budget. Human results came from 71 eight-hour attempts by 61 experts, and agents generated and tested solutions more than ten times faster than humans.","claim_types":["magnitude","ranking"],"original_models":["Claude 3.5 Sonnet (claude-3-5-sonnet-20241022)","Claude 3.5 Sonnet (claude-3-5-sonnet-20240620)","o1-preview"],"model_access":"API-only","models_still_available":"partly","code_url":"https://github.com/METR/RE-Bench","data_url":"","tooling":"METR Task Standard environments on virtual machines with up to six H100 GPUs; Modular and AIDE agent scaffolds","compute_tier":"T3","compute_note":"Environments use between zero and six H100 GPUs for eight-hour attempts, so several attempts across seven tasks plus model API costs can pass $5,000 before any new human baselines.","difficulty":"advanced","replication_status":"no public replication found","replications":[{"title":"Measuring AI Ability to Complete Long Software Tasks","url":"https://arxiv.org/abs/2503.14499","by":"Kwa et al. (METR)","year":2025,"outcome":"extended","summary":"The original team folded the seven RE-Bench tasks into a 170-task suite with human baselines to estimate how agents' time horizons grow."}],"replication_search_limited":false,"languages_tested":"English only","multilingual_port":"Instructions could be translated, but the work happens in English-language Python codebases with automatic scoring, so a Turkish port would test instruction comprehension rather than research-engineering skill.","why_it_matters":"It is one of the few evaluations that compares agents directly with paid human experts on realistic AI research engineering, a central input to arguments about automated AI research and development (R&D).","pitfalls":"METR archived the repository and marked the tasks deprecated in October 2026, so environments may break as dependencies age; scores depend heavily on time budget, best-of-k selection and scaffold, and o1-preview has since been deprecated.","replication_ideas":["Re-run two of the lighter environments (for example the Triton kernel or scaling-law tasks) with a current open-weight model at 2-hour and 8-hour budgets and compare against the paper's reported human scores.","Report single-attempt score distributions alongside best-of-k results to show how much selection drives the agent advantage at short budgets."],"tags":["agents","ai r&d","autonomy","human baseline","metr","ml engineering"],"_lang":"en"},{"id":"coin-flip-safety-judges-2026","short_name":"Coin flip safety judges 2026","title":"A Coin Flip for Safety: LLM Judges Fail to Reliably Measure Adversarial Robustness","authors":"Schwinn et al.","year":2026,"organisation":"Technical University of Munich; Mila (Université de Montréal)","paper_url":"https://arxiv.org/abs/2603.06594","category":"Evaluation science and measurement","core_claim":"A human-verified audit of 6,642 harmfulness labels on outputs from four open-weight victim models under five attacks found that common safety judges (the HarmBench classifier, LlamaGuard-3, AegisGuard and JailJudge) fell to roughly coin-flip accuracy under realistic shifts, with overall accuracies of 0.51 to 0.59 on the full human-verified dataset. Many attacks looked more successful partly because they exploited judge weaknesses rather than eliciting genuinely harmful content.","claim_types":["existence","magnitude","method"],"original_models":["Gemma-3-1B (victim)","Llama-3.1-8B (victim)","Gemma 27B (victim)","Qwen-3-32B (victim)","HarmBench Llama-2-13B classifier (judge)","LlamaGuard-3 (judge)","AegisGuard (judge)","JailJudge (judge)"],"model_access":"open-weight","models_still_available":"yes","code_url":"https://github.com/SchwinnL/LLMJudgeReliability","data_url":"https://github.com/SchwinnL/LLMJudgeReliability","tooling":"Python with open-weight judge and victim models; labelled data, ReliableBench and JudgeStressTest released as CSV files","compute_tier":"T1","compute_note":"Re-scoring the released labelled generations with several open judges fits on one GPU, while regenerating the attack outputs on 1B to 32B victim models costs more.","difficulty":"starter","replication_status":"no public replication found","replications":[{"title":"An Empirical Measurement of Jailbreaking Evaluators","url":"https://arxiv.org/abs/2609.10594","by":"Yujie Mu","year":2026,"outcome":"extended","summary":"Compared six jailbreak evaluators on shared human-labelled data with a common judge backbone and found JADES agreed best with humans, with HarmBench and StrongREJECT also performing well, so reliability depends strongly on evaluator and data."},{"title":"When Verifiers Disagree: Measuring Specification Sensitivity in Jailbreak Evaluation","url":"https://neurips.cc/virtual/2026/168234","by":"Arellano et al.","year":2026,"outcome":"extended","summary":"A workshop study showing that, with responses held fixed, rubric changes alone moved jailbreak success rates by a median 26.7 percentage points and neutral prompt rephrasings flipped up to 43% of verdicts."}],"replication_search_limited":true,"languages_tested":"English only","multilingual_port":"Judges that falter on shifted English outputs are likely to falter further on Turkish ones; a port would translate a stratified sample of the labelled generations or collect Turkish attack outputs, label them with Turkish-speaking annotators and measure the extra drop in accuracy.","why_it_matters":"Attack and defence papers report success rates scored by LLM judges, so if judges fail under distribution shift, many robustness comparisons in the jailbreak literature are unreliable.","pitfalls":"Only outputs that the StrongREJECT judge flagged as harmful were sent for human labelling, which shapes the label distribution; the paper also reports some inconsistent figures (6,642 versus 6,442 labels, and 70% versus 53% on ReliableBench), so work from the released CSV files.","replication_ideas":["Re-score the released JudgeStressTest set with two current open-weight guard models and report accuracy by victim model and attack type against the paper's judges.","Build a 300-item Turkish counterpart of ReliableBench with native-speaker labels and compare judge accuracy with the English set."],"tags":["jailbreak evaluation","llm-as-a-judge","measurement validity","red teaming","safety judges"],"_lang":"en"},{"id":"llm-economics-reproduction-2026","short_name":"LLM economics reproduction 2026","title":"An LLM Workflow That Reproduces, Improves, and Extends Published Economics Research","authors":"Schwartz, Andrews and Shapiro","year":2026,"organisation":"National Bureau of Economic Research (NBER) working paper","paper_url":"https://www.nber.org/papers/w35782","category":"Evaluation science and measurement","core_claim":"A multi-agent large language model (LLM) workflow run over 4,452 replication packages from five leading economics journals attempted reproduction for 87.6% of them, fully reproduced 11.2% at the article's reported precision and flagged discrepancies in 3,460 articles or their appendices. It also re-implemented analyses to cut computation time more than tenfold in 496 articles and built new extensions in 923.","claim_types":["prevalence","magnitude","method"],"original_models":["Not named in the paper for the reproduction workflow"],"model_access":"API-only","models_still_available":"unknown","code_url":"","data_url":"","tooling":"Multi-agent LLM workflow with an adversarial checking agent; original statistical software where licences allowed","compute_tier":"T2","compute_note":"One package is cheap to process, but a faithful core replication over hundreds of packages needs heavy API use and licensed statistical software.","difficulty":"advanced","replication_status":"no public replication found","replications":[],"replication_search_limited":true,"languages_tested":"English only","multilingual_port":"Language plays little role because inputs are code and data; the transferable question is whether a similar workflow can audit AI safety papers' released eval code, where model outputs and sampling, not the code language, are the hard part.","why_it_matters":"It is a very large-scale test of AI-driven reproduction and a template for automated replication audits that AI safety groups could run on released eval code.","pitfalls":"Discrepancy flags were checked by an adversarial LLM agent and by re-runs in original software, not by a reported manual audit, so the share of flags that are genuine errors is unknown; the workflow code was not yet public as of October 2026.","replication_ideas":["Once the workflow and outputs are released, hand-audit a random sample of 30 flagged discrepancies to estimate the false-flag rate.","Apply a comparable reproduce-and-flag loop to 20 AI safety papers with released eval code and compare automated flags with manual checks."],"tags":["automated reproduction","economics","llm agents","metascience","replication packages"],"_lang":"en"},{"id":"i4r-ai-teams-reproducibility-2025","short_name":"I4R AI teams trial 2025","title":"Comparing Human-Only, AI-Assisted, and AI-Led Teams on Assessing Research Reproducibility in Quantitative Social Science","authors":"Brodeur et al.","year":2025,"organisation":"Institute for Replication (I4R)","paper_url":"https://econpapers.repec.org/paper/zbwi4rdps/195.htm","category":"Evaluation science and measurement","core_claim":"In a randomised trial, 288 researchers in 103 teams tried to computationally reproduce published social science results as human-only, AI-assisted (ChatGPT) or lightly supervised AI-led teams. Human-only and AI-assisted teams reproduced results at similar rates, but AI-led teams succeeded 57 percentage points less often than human-only teams, and human-only teams found more major errors than either AI condition (0.7 more per team than AI-assisted and 1.1 more than AI-led).","claim_types":["magnitude","ranking"],"original_models":["ChatGPT (version not stated in the abstract)"],"model_access":"API-only","models_still_available":"unknown","code_url":"","data_url":"","tooling":"Human-subject randomised controlled trial; ChatGPT as assistant or lead","compute_tier":"T0","compute_note":"Model costs are trivial; the real cost is recruiting and coordinating dozens of researcher teams.","difficulty":"advanced","replication_status":"no public replication found","replications":[{"title":"Read the Paper, Write the Code: Agentic Reproduction of Social-Science Results","url":"https://arxiv.org/abs/2604.21965","by":"Kohler, Zollikofer, Einsiedler, Hoyle and Ash","year":2026,"outcome":"extended","summary":"An independent agentic system tested with four scaffolds and four models reproduced results of 48 human-verified papers from methods text and data alone, largely recovering published results but varying widely by model, scaffold and paper."},{"title":"An LLM Workflow That Reproduces, Improves, and Extends Published Economics Research","url":"https://www.nber.org/papers/w35782","by":"Schwartz, Andrews and Shapiro","year":2026,"outcome":"extended","summary":"An LLM workflow audited 4,452 economics replication packages, fully reproducing 11.2% at reported precision and flagging discrepancies in 3,460 articles, with no human-team comparison."}],"replication_search_limited":true,"languages_tested":"English only","multilingual_port":"The task is mostly language-neutral (code and data); a port matters only if teams work with Turkish-language papers or prompt the AI in Turkish, which could change AI-led performance.","why_it_matters":"It is rare randomised evidence on how far current AI can be trusted to verify published research, which bears directly on plans to automate replication and evaluation work.","pitfalls":"Results are tied to the AI tools available at the time and to reproduction from original code and data; the AI-led gap mixes model capability with workflow design, and the study was later published in PNAS (2026) under a revised title, so cite the version you use.","replication_ideas":["Re-run the AI-led arm on a subset of the same articles with a current agentic coding tool and compare reproduction and error-detection rates with the published AI-led results.","At an AI safety replication sprint, randomise matched teams to work with or without AI assistance on reproducing the same open-weight eval result, and compare success and error detection."],"tags":["ai assistance","metascience","randomised controlled trial","reproducibility","social science"],"_lang":"en"},{"id":"turkish-benchmark-quality-2025","short_name":"Turkish benchmark quality 2025","title":"Evaluating the Quality of Benchmark Datasets for Low-Resource Languages: A Case Study on Turkish","authors":"Cengiz et al.","year":2025,"organisation":"Turkcell AI; Middle East Technical University; Hacettepe University; Istanbul University; Bilkent University","paper_url":"https://arxiv.org/abs/2504.09714","category":"Evaluation science and measurement","core_claim":"Thirty-one annotators, three per item, rated 100 samples from each of 17 commonly used Turkish benchmark datasets (most translated or adapted from English, including the offensive-language set OffensEval-TR 2020) against six quality criteria; 70% of the datasets fell below the authors' heuristic quality standard and 85% of criteria were unmet overall. Large language model (LLM) judges (Llama-3.3-70B-Instruct, Gemma-2-27B-it and GPT-4o) were less reliable than human annotators, especially on cultural common-sense knowledge.","claim_types":["prevalence","ranking"],"original_models":["Llama-3.3-70B-Instruct","Gemma-2-27B-it","GPT-4o"],"model_access":"mixed","models_still_available":"unknown","code_url":"https://github.com/metunlp/llmevaluation","data_url":"https://github.com/metunlp/llmevaluation","tooling":"Human annotation with majority vote; large language model (LLM) judge prompts; robust kappa scripts","compute_tier":"T1","compute_note":"Judge calls on about 1,700 samples are cheap; the main cost is paying native-speaker annotators.","difficulty":"intermediate","replication_status":"no public replication found","replications":[{"title":"TurkBench: A Benchmark for Evaluating Turkish Large Language Models","url":"https://arxiv.org/abs/2601.07020","by":"Toraman et al.","year":2026,"outcome":"extended","summary":"An overlapping author team released an 8,151-sample Turkish benchmark across 21 subtasks, including content moderation, as a follow-up evaluation resource."}],"replication_search_limited":true,"languages_tested":"Turkish","multilingual_port":"The six criteria and annotator guidelines can be reused for another language's benchmarks, but criteria such as cultural common-sense compliance need annotators from that culture, and language-model judges were weakest exactly there.","why_it_matters":"It shows that many Turkish benchmarks, including translated ones, are of doubtful quality, a warning for any Turkish safety evaluation built from translated English data.","pitfalls":"The pass threshold is a heuristic set by the authors, each dataset is judged from only 100 random samples, and the repository shows guidelines, judge prompts and kappa scripts but no visible annotation-data folder.","replication_ideas":["Apply the six-criterion protocol, with three annotators per item, to a translated Turkish safety set such as a Turkish version of MultiJail or XSafety-style prompts","Test whether a current open-weight judge agrees with the released human guidelines better than the three original judges did"],"tags":["annotation","benchmark-quality","evaluation-science","llm-as-judge","translation","turkish"],"_lang":"multi"},{"id":"measuring-what-matters-2025","short_name":"Measuring what matters 2025","title":"Measuring what Matters: Construct Validity in Large Language Model Benchmarks","authors":"Bean et al.","year":2025,"organisation":"University of Oxford (Oxford Internet Institute), with EPFL, Yale University and others","paper_url":"https://arxiv.org/abs/2511.04703","category":"Evaluation science and measurement","core_claim":"A systematic review of 445 large language model (LLM) benchmarks from leading natural language processing (NLP) and machine learning venues, coded by 29 expert reviewers, found widespread construct validity weaknesses: 47.8% of the phenomenon definitions benchmarks gave were contested, only 16.0% of benchmarks used uncertainty estimates or statistical tests, 27.0% relied at least partly on convenience sampling and 38.2% reused data from earlier benchmarks or exams. The authors turn the findings into eight recommendations and a checklist for benchmark builders.","claim_types":["prevalence","method"],"original_models":["Not applicable (systematic review of benchmark papers)"],"model_access":"mixed","models_still_available":"unknown","code_url":"https://github.com/am-bean/benchmark_review","data_url":"https://huggingface.co/datasets/ambean/construct-validity-review","tooling":"Structured codebook with manual annotation; Python code and notebooks for analysis","compute_tier":"T0","compute_note":"No model compute is needed: a replication re-codes a sample of benchmark papers with the released codebook.","difficulty":"intermediate","replication_status":"no public replication found","replications":[],"replication_search_limited":true,"languages_tested":"Not applicable (review of benchmark papers)","multilingual_port":"The codebook applies unchanged to Turkish and multilingual benchmarks; a port would code Turkish-language safety benchmarks to see whether translated benchmarks inherit the original's construct problems or add new ones, such as cultural mismatch.","why_it_matters":"It is broad systematic evidence (445 benchmarks) that benchmark claims about abstract properties such as safety and robustness often rest on weak measurement, and it supplies a practical checklist for building better evals.","pitfalls":"Coding involves judgement, so a re-coding study must report inter-rater agreement; some figures use different definitions within the paper (31.2% versus 47.5% for synthetic or LLM-generated data), so check which definition you compare against.","replication_ideas":["Independently re-code a random sample of 40 reviewed benchmarks with the released codebook and report agreement with the original codes.","Apply the codebook to safety and dangerous-capability benchmarks released after the review's cut-off and compare prevalence rates with the original sample."],"tags":["benchmarks","checklist","construct validity","measurement","systematic review"],"_lang":"na"},{"id":"error-bars-evals-2024","short_name":"Error bars evals 2024","title":"Adding Error Bars to Evals: A Statistical Approach to Language Model Evaluations","authors":"Miller","year":2024,"organisation":"Anthropic","paper_url":"https://arxiv.org/abs/2411.00640","category":"Evaluation science and measurement","core_claim":"Treating eval questions as a sample from a wider population, the paper gives formulas for standard errors, model comparisons and power analysis, and shows that ignoring clusters of related questions understates uncertainty: for Anthropic models, clustered standard errors were about 3 times the naive ones on DROP and 1.9 times on MGSM. It recommends clustered errors, resampling answers, paired question-level comparisons and power analysis, and advises against lowering sampling temperature to reduce variance.","claim_types":["method","magnitude"],"original_models":["Anthropic models (not individually named in the results tables)"],"model_access":"API-only","models_still_available":"unknown","code_url":"","data_url":"","tooling":"Closed-form statistics on per-question scores from any eval harness","compute_tier":"T0","compute_note":"Needs only per-question scores from existing eval runs and a standard statistics library.","difficulty":"starter","replication_status":"conditional","replications":[{"title":"Position: Don't Use the CLT in LLM Evals With Fewer Than a Few Hundred Datapoints","url":"https://arxiv.org/abs/2503.01747","by":"Bowyer, Aitchison and Ivanova","year":2025,"outcome":"conditional","summary":"Simulations show that the central limit theorem (CLT) intervals Miller recommends cover too rarely on small benchmarks (92.5% coverage for a nominal 95% at 100 items), while Bayesian or Wilson intervals hold their coverage there."}],"replication_search_limited":false,"languages_tested":"Not language-specific; worked examples use English benchmarks and the multilingual MGSM","multilingual_port":"The method transfers unchanged; translated benchmarks create natural clusters (the same item in several languages), so clustered standard errors are the right way to report Turkish versus English gaps.","why_it_matters":"It is a common reference for attaching confidence intervals to language model eval scores, which decides whether reported safety and capability differences between models are real.","pitfalls":"Central limit theorem (CLT) intervals are too narrow below a few hundred items, which covers many safety evals; the clustering unit must be chosen correctly, and the empirical tables use unnamed Anthropic models, so their exact numbers cannot be reproduced.","replication_ideas":["Recompute naive, clustered and Bayesian intervals for a public safety benchmark with grouped items using an open model's per-item outputs, and count how many pairwise model rankings lose significance.","Simulate the coverage of the recommended intervals at the sizes of common safety benchmarks (100 to 500 items)."],"tags":["confidence intervals","error bars","eval methodology","power analysis","statistics"],"_lang":"na"},{"id":"safetywashing-2024","short_name":"Safetywashing 2024","title":"Safetywashing: Do AI Safety Benchmarks Actually Measure Safety Progress?","authors":"Ren et al.","year":2024,"organisation":"Center for AI Safety","paper_url":"https://arxiv.org/abs/2407.21792","category":"Evaluation science and measurement","core_claim":"Correlating safety benchmark scores with a capabilities score (the first principal component of 12 capability benchmarks across 27 base and 26 chat models), the authors find that many safety benchmarks largely track general capability and training compute: MT-Bench, TruthfulQA MC1, ETHICS and GPQA correlated with the capabilities score at roughly 78% to 82%. Others, such as most bias benchmarks, were only weakly correlated, so gains on the first group can be presented as safety progress when they are mainly capability gains.","claim_types":["prevalence","method"],"original_models":["27 base language models","26 chat or instruction-tuned language models","107 vision models (63 adversarially trained, 44 standard)"],"model_access":"mixed","models_still_available":"partly","code_url":"https://github.com/centerforaisafety/safetywashing","data_url":"https://github.com/centerforaisafety/safetywashing","tooling":"Python correlation and principal component analysis on released benchmark score matrices","compute_tier":"T0","compute_note":"The core analysis is a principal component and correlation calculation on released score tables, and adding models needs only their published benchmark scores or cheap eval runs.","difficulty":"starter","replication_status":"no public replication found","replications":[{"title":"Safety, or Just Capability? A Validity Audit of Agent-Safety Benchmarks","url":"https://arxiv.org/abs/2607.28685","by":"Wang et al.","year":2026,"outcome":"extended","summary":"Independently ran a similar capability-correlation audit on four agent-safety benchmarks and found capability predicted task success but correlated negatively with misalignment safety (rho of -0.44 across 21 models), weakening to -0.16 on a 41-model panel."}],"replication_search_limited":false,"languages_tested":"English only","multilingual_port":"The method ports directly by computing a capabilities score from Turkish capability benchmarks and correlating it with Turkish safety scores; the risk is that translation noise lowers correlations for reasons unrelated to safety.","why_it_matters":"It offers a simple empirical test of whether a safety benchmark measures anything beyond general capability, which matters whenever a lab or paper reports safety gains.","pitfalls":"Correlations depend on which models are in the panel (small panels can flip signs, as Wang et al. show for agent benchmarks) and on which benchmarks define the capabilities score; a high correlation does not by itself show that a benchmark is useless for safety.","replication_ideas":["Re-run the released analysis adding 2025 to 2026 frontier and open-weight models and check whether the high-correlation benchmarks stay high.","Recompute capabilities correlations for WMDP and refusal benchmarks with leave-one-model-family-out panels to test sensitivity to panel composition."],"tags":["benchmarks","capabilities correlation","construct validity","meta-analysis","safetywashing"],"_lang":"en"},{"id":"llm-as-a-judge-mt-bench-2023","short_name":"LLM-as-a-judge 2023","title":"Judging LLM-as-a-Judge with MT-Bench and Chatbot Arena","authors":"Zheng et al.","year":2023,"organisation":"LMSYS Org (UC Berkeley and collaborators)","paper_url":"https://arxiv.org/abs/2306.05685","category":"Evaluation science and measurement","core_claim":"Using the multi-turn MT-Bench questions and crowdsourced Chatbot Arena votes, GPT-4 acting as a judge agreed with human preferences more than 80% of the time, about as often as humans agreed with each other. The authors also document position, verbosity and self-enhancement biases in LLM judges and test partial mitigations.","claim_types":["magnitude","method","existence"],"original_models":["GPT-4 (judge)","other LLM judges","LLaMA and Vicuna variants (evaluated models)"],"model_access":"mixed","models_still_available":"partly","code_url":"https://github.com/lm-sys/FastChat/tree/main/fastchat/llm_judge","data_url":"https://github.com/lm-sys/FastChat/tree/main/fastchat/llm_judge","tooling":"FastChat llm_judge scripts calling judge models through APIs","compute_tier":"T0","compute_note":"Re-judging the released MT-Bench answers with a current judge and comparing with the released expert votes costs a few dollars in API calls.","difficulty":"starter","replication_status":"conditional","replications":[{"title":"Judging the Judges: Evaluating Alignment and Vulnerabilities in LLMs-as-Judges","url":"https://arxiv.org/abs/2406.12624","by":"Thakur, Choudhary, Ramayapally, Vaidyanathan and Hupkes","year":2024,"outcome":"partial","summary":"In a setting where human graders agree closely (13 judges scoring 9 exam-taker models), only the largest judges came near human alignment and still fell well short of inter-human agreement, and high percent agreement hid large score differences."},{"title":"Know Thy Judge: On the Robustness Meta-Evaluation of LLM Safety Judges","url":"https://arxiv.org/abs/2503.04474","by":"Eiras, Zemour, Lin and Mugunthan","year":2025,"outcome":"conditional","summary":"Safety judges' false negative rates shifted by up to 0.24 with small changes in output style, and adversarial edits to outputs made some judges label every harmful output as safe."},{"title":"A Coin Flip for Safety: LLM Judges Fail to Reliably Measure Adversarial Robustness","url":"https://arxiv.org/abs/2603.06594","by":"Schwinn et al.","year":2026,"outcome":"conditional","summary":"For harmfulness scoring of red-teaming outputs, judges that look reliable on standard validation fell to near-chance accuracy under shifts in victim model, attack and behaviour ambiguity."},{"title":"When Verifiers Disagree: Measuring Specification Sensitivity in Jailbreak Evaluation","url":"https://neurips.cc/virtual/2026/168234","by":"Arellano et al.","year":2026,"outcome":"conditional","summary":"Holding responses fixed, changing only the grading rubric moved jailbreak success rates by a median 26.7 percentage points across general-purpose graders, and neutral rephrasings of the judge prompt flipped up to 43% of verdicts."}],"replication_search_limited":false,"languages_tested":"English only","multilingual_port":"Judges must be re-validated in Turkish, testing agreement with Turkish human raters, position and verbosity bias, and whether the judge prompt works better in Turkish or English. Judges may be lenient or harsh on morphologically rich Turkish text in ways that English validation will not reveal.","why_it_matters":"It is a key early source of evidence for replacing human raters with LLM judges, a practice now central to safety, refusal and capability evaluations.","pitfalls":"Agreement depends on judge model version, prompt, answer order and task type, and the original GPT-4 snapshot may behave differently from current models; percent agreement can hide systematic score shifts, so report chance-corrected agreement and swap answer positions.","replication_ideas":["Re-judge the released MT-Bench answer pairs with two current open-weight judges, swapping answer order, and report agreement with the released expert votes using Cohen's kappa.","Collect 200 Turkish human preference labels on translated MT-Bench answers and compare judge agreement in Turkish with agreement in English."],"tags":["chatbot arena","human agreement","judge bias","llm-as-a-judge","mt-bench"],"_lang":"en"},{"id":"leakage-reproducibility-2022","short_name":"Leakage reproducibility 2022","title":"Leakage and the Reproducibility Crisis in ML-based Science","authors":"Kapoor and Narayanan","year":2022,"organisation":"Princeton University","paper_url":"https://arxiv.org/abs/2207.07048","category":"Evaluation science and measurement","core_claim":"A literature survey found data leakage errors affecting 329 papers across 17 fields; the authors set out a taxonomy of eight leakage types and proposed model info sheets to catch them before publication. In a civil war prediction case study, every paper claiming that complex machine learning (ML) models beat logistic regression failed to reproduce once leakage was fixed, and the complex models were not substantially better.","claim_types":["prevalence","existence","method"],"original_models":["Complex ML models from published civil war prediction papers","Logistic regression baselines"],"model_access":"open-weight","models_still_available":"yes","code_url":"https://codeocean.com/capsule/6282482/tree/v1","data_url":"https://reproducible.cs.princeton.edu/","tooling":"Code Ocean reproduction capsule; model info sheet template","compute_tier":"T0","compute_note":"The civil war reproductions are small tabular models that run on a laptop.","difficulty":"starter","replication_status":"no public replication found","replications":[{"title":"REFORMS: Consensus-based Recommendations for Machine-learning-based Science","url":"https://reforms.cs.princeton.edu/","by":"Kapoor et al.","year":2024,"outcome":"extended","summary":"The same first author led a 19-author consensus checklist of 32 items for machine-learning-based science that builds on the leakage taxonomy and model info sheets."}],"replication_search_limited":true,"languages_tested":"Not applicable (tabular scientific prediction tasks)","multilingual_port":"Language is not a factor here; the transferable lesson for multilingual safety evals is to check for leakage between translated test items and any training or few-shot data drawn from the same source texts.","why_it_matters":"It is a widely cited reference showing that leakage routinely inflates ML results, and the same failure (test data seen during training) underlies contamination concerns about AI safety benchmarks.","pitfalls":"Paper counts change across versions (329 papers in 17 fields in the 2022 preprint, while the project page now tracks failures across 30 fields), so cite the version you check; the case-study capsule is hosted on Code Ocean rather than GitHub.","replication_ideas":["Re-run the civil war case-study capsule and extend it with a modern gradient-boosting model under the corrected, leakage-free split.","Apply the eight-type leakage taxonomy to a sample of AI safety papers that train probes or classifiers, and report how many show train-test overlap."],"tags":["contamination","leakage","ml-based science","model info sheets","reproducibility"],"_lang":"na"}],"resources":[{"id":"forrt-replication-database","name":"FORRT Replication Database (FReD)","type":"Replication programme or collection","url":"https://forrt.org/FReD","description":"A curated database of replication results in the social and behavioural sciences, coded from large replication projects and individual articles, with an online Explorer app for filtering by replicability and effect size and an Annotator that flags replication findings in a reading list. The data load through an MIT-licensed R package maintained under the Framework for Open and Reproducible Research Training (FORRT).","use_for":"A working model for a living ledger of AI safety findings: one record per original finding, linked replications, coded outcomes and effect sizes.","access":"free and open","maintainer":"FORRT (package authors Lukas Röseler, Lukas Wallrich, Helena Hartmann and Flavio Azevedo)","status":"active","multilingual_relevance":"","tags":["findings-ledger","meta-science","psychology","r-package","replication-database"]},{"id":"institute-for-replication","name":"Institute for Replication (I4R)","type":"Replication programme or collection","url":"https://i4replication.org/","description":"An international organisation that checks published social science, mainly economics, through one-day team replication games and a discussion paper series of more than 230 reproduction reports. It has also run AI replication games comparing human-only, AI-assisted and AI-led teams (see the I4R AI teams trial among the studies).","use_for":"A tested format for running one-day replication events, plus evidence on how far to trust AI coding agents in replication work.","access":"free and open","maintainer":"Institute for Replication (chaired by Abel Brodeur)","status":"active","multilingual_relevance":"","tags":["ai-assisted-replication","events","meta-science","replication-games","social-science"]},{"id":"ml-reproducibility-challenge","name":"Machine Learning Reproducibility Challenge (MLRC)","type":"Replication programme or collection","url":"https://reproml.org/","description":"An annual challenge, in its ninth edition in 2026, that collects reproductions, replications and generalisability studies of machine learning papers, peer-reviewed through Transactions on Machine Learning Research (TMLR). In 2026 it became an official NeurIPS track, with accepted papers presented at NeurIPS 2026 in Sydney.","use_for":"A peer-reviewed venue with established reporting norms for publishing an AI safety replication, including failed or partial ones; check the site for the next cycle's deadlines.","access":"free and open","maintainer":"MLRC organising committee (Koustuv Sinha, Jessica Forde, Joelle Pineau and others)","status":"active","multilingual_relevance":"","tags":["neurips","publication-venue","reproducibility","tmlr"]},{"id":"second-look-research","name":"Second Look Research","type":"Replication programme or collection","url":"https://secondlookresearch.com/","description":"A replication group at the University of Chicago Existential Risk Laboratory (XLab) that re-implements load-bearing empirical AI safety papers, often on newer models, and publishes short write-ups with open code, mostly on LessWrong. It runs a part-time Fall 2026 stream through SPAR (Research Program for AI Risks).","use_for":"Check whether a target paper has already been replicated, and borrow its paper-selection criteria (narrative influence, research dependence, vulnerability to non-replication, difficulty, recency) and write-up format.","access":"free and open","maintainer":"University of Chicago Existential Risk Laboratory (XLab); led by Zephaniah Roe and Yixiong Hao","status":"active","multilingual_relevance":"","tags":["ai-safety","fellowship","lesswrong","open-source-code","replication","uchicago"]},{"id":"aisi-elicitation-protocol","name":"A structured protocol for elicitation experiments","type":"Methodology guide or checklist","url":"https://www.aisi.gov.uk/blog/our-approach-to-ai-capability-elicitation","description":"A July 2025 post from the UK AI Security Institute (AISI) describing how its Science of Evaluations team standardised elicitation experiments, with a linked best-practice checklist. Steps include establishing an appropriate baseline, identifying a specific analysis type, running a pilot, guarding against data leakage and reporting negative as well as positive results.","use_for":"A ready protocol for experiments that test whether a technique (agent scaffolding, best-of-n sampling, tool access) changes a published result.","access":"free and open","maintainer":"UK AI Security Institute","status":"active","multilingual_relevance":"","tags":["aisi","elicitation","pre-specification","protocol"]},{"id":"agentic-benchmark-checklist","name":"Agentic Benchmark Checklist (ABC)","type":"Methodology guide or checklist","url":"https://arxiv.org/abs/2507.02825","description":"A checklist for building and auditing agentic benchmarks, drawn from the authors' experience, published best practice and previously reported issues; applying it, they found flaws such as too few test cases in SWE-bench Verified and empty responses counted as successes in TAU-bench.","use_for":"Auditing an agent benchmark before replicating results on it, since flawed task setup or grading can shift measured performance by up to 100% in relative terms.","access":"free and open","maintainer":"Zhu et al. (paper authors)","status":"unknown","multilingual_relevance":"","tags":["agentic benchmarks","agents","benchmark validity","checklist","reward design"]},{"id":"network-automated-evaluation-best-practice","name":"Best Practice: Automated Evaluation of Large Language Models","type":"Methodology guide or checklist","url":"https://www.aisi.gov.uk/blog/international-evaluation-best-practice-and-open-questions-in-ai-measurement","description":"The first best-practice guidance (2026) from the International Network for Advanced AI Measurement, Evaluation and Science, formerly the International Network of AI Safety Institutes, covering evaluation objectives, comparability of inference settings and scoring, iterative elicitation, and logging. It recommends versioned evaluations, standard frameworks such as Inspect, full task and judge logs, and uncertainty estimates.","use_for":"A reporting checklist for replications: record sampling parameters, reasoning effort, provider and serving details, model version, code commit and safeguard settings so others can tell why results differ.","access":"free and open","maintainer":"International Network for Advanced AI Measurement, Evaluation and Science (published via the UK AI Security Institute)","status":"active","multilingual_relevance":"The guidance does not cover multilingual evaluation, so translation and judge-language choices need their own documentation.","tags":["best-practice","inference-settings","international-network","logging","reproducibility"]},{"id":"betterbench","name":"BetterBench","type":"Methodology guide or checklist","url":"https://betterbench.stanford.edu/","description":"A Stanford assessment framework of 46 benchmark-quality criteria applied to 24 widely used AI benchmarks, with a searchable living repository of assessments and a checklist of minimum standards for benchmark developers.","use_for":"Checking a benchmark's design, documentation and reproducibility before choosing it as a replication target.","access":"free and open","maintainer":"Stanford University (Reuel et al.)","status":"active","multilingual_relevance":"","tags":["benchmark quality","checklist","evaluation methodology","reproducibility"]},{"id":"cot-monitorability-position-2025","name":"Chain of Thought Monitorability: A New and Fragile Opportunity for AI Safety","type":"Methodology guide or checklist","url":"https://arxiv.org/abs/2507.11473","description":"Position paper by 41 authors from AI labs and safety research groups arguing that monitoring models' natural-language reasoning is a useful but fragile safety layer, with open research questions and recommendations for developers.","use_for":"Deciding which monitorability properties to measure, and why, before replicating chain-of-thought faithfulness or monitoring results.","access":"free and open","maintainer":"Korbak, Balesni and 39 co-authors","status":"active","multilingual_relevance":"Written with English reasoning in mind; whether its monitorability assumptions hold when models reason in other languages is an open question that Turkish experiments could address.","tags":["cot-monitoring","monitorability","position-paper","research-agenda"]},{"id":"anthropic-challenges-evaluating-ai-systems","name":"Challenges in evaluating AI systems","type":"Methodology guide or checklist","url":"https://www.anthropic.com/research/evaluating-ai-systems","description":"An October 2023 Anthropic essay on practical problems met when running benchmarks such as Massive Multitask Language Understanding (MMLU), the Bias Benchmark for Question Answering (BBQ), BIG-bench and HELM, as well as human A/B tests, red teaming and model-written evaluations. Examples include formatting changes moving MMLU accuracy by about five points, and a bias benchmark scoring zero bias only because the model was not answering the questions.","use_for":"A list of implementation traps (prompt format, few-shot settings, refusals that look like safe behaviour, contamination, faulty items) to rule out before blaming the model for a replication gap.","access":"free and open","maintainer":"Anthropic","status":"active","multilingual_relevance":"","tags":["anthropic","benchmarks","evaluation-pitfalls","prompt-format"]},{"id":"metr-capability-elicitation-guidelines","name":"Guidelines for capability elicitation","type":"Methodology guide or checklist","url":"https://metr.org/blog/2024-03-15-guidelines-for-capability-elicitation/","description":"Guidance from METR (Model Evaluation and Threat Research), March 2024, on how much effort to spend drawing out an agent's capabilities before reporting a score: fix spurious failures, iterate on a development set, and watch for red flags such as high run-to-run variance or dropped runs. The authors describe it as reasoned but not fully tested.","use_for":"Helps judge whether a lower score in a replication reflects the model or weaker elicitation (scaffolding, tools, prompting) than the original study used.","access":"free and open","maintainer":"METR","status":"active","multilingual_relevance":"","tags":["agents","capability-evaluation","elicitation","metr"]},{"id":"lessons-from-the-trenches","name":"Lessons from the Trenches on Reproducible Evaluation of Language Models","type":"Methodology guide or checklist","url":"https://arxiv.org/abs/2405.14782","description":"A practitioner guide from the developers of the lm-evaluation-harness (Biderman et al., 30 authors) on why language model evaluation results are hard to reproduce, with recommended practices drawn from three years of harness development.","use_for":"Guidance on which implementation details to pin down and report when re-running a published benchmark result.","access":"free and open","maintainer":"EleutherAI and collaborators (Biderman et al.)","status":"active","multilingual_relevance":"","tags":["best practices","evaluation methodology","lm-evaluation-harness","reproducibility"]},{"id":"neurips-paper-checklist","name":"NeurIPS Paper Checklist","type":"Methodology guide or checklist","url":"https://neurips.cc/public/guides/PaperChecklist","description":"The 16-question checklist required for NeurIPS 2026 submissions, covering claims and limitations, reproducibility, open code and data, experimental details, error bars, compute, safeguards, licences and use of large language models (LLMs). Submissions without it are desk-rejected.","use_for":"Audit what an original paper disclosed and omitted before scoping a replication, and structure the replication write-up.","access":"free and open","maintainer":"NeurIPS (Conference on Neural Information Processing Systems)","status":"active","multilingual_relevance":"","tags":["error-bars","neurips","reporting-checklist","reproducibility"]},{"id":"principles-meta-science-ai-safety-replications","name":"Principles for Meta-Science and AI Safety Replications","type":"Methodology guide or checklist","url":"https://www.lesswrong.com/posts/8qytxHWzSsdsyTfmZ/principles-for-meta-science-and-ai-safety-replications","description":"A January 2026 LessWrong post by Zephaniah Roe setting out norms for an AI safety replication team: replication is not vindication, re-implement from scratch rather than rerun the authors' code, treat failed replications as findings, and publish author responses alongside results. It also lists criteria for choosing which papers to replicate.","use_for":"A short charter to adopt or adapt when setting up a replication programme or scoping a single replication.","access":"free and open","maintainer":"Zephaniah Roe","status":"active","multilingual_relevance":"","tags":["lesswrong","meta-science","paper-selection","replication-norms"]},{"id":"reforms-checklist","name":"REFORMS: Consensus-based Recommendations for Machine-learning-based Science","type":"Methodology guide or checklist","url":"https://reforms.cs.princeton.edu/","description":"A consensus checklist of 32 items in eight sections, written by 19 researchers across fields and published in Science Advances in 2024, for reporting and reviewing machine-learning-based scientific studies.","use_for":"Structuring a replication report so that data splits, leakage checks and evaluation choices are documented and reviewable.","access":"free and open","maintainer":"Princeton University (Kapoor et al.)","status":"active","multilingual_relevance":"","tags":["checklist","leakage","ml-based science","reporting standards","reproducibility"]},{"id":"multilingual-safety-survey-2025","name":"The State of Multilingual LLM Safety Research: From Measuring the Language Gap to Mitigating It","type":"Methodology guide or checklist","url":"https://arxiv.org/abs/2505.24119","description":"A systematic review of nearly 300 safety papers from *ACL venues published from 2020 to 2024, showing that large language model (LLM) safety research covers non-English languages far less than English and that English-only papers often do not state which languages they tested. It ends with recommendations and three research directions: multilingual safety evaluation, training data generation and cross-lingual safety generalisation.","use_for":"Scoping a multilingual replication: it maps which languages and safety questions are under-studied and which reporting habits to avoid.","access":"free and open","maintainer":"Zheng-Xin Yong, Beyza Ermis, Marzieh Fadaee, Stephen H. Bach and Julia Kreutzer","status":"active","multilingual_relevance":"Core reference on the language gap in LLM safety research.","tags":["language-gap","multilingual-safety","reporting-practice","research-agenda","survey"]},{"id":"apollo-science-of-evals","name":"We Need A 'Science of Evals'","type":"Methodology guide or checklist","url":"https://www.apolloresearch.ai/blog/we-need-a-science-of-evals","description":"A January 2024 Apollo Research post arguing that model evaluations are still more craft than science: results shift with prompt wording, and a negative result cannot show that a capability is absent. It proposes maturity stages modelled on aviation and lists questions on coverage, robustness, reproducibility and statistical confidence.","use_for":"Frames which properties (prompt sensitivity, elicitation strength, statistics, construct clarity) a replication should vary and report rather than hold fixed.","access":"free and open","maintainer":"Apollo Research","status":"active","multilingual_relevance":"","tags":["apollo-research","elicitation","prompt-sensitivity","science-of-evals"]},{"id":"agentic-misalignment-framework","name":"agentic-misalignment research framework","type":"Evaluation framework or harness","url":"https://github.com/anthropic-experimental/agentic-misalignment","description":"Anthropic's MIT-licensed code for the agentic misalignment study, which generates three fictional scenarios (blackmail, information leaking and a lethal-action scenario) across goal and urgency conditions, runs them against models from several providers, and classifies responses for harmful behaviour.","use_for":"Re-running or extending the agentic misalignment experiments on new models, including open-weight models via Together or OpenRouter, with the original prompts and classifiers.","access":"free and open","maintainer":"Anthropic (anthropic-experimental GitHub organisation)","status":"unknown","multilingual_relevance":"Scenarios are English and set in a US company; a Turkish port needs localisation and classifier validation.","tags":["agentic misalignment","api","blackmail","evaluation harness","insider threat"]},{"id":"bloom","name":"Bloom (Petri Bloom)","type":"Evaluation framework or harness","url":"https://meridianlabs-ai.github.io/petri_bloom/","description":"An open-source tool that turns a written behaviour description into a generated set of evaluation scenarios, runs them against a target model and scores the behaviour with a judge model. Anthropic released it in 2025; development has moved to Meridian Labs, where it runs on the Petri framework, and the original safety-research repository is frozen.","use_for":"Build targeted, re-runnable frequency estimates for a behaviour reported in a study, such as sycophancy or self-preservation, across several models.","access":"free and open","maintainer":"Meridian Labs (originally Anthropic)","status":"active","multilingual_relevance":"","tags":["automated-evals","behavioural-evaluation","elicitation-rate","meridian-labs"]},{"id":"controlarena","name":"ControlArena","type":"Evaluation framework or harness","url":"https://github.com/UKGovernmentBEIS/control-arena","description":"Open-source library built on Inspect AI for running AI control experiments, with settings such as APPS programming, Bash tasks from the Ctrl-Z paper and BashArena, plus monitors, micro-protocols and analysis tools.","use_for":"Re-running AI control and resampling-protocol experiments (APPS backdooring, BashBench) without rebuilding the environments, as Terekhov et al. did in 2025.","access":"free and open","maintainer":"UK AI Security Institute and Redwood Research","status":"active","multilingual_relevance":"","tags":["agents","ai-control","evaluation-harness","inspect","monitoring"]},{"id":"garak","name":"garak","type":"Evaluation framework or harness","url":"https://github.com/NVIDIA/garak","description":"NVIDIA's open-source (Apache 2.0) large language model (LLM) vulnerability scanner, the Generative AI Red-teaming and Assessment Kit, which runs probes for jailbreaks, prompt injection, data leakage, toxicity and similar failures against many model back-ends and scores them with paired detectors. Version 0.17.1 was released in October 2026.","use_for":"Quick, repeatable baseline scans when replicating jailbreak or prompt-injection results on new models.","access":"free and open","maintainer":"NVIDIA (created by Leon Derczynski)","status":"active","multilingual_relevance":"Check how probes and detectors behave on non-English text before porting a scan to another language.","tags":["jailbreaks","nvidia","red-teaming","vulnerability-scanner"]},{"id":"helm","name":"Holistic Evaluation of Language Models (HELM)","type":"Evaluation framework or harness","url":"https://crfm.stanford.edu/helm/","description":"An open-source (Apache 2.0) evaluation framework and set of public leaderboards, including HELM Capabilities and HELM Safety, from the Stanford Center for Research on Foundation Models (CRFM), with evaluation data and results freely available on the site. HELM entered maintenance mode on 1 June 2026: volunteers fix significant bugs on a best-effort basis, but no new features or leaderboard evaluations will be added.","use_for":"Inspect the setup and data behind past leaderboard scores; for new evaluations its maintainers point to alternatives such as Inspect Evals and lm-evaluation-harness.","access":"free and open","maintainer":"Stanford Center for Research on Foundation Models (CRFM)","status":"active","multilingual_relevance":"","tags":["evaluation-framework","leaderboard","maintenance-mode","stanford"]},{"id":"inspect-ai","name":"Inspect","type":"Evaluation framework or harness","url":"https://inspect.aisi.org.uk/","description":"An open-source (MIT) Python framework for large language model (LLM) evaluations, with composable solvers and scorers, agents, sandboxed tool execution (Docker, Kubernetes, Modal and others), a log viewer, built-in support for over 20 model providers and local inference through Hugging Face, vLLM and SGLang. It is developed by the UK AI Security Institute and Meridian Labs, which also maintain the companion transcript-analysis tool Scout.","use_for":"Define a task once, run it across API and open-weight models, and keep full per-sample logs, as international evaluation best-practice guidance recommends.","access":"free and open","maintainer":"UK AI Security Institute and Meridian Labs","status":"active","multilingual_relevance":"Model-agnostic, so translated datasets can be swapped in; model-graded scorers and judge prompts need checking in the target language.","tags":["agents","aisi","evaluation-harness","logging","python","sandboxing"]},{"id":"inspect-evals","name":"Inspect Evals","type":"Evaluation framework or harness","url":"https://ukgovernmentbeis.github.io/inspect_evals/","description":"An open registry of about 185 ready-to-run evaluations built on Inspect, covering safeguards, scheming and misalignment (for example Alignment Faking and Agentic Misalignment), cybersecurity, agents, knowledge, reasoning, bias and honesty. Founded in 2024 with contributions from the UK AI Security Institute, Arcadia Impact and the Vector Institute, it is now maintained by Generality Labs.","use_for":"Check whether an Inspect implementation of a target study already exists before building one, and register your own port for others to reuse.","access":"free and open","maintainer":"Generality Labs (founding contributors: UK AI Security Institute, Arcadia Impact, Vector Institute)","status":"active","multilingual_relevance":"Check each evaluation's dataset language before reuse; a translated port usually means swapping the dataset and re-validating any model-graded scorer.","tags":["benchmarks","eval-registry","inspect","ready-to-run"]},{"id":"lm-evaluation-harness","name":"Language Model Evaluation Harness (lm-evaluation-harness)","type":"Evaluation framework or harness","url":"https://github.com/EleutherAI/lm-evaluation-harness","description":"EleutherAI's MIT-licensed framework for evaluating language models on more than 60 academic benchmarks with hundreds of subtasks, supporting Hugging Face transformers, vLLM, SGLang, llama.cpp and OpenAI-compatible APIs. Release 0.4.13 came out in August 2026.","use_for":"Run standard log-likelihood and generation benchmarks on open-weight models, for capability baselines or to check whether fine-tuning in a replication degraded general performance.",
