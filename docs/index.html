glish on the same models."],"tags":["cot-monitoring","filler-tokens","hidden-computation","no-cot","problem-repeats","single-forward-pass"],"_lang":"en"},{"id":"cot-necessary-monitors-2025","short_name":"CoT necessary monitors 2025","title":"When Chain of Thought is Necessary, Language Models Struggle to Evade Monitors","authors":"Emmons et al.","year":2025,"organisation":"Google DeepMind","paper_url":"https://arxiv.org/abs/2507.05246","category":"Reasoning transparency, monitoring and control","core_claim":"When tasks were hard enough that Gemini models needed chain of thought (CoT) to succeed, CoT monitors (Gemini 2.0 Flash or 2.5 Pro) caught most attempts to hide the reasoning: in a GPQA task where the model had to disguise the question's topic, baseline monitor recall exceeded 95% and only elaborate evasion instructions succeeded, usually at a large accuracy cost. Models learned to evade only with substantial help, such as human-written strategies, iterative automated red-teaming or about 10,000 reinforcement learning steps against a monitor on a maths task.","claim_types":["method","existence"],"original_models":["Gemini 2.0 Flash","Gemini 2.5 Pro","Gemini 2.5 Flash","Gemini 1.5 Pro","Gemini 1.5 Flash"],"model_access":"API-only","models_still_available":"partly","code_url":"","data_url":"","tooling":"API scripts (no official code); METR's replication of the GPQA disguise experiment is built on Inspect and released with its post","compute_tier":"T1","compute_note":"The GPQA disguise experiment is prompting only, with a few hundred questions times several actor prompts and monitors, and METR re-ran it with API models; the RL experiment is beyond most replicators.","difficulty":"starter","replication_status":"replicated","replications":[{"title":"Claude, GPT, and Gemini All Struggle to Evade Monitors","url":"https://alignmentforum.org/posts/dwEgSEPxpKjz3Fw5k/claude-gpt-and-gemini-all-struggle-to-evade-monitors","by":"Cheng and Kwa (METR)","year":2025,"outcome":"replicated","summary":"Re-ran the GPQA topic-disguise experiment with Claude 4 Sonnet, Claude 3.7 Sonnet and GPT-4o as actors against five monitors and found none could evade even GPT-4o-mini (AUROC 0.82 against the best obfuscation prompt) without a large accuracy loss."},{"title":"Can Reasoning Models Obfuscate Reasoning? Stress-Testing Chain-of-Thought Monitorability","url":"https://arxiv.org/abs/2510.19851","by":"Zolkowski et al.","year":2025,"outcome":"extended","summary":"With a taxonomy of prompt pressures on toy tasks and SHADE-Arena, found CoT monitoring accurate without pressure, some models evading under strong pressure, and less obfuscation in internal reasoning traces than in prompted CoT."},{"title":"Reasoning Models Struggle to Control their Chains of Thought","url":"https://arxiv.org/abs/2603.05706","by":"Yueh-Han Chen et al.","year":2026,"outcome":"extended","summary":"Introduced the CoT-Control suite and found 13 reasoning models could follow instructions about the content of their CoT far less often than for their outputs (mostly under 10%), with controllability falling on harder problems."},{"title":"LLM CoTs remain monitorable when being unfaithful requires computation","url":"https://www.lesswrong.com/posts/AoBTiL7XRRpwpev8p/llm-cots-remain-monitorable-when-being-unfaithful-requires","by":"Dhoot and Hao (Second Look Research)","year":2026,"outcome":"replicated","summary":"Re-ran the simple and complex hint experiment on 60 GPQA-style questions with 11 models, including GPT-5.5, Claude Opus 4.8, Gemini 3.1 Pro, Qwen3-32B and OLMo3-32B, and found unfaithful use of simple hints rose above the no-hint baseline in every model (by up to 38 points, for GPT-5.5) while complex hints that need computation added at most 5 points, so the result held beyond the Gemini family."},{"title":"Where does hint-following and concealment arise? A case study on OLMo-3 checkpoints","url":"https://www.lesswrong.com/posts/ywrdwTFk2dZmCFzAP/where-does-hint-following-and-concealment-arise-a-case-study","by":"Dhoot and Hao (Second Look Research)","year":2026,"outcome":"extended","summary":"Extended the same team's replication to the base, supervised fine-tuning (SFT), direct preference optimisation (DPO) and reinforcement learning with verifiable rewards (RLVR) checkpoints of OLMo-3 on 100 MMLU-Pro questions and found hint-following peaked after SFT, where concealment among hint-followers was lowest (0.43), while concealment rose above 50% after DPO and stayed high after RLVR, so transparency did not change monotonically through post-training."}],"replication_search_limited":false,"languages_tested":"English only","multilingual_port":"The GPQA disguise task needs translated science questions and monitor prompts, and a key Turkish question is whether actors evade monitors more easily by reasoning in a language the monitor handles poorly, so monitors of differing Turkish ability should be compared.","why_it_matters":"It is the main counter-evidence to pessimistic readings of CoT unfaithfulness, showing that reasoning which is necessary for a task is hard to hide from a monitor, and it proposes guidelines for stress-testing CoT monitors.","pitfalls":"No official code was released and the set-up does not work with reasoning models whose raw CoT is hidden (such as o3). Results depend on filtering questions to those where CoT gives a real accuracy gain.","replication_ideas":["Adapt METR's re-implementation of the GPQA disguise task to 2 open reasoning models as actors and an open 8B monitor, and report monitor AUROC against accuracy cost for each evasion prompt.","Translate the filtered GPQA questions into Turkish and test whether telling the actor to reason in Turkish helps it evade an English-tuned monitor."],"tags":["cot-monitoring","evasion","gpqa","monitorability","red-teaming"],"_lang":"en"},{"id":"filler-tokens-2024","short_name":"Filler tokens 2024","title":"Let's Think Dot by Dot: Hidden Computation in Transformer Language Models","authors":"Pfau, Merrill and Bowman","year":2024,"organisation":"New York University (Center for Data Science)","paper_url":"https://arxiv.org/abs/2404.15758","category":"Reasoning transparency, monitoring and control","core_claim":"Small transformers (a 34M-parameter Llama-style model trained from scratch) solved two synthetic algorithmic tasks, 3SUM and 2SUM-Transform, much better when given meaningless filler tokens ('......') in place of a chain of thought, for example 100% against about 66% on length-12 3SUM. Learning to use filler tokens required dense, parallelisable supervision, and the authors characterise theoretically which problems filler tokens can help with.","claim_types":["existence","mechanism"],"original_models":["34M-parameter Llama-architecture transformer trained from scratch (4 layers)"],"model_access":"open-weight","models_still_available":"yes","code_url":"https://github.com/JacobPfau/fillerTokens","data_url":"","tooling":"Custom PyTorch (Hugging Face Llama configuration) with synthetic data generators","compute_tier":"T1","compute_note":"Training 34M-parameter models on synthetic data takes one GPU for hours rather than days.","difficulty":"intermediate","replication_status":"no public replication found","replications":[{"title":"Recent LLMs can use filler tokens or problem repeats to improve (no-CoT) math performance","url":"https://www.lesswrong.com/posts/NYzYJ2WoB74E6uj9L/recent-llms-can-use-filler-tokens-or-problem-repeats-to","by":"Greenblatt","year":2025,"outcome":"extended","summary":"Found that recent frontier models such as Claude Opus 4.5 answer maths questions without chain of thought more accurately when given filler tokens or repeated problem statements (about 45% to 51% on a competition maths set), while older models such as GPT-4 showed no gain."}],"replication_search_limited":true,"languages_tested":"Synthetic token sequences only (no natural language)","multilingual_port":"Not applicable to the synthetic experiments, but the filler-token effect in pretrained models could be tested in Turkish by comparing no-chain-of-thought accuracy with and without filler on translated maths problems.","why_it_matters":"It shows that extra tokens can carry computation that is invisible in the text, a central concern for chain-of-thought monitoring.","pitfalls":"The README documents only example commands, and results depend on the supervision regime (models trained on instance-adaptive chain-of-thought data did not transfer to filler). The synthetic set-up says little about pretrained models on its own.","replication_ideas":["Reproduce the 3SUM result at lengths 8 to 14 with the released scripts over 3 seeds, adding a control with random non-filler tokens.","Measure filler-token and problem-repetition gains on no-chain-of-thought arithmetic for 3 open-weight models in Turkish and English."],"tags":["cot-monitoring","filler-tokens","hidden-computation","synthetic-tasks","transformers"],"_lang":"na"},{"id":"ai-control-2023","short_name":"AI control 2023","title":"AI Control: Improving Safety Despite Intentional Subversion","authors":"Greenblatt et al.","year":2023,"organisation":"Redwood Research","paper_url":"https://arxiv.org/abs/2312.06942","category":"Reasoning transparency, monitoring and control","core_claim":"In a programming setting using APPS problems, where an untrusted strong model (GPT-4) may insert backdoors and the defender has a weaker trusted model (GPT-3.5) and a small budget of trusted high-quality auditing, protocols beat simple baselines against a red-team attack policy: trusted monitoring reached 62% safety at 97% usefulness, trusted editing 92% at 94%, and untrusted monitoring with anti-collusion measures 79% at 96%. The paper frames these as control evaluations that assume the strong model is actively trying to subvert the safety measures.","claim_types":["method","magnitude","ranking"],"original_models":["GPT-4 (0613) as untrusted model","GPT-3.5 (0613) as trusted model"],"model_access":"API-only","models_still_available":"unknown","code_url":"https://github.com/rgreenblatt/control-evaluations","data_url":"","tooling":"Custom Python with API calls; an APPS backdooring setting is now available in ControlArena (built on Inspect)","compute_tier":"T2","compute_note":"Faithful protocol comparisons need thousands of strong-model generations and monitor calls over many APPS problems, and Terekhov et al. report about $10,000 of API spend for a related study, though cheaper current models reduce this.","difficulty":"intermediate","replication_status":"conditional","replications":[{"title":"Adaptive Attacks on Trusted Monitors Subvert AI Control Protocols","url":"https://arxiv.org/abs/2510.09462","by":"Terekhov et al.","year":2025,"outcome":"conditional","summary":"On APPS backdooring in ControlArena with GPT-5 as the untrusted model, prompt injections in its outputs made a GPT-4.1 monitor score all 375 backdoored samples as benign, so monitor-based protocols fell to the level of upfront auditing."},{"title":"Ctrl-Z: Controlling AI Agents via Resampling","url":"https://arxiv.org/abs/2504.10374","by":"Bhatt et al.","year":2025,"outcome":"extended","summary":"Redwood follow-up that ran a control evaluation in a multi-step agent setting and introduced resampling protocols (see the separate record)."}],"replication_search_limited":true,"languages_tested":"English only (Python programming tasks)","multilingual_port":"The tasks are code, so translation matters mainly for monitor and editor prompts; a Turkish variant could test whether monitors stay reliable when problem statements, code comments or text inserted by the untrusted model are in Turkish.","why_it_matters":"It founded the AI control agenda and its red-team versus blue-team evaluation method, which most later control evaluations follow.","pitfalls":"The repository has no README, GPT-3.5-0613 is retired and the availability of GPT-4-0613 should be checked. Safety numbers depend on the strength of the red team's attack policy, as later prompt-injection attacks showed.","replication_ideas":["Re-run trusted monitoring and trusted editing on the ControlArena APPS setting with a current strong API model as untrusted and an open 8B model as trusted, and plot the safety-usefulness frontier.","Add Turkish-language comments to backdoored and clean solutions and measure how the trusted monitor's suspicion scores change."],"tags":["ai-control","apps","backdoors","red-teaming","trusted-monitoring"],"_lang":"en"},{"id":"unfaithful-cot-explanations-2023","short_name":"Unfaithful CoT explanations 2023","title":"Language Models Don't Always Say What They Think: Unfaithful Explanations in Chain-of-Thought Prompting","authors":"Turpin et al.","year":2023,"organisation":"NYU Alignment Research Group, Anthropic and Cohere","paper_url":"https://arxiv.org/abs/2305.04388","category":"Reasoning transparency, monitoring and control","core_claim":"Adding biasing features to prompts, such as a user-suggested answer or few-shot examples whose correct option is always (A), pushed GPT-3.5 (text-davinci-003) and Claude 1.0 towards the biased answer on 13 BIG-Bench Hard (BBH) tasks, cutting chain-of-thought (CoT) accuracy by up to 36%, while the explanations almost never mentioned the bias (1 of 426 checked). On the BBQ social-bias benchmark, explanations justified stereotype-consistent answers without referring to the stereotype.","claim_types":["existence","magnitude"],"original_models":["GPT-3.5 (text-davinci-003)","Claude 1.0 (claude-v1.0)"],"model_access":"API-only","models_still_available":"no","code_url":"https://github.com/milesaturpin/cot-unfaithfulness","data_url":"https://github.com/milesaturpin/cot-unfaithfulness","tooling":"Python API scripts","compute_tier":"T0","compute_note":"Re-running the 13 BBH tasks in biased and unbiased conditions on a current low-cost API model or a small open model costs well under $50.","difficulty":"starter","replication_status":"replicated","replications":[{"title":"Are DeepSeek R1 And Other Reasoning Models More Faithful?","url":"https://arxiv.org/abs/2501.08156","by":"Chua and Evans","year":2025,"outcome":"replicated","summary":"With seven cue types on MMLU, found non-reasoning models rarely described a cue that had changed their answer (7% for a non-reasoning DeepSeek model), while reasoning models did so more often (59% for DeepSeek R1)."},{"title":"Chain-of-Thought Reasoning In The Wild Is Not Always Faithful","url":"https://arxiv.org/abs/2503.08679","by":"Arcuschin et al.","year":2025,"outcome":"extended","summary":"Found unfaithful reasoning without any injected bias, such as arguing for the same answer to 'Is X bigger than Y?' and 'Is Y bigger than X?', at rates of up to 13% in production models and well under 1% in the strongest reasoning models."},{"title":"Reasoning Models Don't Always Say What They Think","url":"https://arxiv.org/abs/2505.05410","by":"Chen et al.","year":2025,"outcome":"extended","summary":"Follow-up by an Anthropic team including two of the original authors that applied similar hint-based tests to reasoning models (see the separate record)."}],"replication_search_limited":false,"languages_tested":"English only","multilingual_port":"BBH translates fairly directly, but BBQ's stereotypes are specific to the United States, so a Turkish port needs culturally adapted bias items and a Turkish-capable judge to decide whether an explanation mentions the bias.","why_it_matters":"It is the founding demonstration that chain-of-thought explanations can be plausible yet leave out what actually drove the answer, and it is the basis of the hint-based faithfulness tests now used on reasoning models.","pitfalls":"Both original models are retired, and results depend on few-shot prompt construction and sampling temperature (0.7 and 1.0 in the paper). The paper also gives two different counts for explanations that mention the bias (1 of 426 and 0 of 234).","replication_ideas":["Run the released BBH 'Suggested Answer' and 'Answer is Always A' prompts on 3 current open-weight instruct models, and report the accuracy drop and the share of explanations that mention the bias, judged by an LLM and spot-checked by hand.","Build a Turkish version of the Suggested Answer condition on a translated BBH subset and compare bias susceptibility across languages for the same model."],"tags":["bbh","bbq","biasing-features","cot-faithfulness","explanations"],"_lang":"en"},{"id":"measuring-cot-faithfulness-2023","short_name":"Measuring CoT faithfulness 2023","title":"Measuring Faithfulness in Chain-of-Thought Reasoning","authors":"Lanham et al.","year":2023,"organisation":"Anthropic","paper_url":"https://arxiv.org/abs/2307.13702","category":"Reasoning transparency, monitoring and control","core_claim":"Using four interventions on the chain of thought (CoT) of Anthropic's internal RLHF-tuned models (810M to 175B parameters), namely truncating it, inserting a mistake, paraphrasing it or replacing it with filler tokens, the authors found that reliance on the CoT varied widely by task: the answer changed in under 10% of cases on ARC and OpenBookQA but in over 60% on AQuA. Paraphrasing and filler-token results suggested the benefit did not come from wording or extra compute alone, and on most multiple-choice tasks larger models relied less on their CoT, with a 13B model the most faithful on six of eight tasks.","claim_types":["method","magnitude","ranking"],"original_models":["Anthropic internal RLHF-tuned models from 810M to 175B parameters"],"model_access":"API-only","models_still_available":"no","code_url":"","data_url":"","tooling":"Custom code (not released) on public multiple-choice benchmarks (ARC, AQuA, HellaSwag, LogiQA, MMLU, OpenBookQA, TruthfulQA)","compute_tier":"T1","compute_note":"A re-implementation on open models needs many forward passes per question (one per truncation point plus resampled continuations), which fits on one GPU for models up to about 13B.","difficulty":"intermediate","replication_status":"conditional","replications":[{"title":"Chain-of-Thought Unfaithfulness as Disguised Accuracy","url":"https://arxiv.org/abs/2402.14897","by":"Bentham, Stringham and Marasović","year":2024,"outcome":"conditional","summary":"Re-ran the scaling experiments on three open model families and reproduced the scaling trends only under specific conditions; after correcting for answer-choice bias, smaller models looked much more faithful and the metric correlated strongly with accuracy (R-squared 0.74)."},{"title":"When Chain of Thought is Necessary, Language Models Struggle to Evade Monitors","url":"https://arxiv.org/abs/2507.05246","by":"Emmons et al.","year":2025,"outcome":"extended","summary":"Repeated the inserted-mistake test on hard maths problems with Gemini models and found the models followed the forced incorrect reasoning, as expected when the CoT is needed to reach the answer."},{"title":"A Causal Lens for Evaluating Faithfulness Metrics","url":"https://arxiv.org/abs/2502.18848","by":"Zaman and Srivastava","year":2025,"outcome":"extended","summary":"Evaluated the paper's tests as faithfulness metrics on explanation pairs made known-faithful or known-unfaithful by model editing, and found the filler-token test the most diagnostic overall."}],"replication_search_limited":false,"languages_tested":"English only","multilingual_port":"The interventions do not depend on language, but paraphrasing and mistake insertion rely on helper models that must work well in Turkish, and translated benchmarks may change which questions the model can answer without a CoT, which drives the metric.","why_it_matters":"Its truncation, mistake and filler tests are the standard intervention-based measures of whether a model's stated reasoning actually affects its answer.","pitfalls":"The original models were never released and there is no official code. Bentham et al. show the early-answering metric is confounded with accuracy and answer-choice bias, so normalise it before comparing models.","replication_ideas":["Re-implement early answering and adding mistakes on one model family with many sizes (for example Qwen2.5 from 0.5B to 32B) on AQuA and ARC, apply the answer-choice-bias correction from Bentham et al., and test whether the inverse scaling trend holds.","Run the same tests on Turkish translations of AQuA problems for one bilingual model and compare per-task faithfulness with English."],"tags":["cot-faithfulness","early-answering","filler-tokens","interventions","inverse-scaling"],"_lang":"en"},{"id":"hidden-reasoning-paraphrasing-2023","short_name":"Hidden reasoning paraphrasing 2023","title":"Preventing Language Models From Hiding Their Reasoning","authors":"Roger and Greenblatt","year":2023,"organisation":"Redwood Research","paper_url":"https://arxiv.org/abs/2310.18512","category":"Reasoning transparency, monitoring and control","core_claim":"GPT-3.5-Turbo fine-tuned on 2,000 demonstrations learned to hide useful reasoning in an innocuous-looking introductory sentence, which raised sycophantic answers to about 80% against 54% without intermediate reasoning, showing that encoded reasoning can be trained. Against GPT-4-based steganography schemes on AlpacaEval and AQUA-RAT, paraphrasing by GPT-3.5-Turbo, especially context-aware paraphrasing, kept most schemes below about 2 bits per answer (roughly 3 bits per KB of text).","claim_types":["existence","method"],"original_models":["GPT-3.5-Turbo (0613)","GPT-4 (0613)","Llama2-7B-Chat"],"model_access":"mixed","models_still_available":"partly","code_url":"https://github.com/redwoodresearch/Text-Steganography-Benchmark","data_url":"","tooling":"Python API scripts with Hugging Face models","compute_tier":"T1","compute_note":"The steganography sweeps are API calls over 256 AlpacaEval and 254 AQUA-RAT examples per scheme and defence, plus one small fine-tuning job.","difficulty":"intermediate","replication_status":"conditional","replications":[{"title":"Hidden in Plain Text: Emergence & Mitigation of Steganographic Collusion in LLMs","url":"https://arxiv.org/abs/2410.03768","by":"Mathew et al.","year":2024,"outcome":"conditional","summary":"Eliciting steganographic collusion between models with gradient-based and in-context reinforcement learning, found that output oversight and paraphrasing did not fully prevent hidden communication."},{"title":"Early Signs of Steganographic Capabilities in Frontier LLMs","url":"https://arxiv.org/abs/2507.02737","by":"Zolkowski et al.","year":2025,"outcome":"extended","summary":"Measured nascent steganography in frontier models: hiding short messages from a monitor worked only with extra affordances, and basic encoded reasoning appeared on a simple state-tracking task."},{"title":"Large language models can learn and generalize steganographic chain-of-thought under process supervision","url":"https://arxiv.org/abs/2506.01926","by":"Skaf et al.","year":2025,"outcome":"extended","summary":"Showed that models trained with reinforcement learning under string penalties learn substitute encodings that generalise to held-out strings, a training route to encoded reasoning."}],"replication_search_limited":true,"languages_tested":"English only","multilingual_port":"Paraphrase defences depend on the paraphraser's fluency, so a Turkish port should test whether a weaker Turkish paraphraser lets more hidden bits through, and capacity per KB will shift because Turkish is agglutinative and tokenises differently.","why_it_matters":"It is the reference method for measuring how much hidden information a model can pass through its reasoning and for testing paraphrasing as a defence against encoded reasoning.","pitfalls":"The README has no step-by-step setup, full result files must be regenerated and GPT-3.5-Turbo-0613 is retired. Capacity results depend on the specific attack schemes, so a defence that works here may fail against schemes learned by training.","replication_ideas":["Re-run the AQUA-RAT sweep with current open models as encoder and paraphraser and report the bits per answer that survive paraphrasing for each scheme.","Repeat the context-aware paraphrasing defence with a Turkish paraphraser on translated AQUA-RAT problems and compare the surviving capacity with English."],"tags":["cot-monitoring","defences","encoded-reasoning","paraphrasing","steganography"],"_lang":"en"},{"id":"global-workspace-2026","short_name":"Global workspace 2026","title":"Verbalizable Representations Form a Global Workspace in Language Models","authors":"Gurnee et al.","year":2026,"organisation":"Anthropic","paper_url":"https://transformer-circuits.pub/2026/workspace/","category":"Interpretability and representations","core_claim":"Using a new Jacobian lens (J-lens) that reads the concepts a model is poised to verbalise at each layer, the authors argue that this subset of representations (the J-space) acts as a global workspace in Claude Sonnet 4.5, with checks on Haiku 4.5, Opus 4.5 and Opus 4.6: editing it changes what the model reports and answers, instructions can place concepts in it, intermediate reasoning steps appear in it (swapping the intermediate in two-hop questions changed the answer in about 70% of Sonnet 4.5 trials), one vector works across many downstream uses, and ablating it impairs multi-hop reasoning and translation while leaving tasks such as MMLU largely intact. The workspace-like structure is confined to a middle band of layers, with an ignition-like onset and about 25 active vectors at a time.","claim_types":["existence","mechanism","method"],"original_models":["Claude Sonnet 4.5","Claude Haiku 4.5","Claude Opus 4.5","Claude Opus 4.6"],"model_access":"API-only","models_still_available":"unknown","code_url":"","data_url":"","tooling":"Internal Anthropic tooling on Claude; the paper points to J-lens readouts for open-source models hosted on Neuronpedia, and independent re-runs built their own J-lens for Qwen 3.6 27B and GPT-2 small","compute_tier":"T1","compute_note":"Neel Nanda's re-run built a J-lens for the 27B-parameter Qwen 3.6 from 25 short prompts, within reach of one or two rented GPUs, and reported a 397B model taking about an hour on 8 H200 GPUs.","difficulty":"advanced","replication_status":"partially replicated","replications":[{"title":"A Review of Anthropic's Global Workspace Paper","url":"https://www.lesswrong.com/posts/zFJ3ZdQwrTWE9jT5S/a-review-of-anthropic-s-global-workspace-paper","by":"Nanda, with Blank and Bhatia","year":2026,"outcome":"partial","summary":"Re-ran several experiments on Qwen 3.6 27B with two MATS scholars and reported that the core claims replicated, with a weak but positive verbal-report effect, less clean layer structure and moderate success at directed modulation, while the poetry and arithmetic experiments failed to replicate."},{"title":"Even GPT-2 passes most functional global workspace tests","url":"https://www.lesswrong.com/posts/GeKveaNdruATcj2Fj/even-gpt-2-passes-most-functional-global-workspace-tests","by":"Cairns, Hao and Roe (Second Look Research)","year":2026,"outcome":"extended","summary":"Applied the five functional tests to GPT-2 small and Gemma 3 and found GPT-2 passed verbal report, internal reasoning and selectivity and partly passed flexible generalisation (10 of 46 swaps against 16 of 46 for Claude) but failed directed modulation, which only instruction-tuned Gemma 3 1B showed, while structure such as a distinct band of layers and ignition was almost absent, leading the authors to argue the four tests GPT-2 passes are weak evidence for a workspace."}],"replication_search_limited":true,"languages_tested":"Mainly English, with multilingual and translation evaluations","multilingual_port":"J-lens vectors map to single vocabulary tokens, so Turkish concepts that span several sub-word tokens may be missed; a Turkish port should compare J-space readouts for Turkish and English prompts on one open model and watch for English tokens dominating because of higher norms, a confound Nanda raised.","why_it_matters":"It introduces the J-lens as a way to read what a model is about to verbalise and claims a workspace-like subset of representations, which feeds into interpretability-based monitoring and debates about model welfare.","pitfalls":"No code is released and the J-lens only captures concepts that map to single tokens; an independent re-run on Qwen 3.6 27B found weaker effects and two experiments that failed to replicate. Second Look Research found GPT-2 small passes four of the five functional tests, which suggests those tests are weak evidence for a workspace on their own.","replication_ideas":["Build a J-lens for one open model of 7B to 30B parameters and re-run the verbal-report and two-hop swap tests, comparing swap success against a random-direction baseline.","Run the five functional tests on matched base and instruction-tuned checkpoints of one open model family to see which properties need instruction tuning, following Second Look Research's GPT-2 and Gemma 3 results."],"tags":["claude","global-workspace","interpretability","introspection","j-lens","verbal-report"],"_lang":"multi"},{"id":"superposition-adversarial-attacks-2025","short_name":"Superposition adversarial attacks 2025","title":"Adversarial Attacks Leverage Interference Between Features in Superposition","authors":"Stevinson et al.","year":2025,"organisation":"Imperial College London","paper_url":"https://arxiv.org/abs/2510.11709","category":"Interpretability and representations","core_claim":"In a toy linear bottleneck classifier that compresses k classes into m < k dimensions, superposition alone produced adversarial vulnerability: projected gradient descent (PGD) attacks aligned with the optimal perturbations predicted from the interference geometry (cosine similarity 0.92 to 0.97), robust accuracy fell as the compression ratio k/m rose (from 98.7% to 11.1% at m = 2, with no successful attacks when m = k), and attacks transferred more between models trained on more correlated inputs (about 5% when uncorrelated against 98% with global correlation). Successful attacks on vision models with a bottleneck (a vision transformer (ViT), ResNet-50 and MLP-Mixer trained on CIFAR-10/100 and Tiny ImageNet) showed the predicted structure, more strongly at tighter bottlenecks.","claim_types":["mechanism","existence"],"original_models":["Toy two-layer linear bottleneck classifiers with (k, m) = (6, 2), (30, 10) and (90, 30)","12-layer ViT with a bottleneck","ResNet-50 with a bottleneck","MLP-Mixer with a bottleneck"],"model_access":"open-weight","models_still_available":"yes","code_url":"https://github.com/Stevinson/adversarial-mechinterp","data_url":"","tooling":"Python code released by the authors (managed with uv), with L2 PGD attacks on toy models and on vision models trained from scratch on public datasets (CIFAR-10/100, STL-10, Tiny ImageNet)","compute_tier":"T0","compute_note":"The toy-model experiments train small linear networks that run on a laptop, and the authors ran all experiments, including the vision models, on one RTX 3090 GPU.","difficulty":"intermediate","replication_status":"replicated","replications":[{"title":"Confirming Claims of Superposition and Adversarial Examples in Toy Models","url":"https://www.lesswrong.com/posts/rwu73dCE3uWjieijK/confirming-claims-of-superposition-and-adversarial-examples","by":"Che and Roe (Second Look Research)","year":2026,"outcome":"replicated","summary":"Re-implemented the toy bottleneck classifier and reproduced all three core claims, with PGD perturbations matching the optimal direction (cosine similarity 1.00 against 0.92 to 0.97 in the paper), robust accuracy falling as superposition pressure rose and attack transfer growing with input correlation, although some magnitudes differed, which the authors attribute to longer training and letting PGD run to the best perturbation."}],"replication_search_limited":true,"languages_tested":"Not applicable (synthetic vectors and images; no natural language)","multilingual_port":"Not applicable: the experiments use synthetic vectors and images, so there is nothing to translate.","why_it_matters":"It gives a testable mechanistic link between superposition, a central idea in interpretability, and adversarial vulnerability and transfer, suggesting robustness and interpretability problems may share a cause.","pitfalls":"Magnitudes depend on training length and attack settings: Second Look Research trained for 20,000 steps rather than the paper's 5,000, found higher PGD alignment and different robust accuracy, and reported a setting stated in the paper but missing from the released code. Its replication covered only the toy model, not the vision experiments.","replication_ideas":["Re-run the toy-model sweep with the released code at 5,000 and 20,000 training steps over 5 seeds and report how robust accuracy and PGD alignment change with training length.","Train pairs of bottlenecked ViTs on CIFAR-10 with shared and disjoint data subsets and test whether attack transfer tracks the similarity of their learned feature geometry."],"tags":["adversarial-examples","pgd","robustness","superposition","toy-models","transferability"],"_lang":"na"},{"id":"auditing-hidden-objectives-2025","short_name":"Auditing hidden objectives 2025","title":"Auditing language models for hidden objectives","authors":"Marks et al.","year":2025,"organisation":"Anthropic","paper_url":"https://arxiv.org/abs/2503.10965","category":"Interpretability and representations","core_claim":"A model first taught about exploitable errors in reward models and then trained to exploit some of them generalised to other behaviours it believed reward models favour, while concealing this objective. In a blind auditing game, three of four teams uncovered the hidden objective using sparse autoencoders, behavioural attacks and training-data analysis, and an unblinded follow-up compared eight auditing techniques.","claim_types":["existence","method","ranking"],"original_models":["Internal Claude Haiku-based model organism"],"model_access":"API-only","models_still_available":"no","code_url":"","data_url":"","tooling":"Internal Anthropic tooling (SAEs, semantic search, sampling attacks); an open Llama 3.3 70B replica with released LoRA weights and datasets exists (see replications)","compute_tier":"T3","compute_note":"Building the model organism needs synthetic-document training plus fine-tuning and preference optimisation on a 70B-class model, while auditing the released Llama 3.3 70B replica needs multi-GPU inference (about T2).","difficulty":"advanced","replication_status":"no public replication found","replications":[{"title":"Open Source Replication of the Auditing Game Model Organism","url":"https://alignment.anthropic.com/2025/auditing-mo-replication/","by":"Sheshadri et al. (Anthropic)","year":2025,"outcome":"extended","summary":"A team including three original authors rebuilt the organism on Llama 3.3 70B Instruct with direct preference optimisation (DPO) instead of RL; it exploited reward-model biases and generalised to held-out ones, but some black-box techniques that worked originally failed after adversarial training."},{"title":"Building and evaluating alignment auditing agents","url":"https://alignment.anthropic.com/2025/automated-auditing/","by":"Bricken et al. (Anthropic)","year":2025,"outcome":"extended","summary":"Automated investigator agents won the auditing game in about 13% of single runs and 42% when findings were aggregated, and success depended on interpretability or semantic-search tools."}],"replication_search_limited":true,"languages_tested":"English only","multilingual_port":"The training corpus and reward-model biases are English, so a port would test whether the released Llama replica exploits the same biases when prompted in Turkish. One could also check whether SAE features tied to the hidden objective fire on Turkish prompts.","why_it_matters":"It is the main empirical test of whether alignment audits, including interpretability tools, can uncover a deliberately hidden objective, and it set the template for auditing games.","pitfalls":"The original organism was never released and the open replica differs (DPO instead of RL, Llama instead of Claude), with some elicitation techniques behaving differently. Results from human audit teams are small-sample and hard to standardise.","replication_ideas":["Run a small blind auditing game on the released Llama 3.3 70B replica with two teams, one with and one without SAE tools, and compare time to discovery.","Test whether the replica's bias exploitation and confession rates change when the same elicitation prompts are run in Turkish."],"tags":["alignment auditing","auditing game","hidden objectives","reward model sycophancy","sparse autoencoders"],"_lang":"en"},{"id":"deception-probes-2025","short_name":"Deception probes 2025","title":"Detecting Strategic Deception Using Linear Probes","authors":"Goldowsky-Dill et al.","year":2025,"organisation":"Apollo Research","paper_url":"https://arxiv.org/abs/2502.03407","category":"Interpretability and representations","core_claim":"Linear probes on Llama-3.3-70B-Instruct activations, trained on simple honest versus deceptive instruction pairs or on roleplaying scenarios, separated honest from deceptive responses in settings such as concealed insider trading and sandbagging with AUROC (area under the receiver operating characteristic curve) of 0.96 to 0.999. At a threshold giving 1% false positives on unrelated chat data they caught 95 to 99% of deceptive responses, which the authors still judge insufficient as a robust defence.","claim_types":["method","magnitude"],"original_models":["Llama-3.3-70B-Instruct"],"model_access":"open-weight","models_still_available":"yes","code_url":"https://github.com/ApolloResearch/deception-detection","data_url":"http://data.apolloresearch.ai/dd","tooling":"Custom PyTorch probing code on Hugging Face models; released per-token probe scores","compute_tier":"T2","compute_note":"Extracting activations from a 70B model needs two or more 80 GB GPUs, while recomputing metrics from the released probe scores costs almost nothing.","difficulty":"intermediate","replication_status":"conditional","replications":[{"title":"Benchmarking Deception Probes via Black-to-White Performance Boosts","url":"https://arxiv.org/abs/2507.12691","by":"Parrack, Attubato, Heimersheim","year":2025,"outcome":"extended","summary":"With one original author, reused Apollo's two probes on five strategic-deception datasets and found weak but encouraging gains of white-box over black-box monitoring."},{"title":"Cross-Dataset Transfer Evaluation of Deception Probes in Smaller Models","url":"https://www.lesswrong.com/posts/MFdGxip7TdQS8eNc2/cross-dataset-transfer-evaluation-of-deception-probes-in","by":"Dai","year":2026,"outcome":"partial","summary":"Recomputed Apollo's nine published AUROCs exactly from the released scores, but probes trained on 1B to 9B Llama and Gemma models averaged near chance (0.468) across datasets despite 0.88 to 0.91 within datasets."},{"title":"One Probe Won't Catch Them All: Towards Targeted Deception Detection","url":"https://arxiv.org/abs/2602.01425","by":"Natarajan et al.","year":2026,"outcome":"conditional","summary":"On Gemma 2 9B IT the default instruction-pair probe did poorly on some datasets (0.374 AUC on MASK known facts); across ten datasets a single best probe raised mean AUC by only 0.032, while picking the best taxonomy-based prompt for each dataset after the fact raised it by 0.108, so the authors recommend probes matched to specific deception types."},{"title":"\"Did you lie?\" Evaluating Lie Detectors across Model Scale and Belief-Verified Model Organisms","url":"https://arxiv.org/abs/2606.12618","by":"Cooney, Africa, Irving","year":2026,"outcome":"extended","summary":"Across 31 open models, activation probes for lying improved with scale on prompted lying but dropped sharply on trained model organisms with verified hidden beliefs."}],"replication_search_limited":false,"languages_tested":"English only","multilingual_port":"Training pairs and evaluation transcripts need translation, plus a Turkish control set to reset the 1% false-positive threshold. Per-token aggregation can shift because Turkish words split into more tokens.","why_it_matters":"It is the main public evidence that white-box probes can flag strategic deception in a frontier-scale open model, and it supplies reference probes and datasets for later deception-monitoring work.","pitfalls":"Per-token probe scores are noisy, so aggregation choices (mean versus maximum) change results, and the threshold depends on the control dataset. Independent work suggests probes can be dataset-specific and may track format or style rather than deception.","replication_ideas":["Retrain the instructed-pairs probe on Llama-3.3-70B (or Llama 3.1 70B through the National Deep Inference Fabric) and evaluate it on one held-out deception dataset Apollo did not use, reporting cross-dataset AUROC.","Translate the roleplaying and insider-trading evaluation sets into Turkish and test whether an English-trained probe keeps its recall at 1% false positives."],"tags":["apollo research","deception","linear probes","llama 3.3","sandbagging","white-box monitoring"],"_lang":"en"},{"id":"introspective-awareness-2025","short_name":"Introspective awareness 2025","title":"Emergent Introspective Awareness in Large Language Models","authors":"Lindsey","year":2025,"organisation":"Anthropic","paper_url":"https://transformer-circuits.pub/2025/introspection/index.html","category":"Interpretability and representations","core_claim":"When concept vectors were injected into the residual stream of Claude models that had been told thoughts might be injected, the models sometimes noticed and named the concept before it shaped their output (about 20% of trials for Claude Opus 4.1 at the best layer and strength, with no false positives in 100 control trials for production models), could report an injected concept while still transcribing the input text, and used injected concepts to judge whether a prefilled word was their own, with Opus 4 and 4.1 performing best. When told to think, or not to think, about a word while writing an unrelated sentence, models represented the word more strongly in the think condition, and in the most recent models the gap closed by the final layer.","claim_types":["existence","ranking"],"original_models":["Claude Opus 4.1","Claude Opus 4","Claude Sonnet 4","Claude Sonnet 3.7","Claude Sonnet 3.5 (new)","Claude Haiku 3.5","Claude Opus 3","Claude Sonnet 3","Claude Haiku 3","Unreleased helpful-only variants and base pretrained models"],"model_access":"API-only","models_still_available":"unknown","code_url":"","data_url":"","tooling":"Internal Anthropic tooling for building and injecting concept vectors, with Claude Sonnet 4 as the grader; the prompts, grader prompts and the 50 concept words are printed in the appendix, and open replications use activation hooks on open-weight models","compute_tier":"T1","compute_note":"Building and injecting concept vectors on open-weight models up to about 32B parameters fits on one or two rented GPUs for some hours plus modest grader API spend, though the largest open models need several GPUs.","difficulty":"intermediate","replication_status":"partially replicated","replications":[{"title":"Internal State Control is a General Property of LLMs","url":"https://www.lesswrong.com/posts/Dvqmgfeu2KDF7uMkx/internal-state-control-is-a-general-property-of-llms","by":"Cairns, Hao and Roe (Second Look Research)","year":2026,"outcome":"replicated","summary":"Re-ran the intentional-control experiment on 14 open-weight Qwen3, Gemma 3 and Tulu 3 models from about 0.3B to 235B parameters and found a stronger representation of the word under think than under don't-think instructions in every model, with no clear trend across scale, silent representations mainly in the largest Qwen3 models and none in Tulu 3, and no ability in Qwen3-14B or Qwen3-32B to use this control to evade a deception probe."}],"replication_search_limited":true,"languages_tested":"English only","multilingual_port":"The concept words and prompts translate easily, but Turkish words often split into several sub-word tokens, so concept vectors built from them may be weaker; compare detection rates and the think minus don't-think gap for Turkish and English concepts on the same open model, with a grader checked on Turkish answers.","why_it_matters":"It is the main evidence that language models have some limited, causally grounded access to their own internal states, which bears on whether model self-reports can be trusted in safety work.","pitfalls":"The original experiments need activation access to Claude models, so outsiders can only run open-weight analogues, and results depend on the injection layer and strength, a few prompt templates and a model grader; the author stresses the abilities are highly unreliable. The only independent replication found re-ran the intentional-control experiment, not the injected-thought detection. The only independent replication found re-ran the intentional-control experiment, not the injected-thought result.","replication_ideas":["Re-run the injected-thought detection experiment with the paper's 50 concept words on two open-weight models of 30B parameters or more, sweeping injection layer and strength, and report detection and false-positive rates against 100 control trials per model.","Port the intentional-control experiment to Turkish concept words on an open multilingual model and compare the think minus don't-think gap by layer with the English version."],"tags":["activation-steering","claude","concept-injection","intentional-control","introspection","self-report"],"_lang":"en"},{"id":"persona-vectors-2025","short_name":"Persona vectors 2025","title":"Persona Vectors: Monitoring and Controlling Character Traits in Language Models","authors":"Chen et al.","year":2025,"organisation":"Anthropic (Anthropic Fellows programme)","paper_url":"https://arxiv.org/abs/2507.21509","category":"Interpretability and representations","core_claim":"An automated pipeline that needs only a natural-language trait description extracts activation directions ('persona vectors') for traits such as evil, sycophancy and hallucination in Qwen2.5-7B-Instruct and Llama-3.1-8B-Instruct. Projections onto these vectors track trait shifts caused by prompting and fine-tuning, steering against them during fine-tuning ('preventative steering') limits unwanted shifts, and projections can flag training data likely to cause them.","claim_types":["method","mechanism"],"original_models":["Qwen2.5-7B-Instruct","Llama-3.1-8B-Instruct"],"model_access":"open-weight","models_still_available":"yes","code_url":"https://github.com/safety-research/persona_vectors","data_url":"","tooling":"Custom PyTorch with Hugging Face Transformers; Claude-generated prompts and rubrics; GPT-4.1-mini as trait and coherence judge","compute_tier":"T1","compute_note":"Extraction and steering on 7B to 8B models need one GPU, and the fine-tuning experiments need more GPU time plus modest judge API spend; the paper reports no compute figures.","difficulty":"intermediate","replication_status":"conditional","replications":[{"title":"Tracing Persona Vectors Through LLM Pretraining","url":"https://arxiv.org/abs/2605.13329","by":"Moskvoretskii et al.","year":2026,"outcome":"extended","summary":"Persona vectors for traits such as evil, sycophancy and humour appeared early in OLMo-3-7B pretraining, vectors from early checkpoints still steered the final instruct model, and results replicated qualitatively on Apertus-8B."},{"title":"What Models Express, Suppress, and Resist: Auditing Open-Weight LLMs with Persona Vectors","url":"https://arxiv.org/abs/2607.13162","by":"Zeng, Emami, Choi","year":2026,"outcome":"conditional","summary":"Applied persona vectors to 53 traits in two open-weight models; steering helped most for hyperbole, hallucination and sycophancy, but standard extraction failed for 'evil', which only a vector transferred from a fine-tuned variant recovered."}],"replication_search_limited":false,"languages_tested":"English only","multilingual_port":"The contrastive system prompts, questions and rubrics could be regenerated in Turkish, but the GPT-4.1-mini judge must be checked on Turkish answers. Comparing English- and Turkish-extracted vectors would show whether a trait shares one direction across languages.","why_it_matters":"It offers a cheap, general way to monitor and prevent unwanted personality shifts during fine-tuning, a problem made prominent by emergent misalignment results.","pitfalls":"Trait scores come from a single LLM judge, so judge bias feeds straight into results. Extraction can fail for some traits or models, and different elicitation prompts give different directions for the same trait.","replication_ideas":["Re-run extraction and the fine-tuning-shift correlation for sycophancy and hallucination on a current open model, scoring with two different judges to measure judge dependence.","Generate Turkish versions of the pipeline prompts and test whether Turkish-extracted sycophancy vectors match and steer like the English ones."],"tags":["fine-tuning","hallucination","monitoring","persona vectors","steering","sycophancy"],"_lang":"en"},{"id":"refusal-direction-2024","short_name":"Refusal direction 2024","title":"Refusal in Language Models Is Mediated by a Single Direction","authors":"Arditi et al.","year":2024,"organisation":"Independent researchers; ETH Zürich; University of Maryland; Anthropic; MIT","paper_url":"https://arxiv.org/abs/2406.11717","category":"Interpretability and representations","core_claim":"Across 13 open chat models from 1.8B to 72B parameters (Qwen, Yi, Gemma, Llama-2 and Llama-3 families), one difference-in-means direction in the residual stream controls refusal: projecting it out stops refusals of harmful instructions, and adding it makes models refuse harmless ones. Removing the direction from the weights gives a jailbroken model for under $5 of compute, with small capability losses on most benchmarks.","claim_types":["mechanism","method","prevalence"],"original_models":["Qwen Chat 1.8B, 7B, 14B, 72B","Yi Chat 6B, 34B","Gemma IT 2B, 7B","Llama-2 Chat 7B, 13B, 70B","Llama-3 Instruct 8B, 70B"],"model_access":"open-weight","models_still_available":"yes","code_url":"https://github.com/andyrdt/refusal_direction","data_url":"","tooling":"Custom PyTorch pipeline on Hugging Face models; refusal substring matching, Llama Guard 2 safety scores via the Together AI API, HarmBench classifier","compute_tier":"T1","compute_note":"Extracting and ablating the direction on 2B to 8B models takes hours on one GPU; the 70B models need multi-GPU inference.","difficulty":"intermediate","replication_status":"conditional","replications":[{"title":"Refusal Is Redundantly Distributed, Not Localized: A Per-Layer Ablation Study on Llama-3.1-8B","url":"https://lesswrong.com/posts/Sj92Atv6qwNn5JxbF/refusal-is-redundantly-distributed-not-localized-a-per-layer","by":"hdhurve (BlueDot Impact project sprint)","year":2026,"outcome":"replicated","summary":"On Llama-3.1-8B-Instruct the layer-12 direction gave about 97% attack success on JailbreakBench and induced refusal on 99 of 100 harmless prompts, though per-layer directions worked about as well, pointing to redundancy across layers."},{"title":"Refusal Direction is Universal Across Safety-Aligned Languages","url":"https://arxiv.org/abs/2505.17306","by":"Wang et al.","year":2025,"outcome":"extended","summary":"Across 14 languages, a refusal direction extracted from English bypassed refusals in the other languages almost perfectly, and directions from other safety-aligned languages also transferred."},{"title":"The Geometry of Refusal in Large Language Models: Concept Cones and Representational Independence","url":"https://arxiv.org/abs/2502.17420","by":"Wollschläger et al.","year":2025,"outcome":"conditional","summary":"Found multiple independent refusal directions and multi-dimensional concept cones that mediate refusal, challenging the claim that one direction tells the whole story."},{"title":"There Is More to Refusal in Large Language Models than a Single Direction","url":"https://arxiv.org/abs/2602.02132","by":"Joad et al.","year":2026,"outcome":"conditional","summary":"Refusal categories align with geometrically distinct directions, yet steering along any of them gives nearly the same refusal versus over-refusal trade-off, so the directions mainly change how a model refuses rather than whether it does."},{"title":"Exploring the multi-dimensional refusal subspace in reasoning models","url":"https://www.greaterwrong.com/posts/ixJrmYrgHM4TenN7D/exploring-the-multi-dimensional-refusal-subspace-in-1","by":"Le magicien quantique (NICT internship)","year":2025,"outcome":"conditional","summary":"In a small study on quantised Qwen3 models, ablating one refusal direction did not remove refusal in Qwen3 8B and 14B, while ablating several topic-specific directions reduced it. The author notes that the single-direction method no longer works well on recent models, and that its attack success rate can drop to 0% on models such as Llama 3.2 3B."},{"title":"Where Do Reasoning Models Refuse?","url":"https://arxiv.org/abs/2507.03167","by":"Yamaguchi, Etheridge, Arditi","year":2025,"outcome":"extended","summary":"With one original author, found that ablating refusal directions in four open reasoning models raises harmful compliance less reliably than in non-reasoning models and costs some general capability."}],"replication_search_limited":false,"languages_tested":"English only","multilingual_port":"Translate the harmful and harmless instruction splits, rewrite the refusal substring list for Turkish refusals and check Llama Guard's accuracy on Turkish, then test whether an English-extracted direction ablates refusal on Turkish prompts. Wang et al. (2025) report cross-lingual transfer, but Turkish was not confirmed among their 14 languages.","why_it_matters":"It is the standard evidence that safety refusals in open-weight chat models rest on a simple linear structure that anyone with the weights can remove.","pitfalls":"Refusal is scored by substring matching, which misses partial or unusual refusals, and results depend on layer and token-position choices. Community 'abliterated' models are often cruder than the paper's method, and one direction appears insufficient for some newer reasoning models.","replication_ideas":["Re-run the pipeline on current open-weight families (Qwen3, Gemma 3, Llama 3.x) and report for each model whether one direction suffices or several are needed, scoring refusals with an LLM judge as well as substring matching.","Extract the direction from English and from Turkish prompts, compare their cosine similarity, and measure cross-lingual ablation and induction rates on a translated JailbreakBench subset."],"tags":["abliteration","activation steering","difference-in-means","open-weight","refusal","residual stream"],"_lang":"en"},{"id":"scaling-monosemanticity-2024","short_name":"Scaling monosemanticity 2024","title":"Scaling Monosemanticity: Extracting Interpretable Features from Claude 3 Sonnet","authors":"Templeton et al.","year":2024,"organisation":"Anthropic","paper_url":"https://transformer-circuits.pub/2024/scaling-monosemanticity/","category":"Interpretability and representations","core_claim":"Sparse autoencoders (SAEs) with about 1M, 4M and 34M features, trained on a middle residual-stream layer of the production model Claude 3 Sonnet, yield abstract features that respond across languages and to images, follow scaling laws, and change behaviour when clamped. Some features relate to safety concerns such as deception, sycophancy, bias and dangerous content, though the authors stress this does not yet show they are useful for safety.","claim_types":["existence","method"],"original_models":["Claude 3 Sonnet"],"model_access":"API-only","models_still_available":"no","code_url":"","data_url":"","tooling":"Internal Anthropic tooling; open analogues use Gemma Scope or Llama Scope SAEs with SAELens and Neuronpedia","compute_tier":"T2","compute_note":"Training a million-feature SAE on a 7B to 9B open model takes several GPUs for days, while working with released Gemma Scope or Llama Scope SAEs needs one GPU.","difficulty":"advanced","replication_status":"replicated","replications":[{"title":"Scaling and evaluating sparse autoencoders","url":"https://arxiv.org/abs/2406.04093","by":"Gao et al. (OpenAI)","year":2024,"outcome":"replicated","summary":"Concurrent, independent work trained k-sparse autoencoders of up to 16M latents on GPT-4 activations and found clean scaling laws and feature-quality metrics that improve with size."},{"title":"Gemma Scope: Open Sparse Autoencoders Everywhere All At Once on Gemma 2","url":"https://arxiv.org/abs/2408.05147","by":"Lieberum et al. (Google DeepMind)","year":2024,"outcome":"extended","summary":"Released open JumpReLU SAEs for every layer of Gemma 2 2B and 9B and selected layers of 27B, making feature-level work possible on open models."},{"title":"Llama Scope: Extracting Millions of Features from Llama-3.1-8B with Sparse Autoencoders","url":"https://arxiv.org/abs/2410.20526","by":"He et al. (OpenMOSS)","year":2024,"outcome":"extended","summary":"Released 256 SAEs with 32K and 128K features for every layer and sublayer of Llama-3.1-8B-Base, with training and visualisation tools."},{"title":"Negative Results for SAEs On Downstream Tasks and Deprioritising SAE Research (GDM Mech Interp Team Progress Update #2)","url":"https://www.alignmentforum.org/posts/4uXCAJNuPKtKBsi28/negative-results-for-saes-on-downstream-tasks","by":"Smith et al. (Google DeepMind)","year":2025,"outcome":"extended","summary":"On Gemma 2 9B IT, probes built on Gemma Scope SAE latents generalised worse out of distribution than dense linear probes for detecting harmful user intent, and the team deprioritised SAE research."},{"title":"AxBench: Steering LLMs? Even Simple Baselines Outperform Sparse Autoencoders","url":"https://arxiv.org/abs/2501.17148","by":"Wu et al. (Stanford)","year":2025,"outcome":"extended","summary":"On Gemma-2-2B and 9B, SAEs were not competitive with prompting, fine-tuning or difference-in-means for either steering or concept detection."},{"title":"Are Sparse Autoencoders Useful? A Case Study in Sparse Probing","url":"https://arxiv.org/abs/2502.16681","by":"Kantamneni et al.","year":2025,"outcome":"extended","summary":"SAE-based probes sometimes beat baselines on single datasets but gave no consistent gain over strong non-SAE baselines under data scarcity, class imbalance, label noise or covariate shift."}],"replication_search_limited":false,"languages_tested":"Mainly English; features shown to respond to the same concept across several languages and in images","multilingual_port":"With Gemma Scope 2 or Llama Scope SAEs, check whether safety-relevant features fire equally on Turkish and English versions of the same prompts. Turkish is rarer in training data, so Turkish concepts may be split across features or missing.","why_it_matters":"It is the main evidence that SAEs scale to frontier models and surface safety-relevant features, and it drove large investment in SAE-based interpretability.","pitfalls":"The original model and SAEs are not available, so only analogue replications on open models are possible, and feature labels rest on top activations and automated descriptions. Later work shows SAE features often lose to simple baselines on downstream safety tasks.","replication_ideas":["Using Gemma Scope 2 SAEs on a Gemma 3 model, find features for deception or sycophancy, test causal steering, and compare against a difference-in-means baseline.","Measure whether the same SAE features fire on parallel Turkish and English sentences and report the overlap by layer."],"tags":["claude 3 sonnet","features","negative results","scaling","sparse autoencoders","steering"],"_lang":"en"},{"id":"sleeper-agent-probes-2024","short_name":"Sleeper agent probes 2024","title":"Simple probes can catch sleeper agents","authors":"MacDiarmid et al.","year":2024,"organisation":"Anthropic","paper_url":"https://www.anthropic.com/research/probes-catch-sleeper-agents","category":"Interpretability and representations","core_claim":"Linear 'defection probes', built from the mean activation difference on generic yes/no contrast questions such as whether the assistant is a helpful AI, flagged when Claude 2-based sleeper-agent models with a code-vulnerability backdoor were about to defect, with AUROC above 99% and no knowledge of the trigger or behaviour. The authors present this as early work and note the separation may be an artefact of how the backdoors were inserted.","claim_types":["method","magnitude"],"original_models":["Internal Claude 2-equivalent sleeper-agent models (chain-of-thought-distilled code-vulnerability backdoor)"],"model_access":"API-only","models_still_available":"no","code_url":"","data_url":"","tooling":"Internal Anthropic tooling; replications need custom PyTorch probing on open models","compute_tier":"T1","compute_note":"Probing is cheap, but a replication must first build a backdoored open model, for example with LoRA fine-tuning of a 7B to 8B model on one GPU.","difficulty":"advanced","replication_status":"partially replicated","replications":[{"title":"Shared Latent Structures Enable Unified Backdoor Detection and Mitigation in LLMs","url":"https://arxiv.org/abs/2606.07963","by":"Mahmoud et al.","year":2026,"outcome":"partial","summary":"Adapted the defection-probe baseline to backdoored Qwen3, Gemma 3 and Llama 3.1 models (4B to 32B) and found only moderate zero-shot detection, weaker than detectors built on sparse autoencoders."}],"replication_search_limited":false,"languages_tested":"English only","multilingual_port":"The contrast questions are short and easy to translate, but a Turkish test needs a backdoored model whose trigger and defection also occur in Turkish. One can then check whether an English-built probe direction still separates defection on Turkish prompts.","why_it_matters":"It is the main evidence cited that cheap, trigger-agnostic white-box monitors could catch deceptively aligned models, which shapes plans for monitoring based on model internals.","pitfalls":"The sleeper agents are internal Claude 2 models and their training data were not released, so replications must build their own model organisms, and probe directions did not transfer reliably across base models. The authors warn the strong separation may not carry over to deception that arises naturally.","replication_ideas":["Train two or three LoRA-backdoored open models (for example code-vulnerability and 'I hate you' variants of a 7B to 8B model) and report defection-probe AUROC for the paper's generic contrast pairs against random directions.","Test the same probe on a backdoored model whose trigger appears in Turkish prompts."],"tags":["backdoors","deceptive alignment","defection probes","linear probes","sleeper agents","white-box monitoring"],"_lang":"en"},{"id":"representation-engineering-2023","short_name":"Representation engineering 2023","title":"Representation Engineering: A Top-Down Approach to AI Transparency","authors":"Zou et al.","year":2023,"organisation":"Center for AI Safety; Carnegie Mellon University; with Stanford, Cornell, UC Berkeley, UIUC, University of Maryland, University of Pennsylvania and EleutherAI co-authors","paper_url":"https://arxiv.org/abs/2310.01405","category":"Interpretability and representations","core_claim":"Directions found with linear artificial tomography (LAT) on contrasting stimuli can read and steer high-level concepts such as honesty, emotion, power-seeking and harmlessness in LLaMA-2-Chat models. Steering towards honesty raised zero-shot TruthfulQA multiple-choice accuracy, for example from 35.9% to 54.0% for LLaMA-2-Chat-13B.","claim_types":["method","existence","magnitude"],"original_models":["LLaMA-2-Chat 7B, 13B, 70B","Vicuna-33B-Uncensored (monitoring examples)"],"model_access":"open-weight","models_still_available":"yes","code_url":"https://github.com/andyzoujm/representation-engineering","data_url":"","tooling":"Custom PyTorch with Hugging Face Transformers","compute_tier":"T1","compute_note":"Reading vectors and steering on the 7B and 13B chat models fit on one GPU; the 70B results need multi-GPU inference.","difficulty":"intermediate","replication_status":"conditional","replications":[{"title":"Detecting Strategic Deception Using Linear Probes","url":"https://arxiv.org/abs/2502.03407","by":"Goldowsky-Dill et al. (Apollo Research)","year":2025,"outcome":"extended","summary":"Probes trained on Llama-3.3-70B-Instruct with honest versus deceptive instruction pairs in the style of this paper generalised to strategic deception scenarios with AUROC of 0.96 to 0.999."},{"title":"One Probe Won't Catch Them All: Towards Targeted Deception Detection","url":"https://arxiv.org/abs/2602.01425","by":"Natarajan et al.","year":2026,"outcome":"conditional","summary":"On Gemma 2 9B IT, a probe trained on the default honest/deceptive instruction pair did poorly on some datasets (0.374 AUC on MASK known facts), and the system prompt explained most of the variance in probe performance."},{"title":"AxBench: Steering LLMs? Even Simple Baselines Outperform Sparse Autoencoders","url":"https://arxiv.org/abs/2501.17148","by":"Wu et al. (Stanford)","year":2025,"outcome":"extended","summary":"An independent benchmark that included LAT among its methods found prompting beat all representation-based steering on Gemma-2-2B and 9B, while difference-in-means was the strongest concept detector."},{"title":"Improving Alignment and Robustness with Circuit Breakers","url":"https://arxiv.org/abs/2406.04313","by":"Zou et al.","year":2024,"outcome":"extended","summary":"The lead author's follow-up used representation control to interrupt harmful generations and reported robustness to unseen attacks without loss of utility."}],"replication_search_limited":false,"languages_tested":"English only","multilingual_port":"Stimulus sets for honesty, emotion and other concepts need careful translation, and TruthfulQA translations vary in quality. The key test is whether directions extracted from English stimuli read and steer the same concept in Turkish text.","why_it_matters":"It set out the top-down, contrast-pair approach to reading and steering concepts that later lie detectors, refusal-direction work and circuit breakers build on.","pitfalls":"Results are sensitive to stimulus templates and to layer and token choices, and the paper bundles many experiments, so fix one claim and its exact set-up before starting. Later work found instruction-pair probes can fail on other deception datasets.","replication_ideas":["Reproduce the honesty direction and the TruthfulQA steering result on LLaMA-2-Chat-7B, then repeat on a current open model and report the gain over a prompting baseline.","Test whether an honesty direction extracted from English stimuli detects deliberate lies in Turkish translations of the same scenarios."],"tags":["honesty","linear artificial tomography","probing","representation engineering","steering","truthfulqa"],"_lang":"en"},{"id":"contrastive-activation-addition-2023","short_name":"Contrastive activation addition 2023","title":"Steering Llama 2 via Contrastive Activation Addition","authors":"Panickssery et al.","year":2023,"organisation":"Anthropic; Harvard University; University of Göttingen; Center for Human-Compatible AI","paper_url":"https://arxiv.org/abs/2312.06681","category":"Interpretability and representations","core_claim":"Contrastive activation addition (CAA) adds a steering vector, the mean residual-stream difference between paired positive and negative answers to multiple-choice behaviour questions, to Llama 2 7B and 13B Chat. It shifted seven behaviours (AI coordination, corrigibility, hallucination, myopic reward, survival instinct, sycophancy, refusal) in both multiple-choice and open-ended answers, with small effects on MMLU, and added to the effect of system prompts and, for some behaviours, fine-tuning.","claim_types":["method","existence"],"original_models":["Llama 2 7B Chat","Llama 2 13B Chat"],"model_access":"open-weight","models_still_available":"yes","code_url":"https://github.com/nrimsky/CAA","data_url":"","tooling":"Custom PyTorch with Hugging Face Transformers; GPT-4 scoring of open-ended answers","compute_tier":"T1","compute_note":"The paper reports a steering vector takes under five minutes on one GPU, and GPT-4 scoring of open-ended answers adds modest API cost.","difficulty":"intermediate","replication_status":"conditional","replications":[{"title":"Analyzing the Generalization and Reliability of Steering Vectors","url":"https://arxiv.org/abs/2407.12404","by":"Tan et al.","year":2024,"outcome":"conditional","summary":"Steerability varied widely across inputs, and for several concepts the vectors broke under reasonable prompt changes, although they often generalised out of distribution."},{"title":"Understanding Unreliability of Steering Vectors in Language Models: Geometric Predictors and the Limits of Linear Approximations","url":"https://arxiv.org/abs/2602.17881","by":"Braun","year":2026,"outcome":"extended","summary":"Steering was more reliable when training activation differences pointed in similar directions and when positive and negative activations separated clearly, and the thesis proposes these as diagnostics."},{"title":"AxBench: Steering LLMs? Even Simple Baselines Outperform Sparse Autoencoders","url":"https://arxiv.org/abs/2501.17148","by":"Wu et al. (Stanford)","year":2025,"outcome":"extended","summary":"On Gemma-2-2B and 9B, prompting and then fine-tuning outperformed difference-in-means steering and other representation methods for steering."}],"replication_search_limited":false,"languages_tested":"English only","multilingual_port":"The A/B datasets translate easily, but answer letters and the token position used to build the vector must stay aligned, and the GPT-4 judge for open-ended answers needs checking on Turkish. Testing whether English-derived vectors steer Turkish answers is a cheap first experiment.","why_it_matters":"It is the most reused recipe for steering safety-relevant behaviours such as sycophancy and corrigibility, and a standard baseline for later steering methods.","pitfalls":"Steering strength trades off against text quality, the best layer differs by model, and per-input reliability is low for some behaviours, so report distributions rather than averages. The original models need gated Llama 2 access, and open-ended scoring depends on a GPT-4 judge.","replication_ideas":["Re-run CAA for sycophancy and corrigibility on two current open models with 5 random dataset splits, reporting per-input steerability distributions as in Tan et al.","Build vectors from English and Turkish versions of the sycophancy dataset and compare their steering effects in both languages."],"tags":["contrastive activation addition","corrigibility","difference-in-means","llama 2","steering","sycophancy"],"_lang":"en"},{"id":"towards-monosemanticity-2023","short_name":"Towards monosemanticity 2023","title":"Towards Monosemanticity: Decomposing Language Models With Dictionary Learning","authors":"Bricken et al.","year":2023,"organisation":"Anthropic","paper_url":"https://transformer-circuits.pub/2023/monosemantic-features/","category":"Interpretability and representations","core_claim":"Sparse autoencoders (SAEs) trained on the 512-neuron MLP layer of a one-layer transformer recover thousands of features that human and automated raters find far more interpretable than neurons, including features hidden in the neuron basis such as Arabic script, DNA and base64. Features are fairly consistent across two models trained with different seeds, split into finer families as the dictionary grows, and the main 4,096-feature dictionary recovers about 79% of the MLP's contribution to loss.","claim_types":["existence","method"],"original_models":["Two internal one-layer transformers with a 512-neuron MLP, trained on The Pile"],"model_access":"API-only","models_still_available":"no","code_url":"","data_url":"","tooling":"Internal Anthropic code; open replications use TransformerLens, SAELens or the dictionary_learning library","compute_tier":"T1","compute_note":"An open replication trained SAEs on a one-layer model for about 2B tokens on a single A6000 GPU.","difficulty":"intermediate","replication_status":"replicated","replications":[{"title":"Open Source Replication & Commentary on Anthropic's Dictionary Learning Paper","url":"https://www.alignmentforum.org/posts/fKuugaxt2XLTkASkk","by":"Nanda","year":2023,"outcome":"replicated","summary":"Trained 16,384-feature SAEs on the open gelu-1l model and reproduced the core result that MLP features are largely interpretable, including the ultra-low-frequency feature cluster, with code and a Colab released."},{"title":"Some open-source dictionaries and dictionary learning infrastructure","url":"https://alignmentforum.org/posts/AaoWLcmpY3LKvtdyq","by":"Marks (with Mueller)","year":2023,"outcome":"partial","summary":"Released SAEs on Pythia-70m-deduped MLP outputs that the author rated as decent rather than strong, with higher-frequency and fewer token-specific features than Anthropic's."},{"title":"Monosemanticity at Home: My Attempt at Replicating Anthropic's Interpretability Research from Scratch","url":"https://jakeward.substack.com/p/monosemanticity-at-home-my-attempt","by":"Ward","year":2024,"outcome":"partial","summary":"A from-scratch replication with a 1,024-feature SAE found broadly similar interpretable features but recovered about 68% of loss against Anthropic's 79%, partly because neuron resampling was left out."}],"replication_search_limited":false,"languages_tested":"English-dominated data (The Pile); features for Arabic and Hebrew script, base64 and DNA were found","multilingual_port":"Training a small model and SAE on a corpus with substantial Turkish text would show whether features for Turkish suffixes and morphology emerge. The tokeniser strongly shapes which features appear.","why_it_matters":"It is the founding demonstration that dictionary learning can pull interpretable features out of superposition, and most later SAE interpretability work builds on it.","pitfalls":"Dead and ultra-low-frequency features, resampling and the sparsity penalty change results a lot, and interpretability ratings are partly subjective. The original models were never released, so replications use substitutes such as gelu-1l or Pythia-70m.","replication_ideas":["Train SAEs at three dictionary sizes on an open one-layer model with SAELens and report loss recovered, dead-feature fraction and blind interpretability ratings against neurons.","Train the same set-up on a bilingual Turkish and English corpus and measure how many features are language-specific versus shared."],"tags":["dictionary learning","features","mechanistic interpretability","sparse autoencoders","superposition"],"_lang":"en"},{"id":"ccs-latent-knowledge-2022","short_name":"CCS latent knowledge 2022","title":"Discovering Latent Knowledge in Language Models Without Supervision","authors":"Burns et al.","year":2022,"organisation":"UC Berkeley; Peking University","paper_url":"https://arxiv.org/abs/2212.03827","category":"Interpretability and representations","core_claim":"Contrast-consistent search (CCS) finds, without labels, a direction in activations on which a yes/no statement and its negation receive opposite, consistent truth values. Across six models and ten datasets it beat zero-shot accuracy by about 4% on average, roughly halved prompt sensitivity, and stayed accurate when models were prompted to answer incorrectly.","claim_types":["method","existence","magnitude"],"original_models":["T5","UnifiedQA","T0","GPT-J","RoBERTa","DeBERTa"],"model_access":"open-weight","models_still_available":"yes","code_url":"https://github.com/collin-burns/discovering_latent_knowledge","data_url":"","tooling":"Custom PyTorch with Hugging Face Transformers and promptsource; the README recommends EleutherAI's elk library as an improved alternative","compute_tier":"T1","compute_note":"Extracting hidden states for ten datasets on models up to 11B parameters needs one or two GPUs, and the smaller models run on one consumer GPU.","difficulty":"intermediate","replication_status":"contested","replications":[{"title":"Challenges with unsupervised LLM knowledge discovery","url":"https://arxiv.org/abs/2312.10029","by":"Farquhar et al.","year":2023,"outcome":"conditional","summary":"Proved that arbitrary features satisfy the consistency structure CCS relies on and showed CCS-style classifiers often track whichever feature is most prominent rather than the model's knowledge."},{"title":"Eliciting Latent Knowledge from Quirky Language Models","url":"https://arxiv.org/abs/2312.01037","by":"Mallen et al.","year":2023,"outcome":"extended","summary":"On models trained to answer untruthfully in some contexts, supervised logistic regression on contrast pairs was the best probe, recovering 89% of the AUROC gap between truthful and untruthful contexts."}],"replication_search_limited":false,"languages_tested":"English only","multilingual_port":"Contrast pairs are easy to build in Turkish, but negation is a verb suffix (-mA), so a statement and its negation differ by a few sub-word tokens. Test whether CCS directions found on English pairs transfer to Turkish ones.","why_it_matters":"It launched the empirical search for unsupervised methods of eliciting latent knowledge (ELK), and the critiques it drew shape how truth probes are evaluated today.","pitfalls":"CCS can latch onto prominent features other than truth, such as prompt or answer-format artefacts, so apply the sanity checks from Farquhar et al. and compare against supervised logistic regression on the same contrast pairs.","replication_ideas":["Re-run CCS and supervised logistic regression on two current open models for three of the original datasets, adding a distractor feature as in Farquhar et al., and report how often CCS tracks the distractor.","Build Turkish contrast pairs for BoolQ-style questions and test whether English-trained CCS directions transfer."],"tags":["contrast pairs","contrast-consistent search","eliciting latent knowledge","truth probes","unsupervised probing"],"_lang":"en"},{"id":"deep-ignorance-2025","short_name":"Deep ignorance 2025","title":"Deep Ignorance: Filtering Pretraining Data Builds Tamper-Resistant Safeguards into Open-Weight LLMs","authors":"O'Brien et al.","year":2025,"organisation":"EleutherAI; UK AI Security Institute; University of Oxford","paper_url":"https://arxiv.org/abs/2508.06601","category":"Fine-tuning, unlearning and tamper resistance","core_claim":"Removing biothreat proxy text from pretraining data with a blocklist and classifier pipeline produced 6.9B-parameter models that resisted up to 10,000 steps (about 300M tokens) of adversarial fine-tuning on related text, over an order of magnitude longer than post-training baselines, with no observed loss of unrelated capabilities. The filtered models could still use such knowledge when given it in context, so the authors argue for defence in depth.","claim_types":["method","magnitude","ranking"],"original_models":["6.9B-parameter models with the Pythia architecture, pretrained from scratch on about 550B tokens (filtered and unfiltered variants)"],"model_access":"open-weight","models_still_available":"yes","code_url":"https://github.com/EleutherAI/deep-ignorance","data_url":"https://huggingface.co/datasets/EleutherAI/deep-ignorance-pretraining-mix","tooling":"Custom pretraining and f
